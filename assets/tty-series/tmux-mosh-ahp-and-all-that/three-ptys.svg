<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
<title>Three stacked ptys between a laptop and a tmux pane</title>
<desc>Running tmux over ssh puts three pseudo-terminals between your keyboard and your shell. The laptop pty is held by Ghostty and ssh and is in raw mode. The host pty is held by sshd and the tmux client and is also raw. The tmux server holds a duplicate of that host pty fd along with every pane master. The pane pty is held by the tmux server and bash, and is the only one in cooked mode. Echo travels back up the whole chain from the pane pty.</desc>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="100" y="30" width="700" height="150" rx="14" fill="none" stroke="#AAA9A2" stroke-width="1" stroke-dasharray="5 5"/>
<text x="784" y="56" text-anchor="end" font-size="13" fill="#9A998F">Laptop A</text>

<rect x="220" y="64" width="460" height="76" rx="10" fill="#2A6B52"/>
<text x="450" y="94" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">laptop pty</text>
<text x="244" y="122" font-size="13" fill="#BFDCCE">master: Ghostty</text>
<text x="656" y="122" text-anchor="end" font-size="13" fill="#BFDCCE">slave: ssh</text>
<rect x="700" y="89" width="84" height="26" rx="6" fill="none" stroke="#9C4229" stroke-width="1.2"/>
<text x="742" y="107" text-anchor="middle" font-size="13" fill="#9C4229">raw</text>

<line x1="450" y1="148" x2="450" y2="246" stroke="#9A998F" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="470" y="203" font-size="13" fill="#9A998F">ssh · encrypted tcp</text>

<rect x="100" y="216" width="700" height="340" rx="14" fill="none" stroke="#AAA9A2" stroke-width="1" stroke-dasharray="5 5"/>
<text x="784" y="242" text-anchor="end" font-size="13" fill="#9A998F">Host machine</text>

<rect x="220" y="252" width="460" height="76" rx="10" fill="#2A6B52"/>
<text x="450" y="282" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">host pty</text>
<text x="244" y="310" font-size="13" fill="#BFDCCE">master: sshd</text>
<text x="656" y="310" text-anchor="end" font-size="13" fill="#BFDCCE">slave: tmux client</text>
<rect x="700" y="277" width="84" height="26" rx="6" fill="none" stroke="#9C4229" stroke-width="1.2"/>
<text x="742" y="295" text-anchor="middle" font-size="13" fill="#9C4229">raw</text>

<line x1="450" y1="328" x2="450" y2="348" stroke="#9A998F" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="220" y="354" width="460" height="56" rx="10" fill="#4A3AC8"/>
<text x="450" y="378" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">tmux server</text>
<text x="450" y="398" text-anchor="middle" font-size="13" fill="#C9C2F2">holds a dup of the host pty fd, and every pane master</text>

<line x1="450" y1="410" x2="450" y2="430" stroke="#9A998F" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="220" y="436" width="460" height="76" rx="10" fill="#2A6B52"/>
<text x="450" y="466" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">pane pty</text>
<text x="244" y="494" font-size="13" fill="#BFDCCE">master: tmux server</text>
<text x="656" y="494" text-anchor="end" font-size="13" fill="#BFDCCE">slave: bash</text>
<rect x="700" y="461" width="84" height="26" rx="6" fill="#9C4229"/>
<text x="742" y="479" text-anchor="middle" font-size="13" fill="#FFFFFF">cooked</text>

<line x1="180" y1="440" x2="180" y2="152" stroke="#9A998F" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="168" y="300" text-anchor="end" font-size="13" fill="#9A998F">echo</text>

<text x="450" y="592" text-anchor="middle" font-size="13" fill="#8A897F">three ptys, three line disciplines — only the innermost one cooks</text>
</svg>
