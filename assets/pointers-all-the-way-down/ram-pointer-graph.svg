<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="In RAM, every object hangs off a few registers" xmlns:c2pa="http://c2pa.org/manifest"><title>In RAM, every object hangs off a few registers</title>
<style>
  .bg{fill:#ffffff}
  .t{font:13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .tb{font:600 13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .ts{font:11.5px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
  .h{font:600 17px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .hs{font:600 14px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .m{font:12px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#1f2328}
  .ms{font:11px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#59636e}
  .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.25}
  .band{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
  .free{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .cv{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
  .cp{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
  .co{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .lv{fill:none;stroke:#0969da;stroke-width:1.5}
  .lp{fill:none;stroke:#bc4c00;stroke-width:1.5}
  .lo{fill:none;stroke:#8250df;stroke-width:1.5}
  .le{fill:none;stroke:#6e7781;stroke-width:1.25}
  .ld{fill:none;stroke:#6e7781;stroke-width:1.25;stroke-dasharray:5 4}
  .av{fill:#0969da}.ap{fill:#bc4c00}.ao{fill:#8250df}.ae{fill:#6e7781}
  .dv{fill:#0969da}.dp{fill:#bc4c00}.do{fill:#8250df}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t,.tb,.h,.hs,.m{fill:#e6edf3}
    .ts,.ms{fill:#9198a1}
    .box{fill:#0d1117;stroke:#6e7681}
    .band{fill:#151b23;stroke:#3d444d}
    .free{stroke:#6e7681}
    .cv{fill:#0c2d6b;stroke:#4493f8}
    .cp{fill:#3d1d00;stroke:#f0883e}
    .co{fill:#2e1a52;stroke:#ab7df8}
    .lv{stroke:#4493f8}.lp{stroke:#f0883e}.lo{stroke:#ab7df8}.le,.ld{stroke:#9198a1}
    .av,.dv{fill:#4493f8}.ap,.dp{fill:#f0883e}.ao,.do{fill:#ab7df8}.ae{fill:#9198a1}
  }
</style>
<defs>
  <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="av" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ap" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ao" d="M0 0L10 5L0 10z"/></marker>
  <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ae" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="760" height="640"/><text class="h" x="24" y="34" text-anchor="start">In RAM, every object hangs off a few registers</text><path class="lv" d="M24 56 L52 56" marker-end="url(#mv)"/><text class="ts" x="60" y="60" text-anchor="start">pointer = absolute virtual address (8 bytes)</text><path class="le" d="M365.2 56 L393.2 56" marker-end="url(#me)"/><text class="ts" x="401.2" y="60" text-anchor="start">register / translation</text><text class="hs" x="24" y="94" text-anchor="start">CPU registers</text><rect class="box" x="24" y="118" width="128" height="28" rx="4"/><text class="m" x="88.0" y="136.0" text-anchor="middle">RIP</text><rect class="box" x="24" y="264" width="128" height="28" rx="4"/><text class="m" x="88.0" y="282.0" text-anchor="middle">RSP</text><rect class="box" x="24" y="548" width="128" height="28" rx="4"/><text class="m" x="88.0" y="566.0" text-anchor="middle">CR3</text><rect class="box" x="196" y="80" width="540" height="412" rx="8"/><text class="ts" x="212" y="100" text-anchor="start">virtual address space of one process</text><rect class="band" x="206" y="110" width="520" height="44" rx="6"/><text class="ms" x="716" y="128" text-anchor="end">.text</text><rect class="box" x="260" y="118" width="250" height="28" rx="4"/><text class="m" x="385.0" y="136.0" text-anchor="middle">fn lookup(map, key) { … }</text><rect class="band" x="206" y="164" width="520" height="56" rx="6"/><text class="ms" x="216" y="182" text-anchor="start">.data</text><rect class="box" x="500" y="176" width="140" height="28" rx="4"/><text class="m" x="570.0" y="194.0" text-anchor="middle">static INDEX:</text><rect class="cv" x="640" y="176" width="76" height="28" rx="4"/><text class="m" x="678.0" y="194.0" text-anchor="middle">ptr</text><rect class="band" x="206" y="230" width="520" height="72" rx="6"/><text class="ms" x="216" y="248" text-anchor="start">stack (grows down)</text><rect class="cv" x="216" y="264" width="56" height="28" rx="4"/><text class="m" x="244.0" y="282.0" text-anchor="middle">ptr</text><rect class="box" x="272" y="264" width="56" height="28" rx="4"/><text class="m" x="300.0" y="282.0" text-anchor="middle">len=3</text><text class="ts" x="244" y="310" text-anchor="start"></text><rect class="box" x="328" y="264" width="92" height="28" rx="4"/><text class="m" x="374.0" y="282.0" text-anchor="middle">saved rbp</text><rect class="cv" x="420" y="264" width="82" height="28" rx="4"/><text class="m" x="461.0" y="282.0" text-anchor="middle">ret addr</text><text class="ts" x="512" y="282" text-anchor="start">key: &amp;str = (ptr, len)</text><rect class="band" x="206" y="312" width="520" height="170" rx="6"/><text class="ms" x="216" y="330" text-anchor="start">heap</text><text class="ts" x="262" y="344" text-anchor="start">hash map: control bytes + slots of (key ptr, value ptr)</text><rect class="box" x="366" y="372" width="52" height="28" rx="4"/><text class="m" x="392.0" y="390.0" text-anchor="middle">ctrl</text><rect class="cv" x="418" y="372" width="48" height="28" rx="4"/><text class="m" x="442.0" y="390.0" text-anchor="middle">k</text><rect class="cv" x="466" y="372" width="48" height="28" rx="4"/><text class="m" x="490.0" y="390.0" text-anchor="middle">v</text><rect class="cv" x="514" y="372" width="48" height="28" rx="4"/><text class="m" x="538.0" y="390.0" text-anchor="middle">k</text><rect class="cv" x="562" y="372" width="48" height="28" rx="4"/><text class="m" x="586.0" y="390.0" text-anchor="middle">v</text><rect class="box" x="610" y="372" width="50" height="28" rx="4"/><text class="m" x="635.0" y="390.0" text-anchor="middle">…</text><rect class="box" x="216" y="436" width="76" height="28" rx="4"/><text class="m" x="254.0" y="454.0" text-anchor="middle">"abc"</text><rect class="box" x="392" y="436" width="92" height="28" rx="4"/><text class="m" x="438.0" y="454.0" text-anchor="middle">Node: val</text><rect class="cv" x="484" y="436" width="58" height="28" rx="4"/><text class="m" x="513.0" y="454.0" text-anchor="middle">next</text><rect class="box" x="574" y="436" width="92" height="28" rx="4"/><text class="m" x="620.0" y="454.0" text-anchor="middle">Node: val</text><rect class="box" x="666" y="436" width="50" height="28" rx="4"/><text class="m" x="691.0" y="454.0" text-anchor="middle">null</text><path class="lv" d="M244 292 L244 436" marker-end="url(#mv)"/><circle class="dv" cx="244" cy="292" r="3"/><path class="lv" d="M442 400 L442 412 L270 412 L270 436" marker-end="url(#mv)"/><circle class="dv" cx="442" cy="400" r="3"/><path class="lv" d="M490 400 L490 424 L430 424 L430 436" marker-end="url(#mv)"/><circle class="dv" cx="490" cy="400" r="3"/><path class="lv" d="M542 450 L574 450" marker-end="url(#mv)"/><circle class="dv" cx="542" cy="450" r="3"/><path class="lv" d="M678 204 L678 358 L392 358 L392 372" marker-end="url(#mv)"/><circle class="dv" cx="678" cy="204" r="3"/><path class="lv" d="M461 264 L461 146" marker-end="url(#mv)"/><circle class="dv" cx="461" cy="264" r="3"/><text class="ts" x="468" y="226" text-anchor="start"></text><path class="le" d="M152 132 L260 132" marker-end="url(#me)"/><path class="le" d="M152 278 L216 278" marker-end="url(#me)"/><text class="ts" x="196" y="522" text-anchor="start">every address above is virtual; hardware translates it on each access</text><rect class="box" x="196" y="548" width="76" height="28" rx="4"/><text class="m" x="234.0" y="566.0" text-anchor="middle">PML4</text><rect class="box" x="296" y="548" width="76" height="28" rx="4"/><text class="m" x="334.0" y="566.0" text-anchor="middle">PDPT</text><rect class="box" x="396" y="548" width="76" height="28" rx="4"/><text class="m" x="434.0" y="566.0" text-anchor="middle">PD</text><rect class="box" x="496" y="548" width="76" height="28" rx="4"/><text class="m" x="534.0" y="566.0" text-anchor="middle">PT</text><rect class="box" x="596" y="548" width="140" height="28" rx="4"/><text class="m" x="666.0" y="566.0" text-anchor="middle">physical frame</text><path class="le" d="M152 562 L196 562" marker-end="url(#me)"/><path class="le" d="M272 562 L296 562" marker-end="url(#me)"/><path class="le" d="M372 562 L396 562" marker-end="url(#me)"/><path class="le" d="M472 562 L496 562" marker-end="url(#me)"/><path class="le" d="M572 562 L596 562" marker-end="url(#me)"/><text class="ts" x="196" y="604" text-anchor="start">The TLB caches finished walks, so a hit costs nothing visible; a miss costs up to four</text><text class="ts" x="196" y="620" text-anchor="start">memory loads; a page fault hands control to the kernel.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>