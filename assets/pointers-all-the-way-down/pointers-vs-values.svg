<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" role="img" aria-label="A lookup follows pointers physically; a join resolves values by searching" xmlns:c2pa="http://c2pa.org/manifest"><title>A lookup follows pointers physically; a join resolves values by searching</title>
<style>
  .bg{fill:#ffffff}
  .t{font:13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .tb{font:600 13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .ts{font:11.5px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
  .h{font:600 17px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .hs{font:600 14px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .m{font:12px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#1f2328}
  .ms{font:11px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#59636e}
  .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.25}
  .band{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
  .free{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .cv{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
  .cp{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
  .co{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .lv{fill:none;stroke:#0969da;stroke-width:1.5}
  .lp{fill:none;stroke:#bc4c00;stroke-width:1.5}
  .lo{fill:none;stroke:#8250df;stroke-width:1.5}
  .le{fill:none;stroke:#6e7781;stroke-width:1.25}
  .ld{fill:none;stroke:#6e7781;stroke-width:1.25;stroke-dasharray:5 4}
  .av{fill:#0969da}.ap{fill:#bc4c00}.ao{fill:#8250df}.ae{fill:#6e7781}
  .dv{fill:#0969da}.dp{fill:#bc4c00}.do{fill:#8250df}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t,.tb,.h,.hs,.m{fill:#e6edf3}
    .ts,.ms{fill:#9198a1}
    .box{fill:#0d1117;stroke:#6e7681}
    .band{fill:#151b23;stroke:#3d444d}
    .free{stroke:#6e7681}
    .cv{fill:#0c2d6b;stroke:#4493f8}
    .cp{fill:#3d1d00;stroke:#f0883e}
    .co{fill:#2e1a52;stroke:#ab7df8}
    .lv{stroke:#4493f8}.lp{stroke:#f0883e}.lo{stroke:#ab7df8}.le,.ld{stroke:#9198a1}
    .av,.dv{fill:#4493f8}.ap,.dp{fill:#f0883e}.ao,.do{fill:#ab7df8}.ae{fill:#9198a1}
  }
</style>
<defs>
  <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="av" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ap" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ao" d="M0 0L10 5L0 10z"/></marker>
  <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ae" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="760" height="596"/><text class="h" x="24" y="34" text-anchor="start">A lookup follows pointers physically; a join resolves values by searching</text><text class="hs" x="24" y="70" text-anchor="start">From a name to a row (Postgres)</text><path class="ld" d="M24 90 L52 90" marker-end="url(#me)"/><text class="ts" x="60" y="94" text-anchor="start">lookup by name or value</text><path class="lp" d="M232.9 90 L260.9 90" marker-end="url(#mp)"/><text class="ts" x="268.9" y="94" text-anchor="start">page number</text><path class="lo" d="M366.20000000000005 90 L394.20000000000005 90" marker-end="url(#mo)"/><text class="ts" x="402.20000000000005" y="94" text-anchor="start">byte offset</text><rect class="box" x="24" y="110" width="160" height="48" rx="6"/><text class="tb" x="104.0" y="130" text-anchor="middle">users_pkey</text><text class="ts" x="104.0" y="148" text-anchor="middle">a name in the query</text><rect class="box" x="208" y="110" width="160" height="48" rx="6"/><text class="tb" x="288.0" y="130" text-anchor="middle">catalog lookup</text><text class="ts" x="288.0" y="148" text-anchor="middle">pg_class row</text><rect class="box" x="392" y="110" width="160" height="48" rx="6"/><text class="tb" x="472.0" y="130" text-anchor="middle">relfilenode</text><text class="ts" x="472.0" y="148" text-anchor="middle">file base/&lt;db&gt;/&lt;oid&gt;</text><rect class="box" x="576" y="110" width="160" height="48" rx="6"/><text class="tb" x="656.0" y="130" text-anchor="middle">block 0: metapage</text><text class="ts" x="656.0" y="148" text-anchor="middle">root = 3</text><path class="ld" d="M184 134 L208 134" marker-end="url(#me)"/><path class="ld" d="M368 134 L392 134" marker-end="url(#me)"/><path class="ld" d="M552 134 L576 134" marker-end="url(#me)"/><rect class="box" x="576" y="198" width="160" height="48" rx="6"/><text class="tb" x="656.0" y="218" text-anchor="middle">page 3: root</text><text class="ts" x="656.0" y="236" text-anchor="middle">child page numbers</text><rect class="box" x="392" y="198" width="160" height="48" rx="6"/><text class="tb" x="472.0" y="218" text-anchor="middle">page 7: leaf</text><text class="ts" x="472.0" y="236" text-anchor="middle">key 101 → TID (17, 4)</text><rect class="box" x="208" y="198" width="160" height="48" rx="6"/><text class="tb" x="288.0" y="218" text-anchor="middle">heap page 17</text><text class="ts" x="288.0" y="236" text-anchor="middle">slot 4 → byte offset</text><rect class="box" x="24" y="198" width="160" height="48" rx="6"/><text class="tb" x="104.0" y="218" text-anchor="middle">tuple</text><text class="ts" x="104.0" y="236" text-anchor="middle">the row itself</text><path class="lp" d="M656 158 L656 198" marker-end="url(#mp)"/><circle class="dp" cx="656" cy="158" r="3"/><path class="lp" d="M576 222 L552 222" marker-end="url(#mp)"/><circle class="dp" cx="576" cy="222" r="3"/><path class="lp" d="M392 222 L368 222" marker-end="url(#mp)"/><circle class="dp" cx="392" cy="222" r="3"/><path class="lo" d="M208 222 L184 222" marker-end="url(#mo)"/><circle class="do" cx="208" cy="222" r="3"/><text class="ts" x="24" y="274" text-anchor="start">After the first three hops, every arrow is a pointer dereferenced through the buffer pool.</text><line x1="24" y1="298" x2="736" y2="298" stroke="#d1d9e0" stroke-width="1"/><text class="hs" x="24" y="328" text-anchor="start">A foreign key is a pointer you resolve by searching</text><text class="tb" x="24" y="356" text-anchor="start">Navigational (IMS, CODASYL) or graph (Neo4j)</text><text class="tb" x="400" y="356" text-anchor="start">Relational</text><rect class="box" x="24" y="372" width="110" height="32" rx="4"/><text class="t" x="79.0" y="392.0" text-anchor="middle">order 7</text><rect class="cp" x="134" y="372" width="132" height="32" rx="4"/><text class="t" x="200.0" y="392.0" text-anchor="middle">customer →</text><rect class="box" x="24" y="496" width="242" height="32" rx="4"/><text class="t" x="145.0" y="516.0" text-anchor="middle">customer 42 record</text><path class="lp" d="M200 404 L200 496" marker-end="url(#mp)"/><circle class="dp" cx="200" cy="404" r="3"/><text class="ts" x="212" y="454" text-anchor="start">one dereference</text><text class="ts" x="24" y="554" text-anchor="start">Cheap to follow. Moving a record means</text><text class="ts" x="24" y="570" text-anchor="start">fixing every pointer that refers to it.</text><rect class="box" x="400" y="372" width="110" height="32" rx="4"/><text class="t" x="455.0" y="392.0" text-anchor="middle">order 7</text><rect class="box" x="510" y="372" width="160" height="32" rx="4"/><text class="m" x="590.0" y="392.0" text-anchor="middle">customer_id = 42</text><rect class="box" x="470" y="424" width="220" height="48" rx="6"/><text class="tb" x="580.0" y="444" text-anchor="middle">search customers_pkey</text><text class="ts" x="580.0" y="462" text-anchor="middle">root → leaf → TID</text><rect class="box" x="470" y="496" width="220" height="32" rx="4"/><text class="t" x="580.0" y="516.0" text-anchor="middle">customer 42 row</text><path class="ld" d="M590 404 L590 424" marker-end="url(#me)"/><path class="lp" d="M590 472 L590 496" marker-end="url(#mp)"/><circle class="dp" cx="590" cy="472" r="3"/><text class="ts" x="400" y="554" text-anchor="start">O(log n) page visits per hop, top levels cached.</text><text class="ts" x="400" y="570" text-anchor="start">Rows move freely; only indexes store locations.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>