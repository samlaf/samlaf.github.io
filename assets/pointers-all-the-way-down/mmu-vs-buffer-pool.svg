<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="A buffer pool is virtual memory reimplemented in software" xmlns:c2pa="http://c2pa.org/manifest"><title>A buffer pool is virtual memory reimplemented in software</title>
<style>
  .bg{fill:#ffffff}
  .t{font:13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .tb{font:600 13px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .ts{font:11.5px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
  .h{font:600 17px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .hs{font:600 14px Inter,ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .m{font:12px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#1f2328}
  .ms{font:11px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#59636e}
  .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.25}
  .band{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
  .free{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .cv{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
  .cp{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
  .co{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .lv{fill:none;stroke:#0969da;stroke-width:1.5}
  .lp{fill:none;stroke:#bc4c00;stroke-width:1.5}
  .lo{fill:none;stroke:#8250df;stroke-width:1.5}
  .le{fill:none;stroke:#6e7781;stroke-width:1.25}
  .ld{fill:none;stroke:#6e7781;stroke-width:1.25;stroke-dasharray:5 4}
  .av{fill:#0969da}.ap{fill:#bc4c00}.ao{fill:#8250df}.ae{fill:#6e7781}
  .dv{fill:#0969da}.dp{fill:#bc4c00}.do{fill:#8250df}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t,.tb,.h,.hs,.m{fill:#e6edf3}
    .ts,.ms{fill:#9198a1}
    .box{fill:#0d1117;stroke:#6e7681}
    .band{fill:#151b23;stroke:#3d444d}
    .free{stroke:#6e7681}
    .cv{fill:#0c2d6b;stroke:#4493f8}
    .cp{fill:#3d1d00;stroke:#f0883e}
    .co{fill:#2e1a52;stroke:#ab7df8}
    .lv{stroke:#4493f8}.lp{stroke:#f0883e}.lo{stroke:#ab7df8}.le,.ld{stroke:#9198a1}
    .av,.dv{fill:#4493f8}.ap,.dp{fill:#f0883e}.ao,.do{fill:#ab7df8}.ae{fill:#9198a1}
  }
</style>
<defs>
  <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="av" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ap" d="M0 0L10 5L0 10z"/></marker>
  <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ao" d="M0 0L10 5L0 10z"/></marker>
  <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ae" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="760" height="470"/><text class="h" x="24" y="34" text-anchor="start">A buffer pool is virtual memory reimplemented in software</text><text class="hs" x="24" y="64" text-anchor="start">In memory: the hardware MMU</text><text class="hs" x="400" y="64" text-anchor="start">In a database: the buffer pool</text><rect class="cv" x="24" y="108" width="190" height="36" rx="4"/><text class="m" x="119.0" y="130.0" text-anchor="middle">virtual address</text><rect class="cp" x="400" y="108" width="190" height="36" rx="4"/><text class="m" x="495.0" y="130.0" text-anchor="middle">(file, page_no)</text><path class="le" d="M119 144 L119 176" marker-end="url(#me)"/><path class="le" d="M495 144 L495 176" marker-end="url(#me)"/><rect class="box" x="24" y="176" width="190" height="48" rx="6"/><text class="tb" x="119.0" y="196" text-anchor="middle">TLB</text><text class="ts" x="119.0" y="214" text-anchor="middle">cached translations</text><rect class="box" x="400" y="176" width="190" height="48" rx="6"/><text class="tb" x="495.0" y="196" text-anchor="middle">mapping table</text><text class="ts" x="495.0" y="214" text-anchor="middle">a hash table: page id → frame</text><rect class="box" x="238" y="176" width="134" height="48" rx="6"/><text class="tb" x="305.0" y="196" text-anchor="middle">physical address</text><text class="ts" x="305.0" y="214" text-anchor="middle">load completes</text><rect class="cv" x="614" y="176" width="122" height="48" rx="6"/><text class="tb" x="675.0" y="196" text-anchor="middle">frame + offset</text><text class="ts" x="675.0" y="214" text-anchor="middle">= virtual address</text><path class="le" d="M214 200 L238 200" marker-end="url(#me)"/><path class="le" d="M590 200 L614 200" marker-end="url(#me)"/><text class="ts" x="226" y="192" text-anchor="middle">hit</text><text class="ts" x="602" y="192" text-anchor="middle">hit</text><path class="le" d="M119 224 L119 256" marker-end="url(#me)"/><path class="le" d="M495 224 L495 256" marker-end="url(#me)"/><text class="ts" x="127" y="244" text-anchor="start">miss</text><text class="ts" x="503" y="244" text-anchor="start">miss</text><rect class="box" x="24" y="256" width="190" height="48" rx="6"/><text class="tb" x="119.0" y="276" text-anchor="middle">page-table walk</text><text class="ts" x="119.0" y="294" text-anchor="middle">four levels from CR3</text><rect class="box" x="400" y="256" width="190" height="48" rx="6"/><text class="tb" x="495.0" y="276" text-anchor="middle">evict a victim frame</text><text class="ts" x="495.0" y="294" text-anchor="middle">write it back if dirty</text><path class="le" d="M214 280 L305 280 L305 224" marker-end="url(#me)"/><text class="ts" x="222" y="272" text-anchor="start">found</text><path class="le" d="M119 304 L119 336" marker-end="url(#me)"/><path class="le" d="M495 304 L495 336" marker-end="url(#me)"/><text class="ts" x="127" y="324" text-anchor="start">not present</text><rect class="box" x="24" y="336" width="190" height="48" rx="6"/><text class="tb" x="119.0" y="356" text-anchor="middle">page fault</text><text class="ts" x="119.0" y="374" text-anchor="middle">kernel fills page, retries</text><rect class="box" x="400" y="336" width="190" height="48" rx="6"/><text class="tb" x="495.0" y="356" text-anchor="middle">pread() into frame</text><text class="ts" x="495.0" y="374" text-anchor="middle">insert the mapping</text><path class="le" d="M590 360 L675 360 L675 224" marker-end="url(#me)"/><text class="ts" x="600" y="352" text-anchor="start">pin + latch</text><line x1="24" y1="408" x2="736" y2="408" stroke="#d1d9e0" stroke-width="1" class="rule"/><text class="ts" x="24" y="432" text-anchor="start">L1 hit ~1 ns · DRAM ~100 ns</text><text class="ts" x="400" y="432" text-anchor="start">hit: hash lookup + latch · miss: SSD read ~15 µs</text><text class="ts" x="24" y="452" text-anchor="start">Same shape on both sides: a cached fast path, a table lookup, and a fault that goes to storage.</text><path class="lv" d="M675 176 L675 96 L119 96 L119 108" marker-end="url(#mv)"/><circle class="dv" cx="675" cy="176" r="3"/><text class="ts" x="397" y="89" text-anchor="middle">the result is an ordinary pointer, so the MMU translates it next</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>