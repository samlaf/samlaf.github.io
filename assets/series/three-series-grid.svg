<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 984" width="1560" height="984" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><clipPath id="c1"><rect x="210" y="216" width="300" height="132" rx="8"/></clipPath><clipPath id="c2"><rect x="522" y="540" width="300" height="132" rx="8"/></clipPath></defs>
<rect width="1560" height="984" fill="#fdfdfc"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">One grid, three series</text>
<text x="36" y="64" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Columns are the stages one request passes through, from subject to object. Rows run in time order: what is written, what the request carries, the reference monitor it meets, and what that monitor looks up.</text>
<rect x="60" y="91" width="90" height="34" rx="6" fill="#fff" stroke="#334155" stroke-width="1.4"/>
<text x="105" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">subject</text>
<line x1="150" y1="108" x2="1458" y2="108" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="1462" y="91" width="84" height="34" rx="6" fill="#fff" stroke="#334155" stroke-width="1.4"/>
<text x="1504" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">object</text>
<circle cx="360" cy="108" r="5" fill="#334155"/>
<text x="360" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Designate</text>
<text x="360" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Which object does the name denote?</text>
<text x="360" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolve(namespace, name) → object | ⊥</text>
<circle cx="672" cy="108" r="5" fill="#334155"/>
<text x="672" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Reach</text>
<text x="672" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Can the request get there?</text>
<text x="672" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">route(source, address) → path | ⊥</text>
<circle cx="984" cy="108" r="5" fill="#334155"/>
<text x="984" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Authenticate</text>
<text x="984" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Who is asking?</text>
<text x="984" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify(claim, proof) → subject | ⊥</text>
<circle cx="1296" cy="108" r="5" fill="#334155"/>
<text x="1296" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Decide</text>
<text x="1296" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">May it do this?</text>
<text x="1296" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">f(s, a, r, ctx) → allow | deny</text>
<line x1="18" y1="220" x2="18" y2="812" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#aT)"/>
<text x="14" y="516" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 14 516)">time</text>
<text x="36" y="244" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Written</text>
<text x="36" y="264" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">set before the request,</text>
<text x="36" y="280" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">and who may write it</text>
<g clip-path="url(#c1)"><rect x="210" y="216" width="300" height="132" fill="#ececfb"/><path d="M510,216 L510,348 L210,348 z" fill="#e3f1f3"/></g>
<rect x="210" y="216" width="300" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="226" y="244" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Where names come from</text>
<text x="226" y="264" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">acquire, delegation, introduction</text>
<text x="226" y="282" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">service → node bindings</text>
<text x="496" y="334" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<text x="496" y="318" font-size="10" font-weight="600" fill="#5b5bd6" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY</text>
<rect x="522" y="216" width="300" height="132" rx="8" fill="#ececfb" stroke="#5b5bd6" stroke-width="1.2"/>
<text x="538" y="244" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Routes and attachment</text>
<text x="538" y="264" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">attachment point → path bindings</text>
<text x="538" y="282" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">who provisions the route</text>
<text x="808" y="334" font-size="10" font-weight="600" fill="#5b5bd6" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY</text>
<rect x="834" y="216" width="300" height="132" rx="8" fill="#ececfb" stroke="#5b5bd6" stroke-width="1.2"/>
<text x="850" y="244" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Name → key bindings</text>
<text x="850" y="264" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">certificates, accounts, attestation</text>
<text x="850" y="282" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">recovery: who may rewrite them</text>
<text x="850" y="334" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Karp: identification</text>
<text x="1120" y="334" font-size="10" font-weight="600" fill="#5b5bd6" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY</text>
<rect x="1146" y="216" width="300" height="132" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="244" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Facts and rules</text>
<text x="1162" y="264" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">PAP and attribute authorities</text>
<text x="1162" y="282" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">data models; who may write them</text>
<text x="1162" y="334" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Karp: authorization</text>
<text x="1432" y="334" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<text x="36" y="388" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Carried</text>
<text x="36" y="408" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">a copy the holder</text>
<text x="36" y="424" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">brings with the request</text>
<rect x="834" y="360" width="300" height="92" rx="8" fill="#ececfb" stroke="#5b5bd6" stroke-width="1.2"/>
<text x="850" y="388" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Materialized identity</text>
<text x="850" y="408" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">certificates, id_tokens, session cookies</text>
<text x="1120" y="438" font-size="10" font-weight="600" fill="#5b5bd6" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY</text>
<rect x="1146" y="360" width="300" height="92" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="388" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Materialized decision</text>
<text x="1162" y="408" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">scoped tokens, logon tokens</text>
<text x="1432" y="438" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<rect x="210" y="464" width="1236" height="64" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="492" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Several stages at once</text>
<text x="226" y="512" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">a capability designates, reaches and decides, and is judged by one reference monitor</text>
<text x="1432" y="514" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<text x="36" y="568" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Reference</text>
<text x="36" y="588" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">monitors</text>
<text x="36" y="608" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">met first: absence (⊥)</text>
<text x="36" y="624" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">or judgment (no)</text>
<rect x="210" y="540" width="300" height="132" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="568" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Who controls the namespace</text>
<text x="226" y="588" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">chroot, mount namespace,</text>
<text x="226" y="606" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">an import never supplied</text>
<text x="496" y="658" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<g clip-path="url(#c2)"><rect x="522" y="540" width="300" height="132" fill="#f9eee2"/><path d="M822,540 L822,672 L522,672 z" fill="#e3f1f3"/></g>
<rect x="522" y="540" width="300" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<text x="538" y="568" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">No way around</text>
<text x="538" y="588" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">no path, or every path passes a</text>
<text x="538" y="606" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">judge; a channel the wire</text>
<text x="538" y="624" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">cannot read or alter</text>
<text x="808" y="658" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<text x="808" y="642" font-size="10" font-weight="600" fill="#a55f22" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CRYPTO</text>
<rect x="834" y="540" width="300" height="132" rx="8" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="850" y="568" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Custody</text>
<text x="850" y="588" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">where keys live;</text>
<text x="850" y="606" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">bearer or key-bound</text>
<text x="1120" y="658" font-size="10" font-weight="600" fill="#a55f22" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CRYPTO</text>
<rect x="1146" y="540" width="300" height="132" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="568" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">The PEP</text>
<text x="1162" y="588" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">accepts the carrier, or asks;</text>
<text x="1162" y="606" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">NIST's Access Control Enforcement;</text>
<text x="1162" y="624" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">LSMs, gateways</text>
<text x="1432" y="658" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<text x="36" y="712" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Looked up</text>
<text x="36" y="732" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">the read path,</text>
<text x="36" y="748" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">only when needed</text>
<rect x="210" y="684" width="300" height="132" rx="8" fill="#ececfb" stroke="#5b5bd6" stroke-width="1.2"/>
<text x="226" y="712" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Resolution</text>
<text x="226" y="732" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">path walk, DNS</text>
<text x="496" y="802" font-size="10" font-weight="600" fill="#5b5bd6" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY</text>
<rect x="522" y="684" width="300" height="132" rx="8" fill="#fdfdfc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="538" y="712" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Routing</text>
<text x="538" y="732" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">route lookup; syscall boundary, IPC</text>
<text x="808" y="802" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">no series dwells here</text>
<rect x="834" y="684" width="300" height="132" rx="8" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="850" y="712" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Proof of possession</text>
<text x="850" y="732" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">look up the key, then check</text>
<text x="850" y="750" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">the handshake signature or passkey</text>
<text x="850" y="802" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Karp: authentication</text>
<text x="1120" y="802" font-size="10" font-weight="600" fill="#a55f22" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CRYPTO</text>
<rect x="1146" y="684" width="300" height="132" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="712" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Access decision</text>
<text x="1162" y="732" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">the PDP and PIP:</text>
<text x="1162" y="750" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">a query against the view</text>
<text x="1162" y="802" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Karp: access decision</text>
<text x="1432" y="802" font-size="10" font-weight="600" fill="#0f7d8c" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AUTHORIZATION</text>
<line x1="36" y1="836" x2="1446" y2="836" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="36" y="878" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Below the grid</text>
<text x="36" y="898" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">what every cell is built from</text>
<rect x="210" y="850" width="1236" height="64" rx="8" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="226" y="878" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cryptographic machinery</text>
<text x="226" y="898" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">primitives, AEAD, entropy, key wrapping</text>
<text x="1432" y="900" font-size="10" font-weight="600" fill="#a55f22" text-anchor="end" letter-spacing="0.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CRYPTO</text>
<rect x="210" y="936" width="16" height="16" rx="3" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="234" y="949" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Authorization series</text>
<rect x="380" y="936" width="16" height="16" rx="3" fill="#ececfb" stroke="#5b5bd6" stroke-width="1.2"/>
<text x="404" y="949" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Identity series</text>
<rect x="550" y="936" width="16" height="16" rx="3" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="574" y="949" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Applied crypto series</text>
<text x="1446" y="949" font-size="12" font-weight="400" fill="#64748b" text-anchor="end">Karp's four steps are labelled in the cells they occupy.</text>
</svg>
