<rect x="0" y="0" width="980" height="646" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#0f172a">Where the adversary lives: seven positions, 1966–today</text>
<text x="20" y="50" font-size="12" fill="#475569">Rows run from farthest from you (top) to your own process (bottom). Work began in the bottom rows, moved up with the network, and what is still open is back at the bottom.</text>
<text x="20" y="68" font-size="12" fill="#475569">Band colour is the series that covers it: <tspan fill="#2563eb" font-weight="700">applied crypto</tspan>, <tspan fill="#15803d" font-weight="700">identity</tspan>, <tspan fill="#b45309" font-weight="700">authorization</tspan>.</text>
