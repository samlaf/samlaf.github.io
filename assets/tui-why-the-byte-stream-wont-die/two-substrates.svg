<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>

  <text x="245" y="42" font-size="15" font-weight="600" fill="#555555" text-anchor="middle">terminal substrate</text>
  <text x="715" y="42" font-size="15" font-weight="600" fill="#555555" text-anchor="middle">GUI substrate</text>

  <!-- left column -->
  <rect x="95" y="70" width="300" height="64" rx="10" fill="#4a4a48"/>
  <text x="245" y="97" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Shell process</text>
  <text x="245" y="119" font-size="14" fill="#d4d4d1" text-anchor="middle">any language, separate process</text>
  <line x1="245" y1="134" x2="245" y2="165" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="95" y="170" width="300" height="64" rx="10" fill="#94391b" stroke="#e8a24c" stroke-width="1.5"/>
  <text x="245" y="197" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">pty byte stream</text>
  <text x="245" y="219" font-size="14" fill="#f5c9b0" text-anchor="middle">text + escape sequences</text>
  <line x1="245" y1="234" x2="245" y2="265" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="95" y="270" width="300" height="64" rx="10" fill="#4a4a48"/>
  <text x="245" y="297" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Terminal emulator</text>
  <text x="245" y="319" font-size="14" fill="#d4d4d1" text-anchor="middle">owns the cell grid</text>

  <text x="245" y="380" font-size="14" fill="#9a9a9a" text-anchor="middle">network-transparent, universal</text>

  <!-- right column -->
  <rect x="565" y="70" width="300" height="64" rx="10" fill="#4a4a48"/>
  <text x="715" y="97" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Shell as GUI app</text>
  <text x="715" y="119" font-size="14" fill="#d4d4d1" text-anchor="middle">links the toolkit</text>
  <line x1="715" y1="134" x2="715" y2="165" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="565" y="170" width="300" height="64" rx="10" fill="#94391b" stroke="#e8a24c" stroke-width="1.5"/>
  <text x="715" y="197" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">in-process API</text>
  <text x="715" y="219" font-size="14" fill="#f5c9b0" text-anchor="middle">typed events + draw calls</text>
  <line x1="715" y1="234" x2="715" y2="265" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="565" y="270" width="300" height="64" rx="10" fill="#4a4a48"/>
  <text x="715" y="297" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Toolkit + display</text>
  <text x="715" y="319" font-size="14" fill="#d4d4d1" text-anchor="middle">owns the window</text>

  <text x="715" y="380" font-size="14" fill="#9a9a9a" text-anchor="middle">local, toolkit-bound</text>

  <text x="480" y="420" font-size="14" fill="#9a9a9a" text-anchor="middle">The contract is the middle box &#8212; and only one of them survives a wire.</text>
</svg>
