<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">The four different meanings of the word "file"</title>
  <desc id="desc">How a process gets and uses a kernel resource, with the four places the word "file" hides marked by numbered badges: (1) the virtual File system pathname (VFS path namespace), (2) the File descriptor (per-process fd table), (3) the struct file kernel object behind the descriptor, and (4) the persistent File system on disk. Behind every struct file sits an inode and resource-specific state. Regular files, pipes, sockets and pidfds have their own inode. Anonymous fds such as eventfd, epoll, timerfd and BPF share one placeholder inode and keep their state in private_data. Inheritance and SCM_RIGHTS create no resource: they install a new fd for an existing struct file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #555; }
      .section { font-size: 17px; font-weight: 700; }
      .colhead { font-size: 14px; font-weight: 700; }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .muted { fill: #666; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #555; }
      .user { fill: #f7f9ff; stroke: #5265c7; stroke-width: 2; rx: 14; }
      .kernel { fill: #fff8e8; stroke: #c88719; stroke-width: 2; rx: 14; }
      .disk { fill: #eef8ee; stroke: #2e7d32; stroke-width: 2; rx: 14; }
      .box { fill: #fff; stroke: #555; stroke-width: 1.5; rx: 9; }
      .box-dash { fill: #fff; stroke: #555; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 9; }
      .fd { fill: #eef3ff; stroke: #3f51b5; stroke-width: 1.6; rx: 7; }
      .ofd { fill: #fff; stroke: #7b4fb3; stroke-width: 1.7; rx: 10; }
      .row { fill: #fffdf7; stroke: #e2cfa6; stroke-width: 1; rx: 9; }
      .inode { fill: #e6f4f1; stroke: #00796b; stroke-width: 1.5; rx: 8; }
      .anon { fill: #fdecea; stroke: #c62828; stroke-width: 1.5; rx: 8; }
      .state { fill: #fff; stroke: #555; stroke-width: 1.5; rx: 8; }
      .file { fill: #f2fff2; stroke: #2e7d32; stroke-width: 1.6; rx: 8; }
      .line { stroke: #333; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #777; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .boundary { stroke: #aaa; stroke-width: 2; stroke-dasharray: 9 7; }
      .hl { font-weight: 800; fill: #111; text-decoration: underline; }
      .badge { fill: #111; }
      .badgetext { fill: #fff; font-size: 14px; font-weight: 800; }
      .badgetext-sm { fill: #fff; font-size: 11px; font-weight: 800; }
      .legend { fill: #fff; stroke: #555; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>

  <rect x="20" y="20" width="1240" height="810" fill="#fff" stroke="#ddd" rx="18" />
  <text x="640" y="54" text-anchor="middle" class="title">One word, four meanings: where "file" hides</text>
  <text x="640" y="78" text-anchor="middle" class="subtitle">The kernel manages resources. Namespaces and constructors are ways to get handles; fd tables are where held handles live.</text>

  <line x1="55" y1="205" x2="1225" y2="205" class="boundary" />
  <line x1="55" y1="620" x2="1225" y2="620" class="boundary" />
  <text x="70" y="96" class="section">user space</text>
  <text x="70" y="235" class="section">kernel space</text>
  <text x="70" y="650" class="section">disk / persistent storage</text>

  <!-- User side -->
  <rect x="80" y="105" width="330" height="88" class="user" />
  <text x="105" y="132" class="section">ask for access</text>
  <text x="105" y="157" class="small">open(path), socket(), pidfd_open()</text>
  <text x="105" y="177" class="small">timerfd_create(), receive fd, ...</text>

  <rect x="830" y="105" width="330" height="88" class="user" />
  <text x="855" y="132" class="section">use access you hold</text>
  <text x="855" y="157" class="small">int fd = 3</text>
  <text x="855" y="177" class="small">read(fd), poll(fd), ioctl(fd), close(fd)</text>

  <!-- Left kernel: discovery -->
  <rect x="80" y="250" width="290" height="350" class="kernel" />
  <text x="100" y="277" class="section">discovery / creation</text>
  <text x="100" y="296" class="tiny muted">ways to locate, create, or receive access</text>

  <rect x="100" y="310" width="250" height="32" class="box-dash" />
  <text x="116" y="331" class="small">fd inheritance / SCM_RIGHTS</text>
  <rect x="100" y="353" width="250" height="34" class="box" />
  <text x="116" y="375" class="small">PID namespace</text>
  <rect x="100" y="401" width="250" height="34" class="box" />
  <text x="116" y="423" class="small">network address namespace</text>
  <rect x="100" y="473" width="250" height="34" class="box" />
  <text x="116" y="495" class="small">anonymous constructors</text>
  <rect x="100" y="540" width="250" height="44" class="box" />
  <text x="116" y="558" class="small">V<tspan class="hl">F</tspan>S path namespace</text>
  <text x="116" y="575" class="tiny muted">(Virtual File System)</text>

  <!-- Center kernel: resources, one row per kind -->
  <rect x="425" y="250" width="370" height="350" class="kernel" />
  <text x="440" y="277" class="section">resource-specific objects</text>
  <text x="440" y="296" class="tiny muted">what the kernel actually manages</text>

  <text x="440" y="324" class="colhead">resource</text>
  <text x="595" y="324" text-anchor="middle" class="colhead">inode</text>
  <text x="595" y="339" text-anchor="middle" class="tiny muted">per object</text>
  <text x="723" y="324" text-anchor="middle" class="colhead">state</text>
  <text x="723" y="339" text-anchor="middle" class="tiny muted">what f_op uses</text>

  <rect x="433" y="350" width="354" height="40" class="row" />
  <text x="440" y="367" class="small">process</text>
  <text x="440" y="383" class="tiny muted">pidfd</text>
  <rect x="540" y="352" width="110" height="36" class="inode" />
  <text x="595" y="367" text-anchor="middle" class="small">pidfs</text>
  <text x="595" y="382" text-anchor="middle" class="tiny muted">own (6.9+)</text>
  <rect x="662" y="352" width="122" height="36" class="state" />
  <text x="723" y="367" text-anchor="middle" class="small">struct pid</text>
  <text x="723" y="382" text-anchor="middle" class="tiny muted">per process</text>

  <rect x="433" y="398" width="354" height="40" class="row" />
  <text x="440" y="423" class="small">socket</text>
  <rect x="540" y="400" width="110" height="36" class="inode" />
  <text x="595" y="415" text-anchor="middle" class="small">sockfs</text>
  <text x="595" y="430" text-anchor="middle" class="tiny muted">own</text>
  <rect x="662" y="400" width="122" height="36" class="state" />
  <text x="723" y="415" text-anchor="middle" class="small">struct socket</text>
  <text x="723" y="430" text-anchor="middle" class="tiny muted">beside inode</text>

  <rect x="433" y="446" width="354" height="40" class="row" />
  <text x="440" y="462" class="tiny">eventfd, epoll,</text>
  <text x="440" y="478" class="tiny">timerfd, BPF, …</text>
  <rect x="540" y="448" width="110" height="36" class="anon" />
  <text x="595" y="463" text-anchor="middle" class="small">anon_inode</text>
  <text x="595" y="478" text-anchor="middle" class="tiny muted">one, shared</text>
  <rect x="662" y="448" width="122" height="36" class="state" />
  <text x="723" y="463" text-anchor="middle" class="small">per-fd context</text>
  <text x="723" y="478" text-anchor="middle" class="mono">private_data</text>

  <rect x="433" y="494" width="354" height="40" class="row" />
  <text x="440" y="519" class="small">pipe</text>
  <rect x="540" y="496" width="110" height="36" class="inode" />
  <text x="595" y="511" text-anchor="middle" class="small">pipefs</text>
  <text x="595" y="526" text-anchor="middle" class="tiny muted">own</text>
  <rect x="662" y="496" width="122" height="36" class="state" />
  <text x="723" y="511" text-anchor="middle" class="small">pipe ring</text>
  <text x="723" y="526" text-anchor="middle" class="mono">i_pipe</text>

  <rect x="433" y="542" width="354" height="40" class="row" />
  <text x="440" y="567" class="small">regular file</text>
  <rect x="540" y="544" width="110" height="36" class="inode" />
  <text x="595" y="559" text-anchor="middle" class="small">ext4</text>
  <text x="595" y="574" text-anchor="middle" class="tiny muted">own, on disk</text>
  <rect x="662" y="544" width="122" height="36" class="state" />
  <text x="723" y="559" text-anchor="middle" class="small">page cache</text>
  <text x="723" y="574" text-anchor="middle" class="mono">i_mapping</text>

  <!-- Right kernel: descriptors -->
  <rect x="845" y="245" width="315" height="155" class="kernel" />
  <text x="870" y="274" class="section">per-process <tspan class="hl">f</tspan>d table <tspan class="tiny muted">(file descriptor)</tspan></text>
  <rect x="875" y="305" width="75" height="30" class="fd" />
  <text x="890" y="325" class="small">0 stdin</text>
  <rect x="960" y="305" width="78" height="30" class="fd" />
  <text x="974" y="325" class="small">1 stdout</text>
  <rect x="1048" y="305" width="75" height="30" class="fd" />
  <text x="1063" y="325" class="small">2 stderr</text>
  <rect x="875" y="350" width="75" height="30" class="fd" />
  <text x="907" y="370" class="small">3</text>
  <rect x="960" y="350" width="78" height="30" class="fd" />
  <text x="994" y="370" class="small">4</text>
  <text x="870" y="394" class="tiny muted">fd lookup = integer → open handle</text>

  <rect x="845" y="445" width="315" height="155" class="kernel" />
  <text x="870" y="472" class="section">struct <tspan class="hl">file</tspan> / open handle</text>
  <text x="870" y="491" class="tiny muted">one per open(); the fd-facing wrapper</text>
  <rect x="875" y="503" width="255" height="84" class="ofd" />
  <text x="891" y="523" class="small">offset, flags, refcount</text>
  <text x="891" y="542" class="mono">f_op         → file_operations</text>
  <text x="891" y="559" class="mono">f_inode      → inode</text>
  <text x="891" y="576" class="mono">private_data → state</text>

  <!-- Disk -->
  <rect x="425" y="640" width="370" height="120" class="disk" />
  <rect x="540" y="652" width="110" height="34" class="file" />
  <text x="595" y="674" text-anchor="middle" class="small">on-disk inode</text>
  <rect x="662" y="652" width="122" height="34" class="file" />
  <text x="723" y="674" text-anchor="middle" class="small">data blocks</text>
  <text x="445" y="722" class="section"><tspan class="hl">file</tspan>system on disk</text>
  <text x="445" y="744" class="tiny muted">persistent metadata and file contents</text>

  <!-- Arrows -->
  <path d="M 245 183 L 245 250" class="dash" />
  <text x="256" y="226" class="tiny muted">name/create/receive</text>

  <path d="M 350 326 C 400 326, 395 230, 450 230 L 790 230 C 825 230, 830 290, 845 290" class="line" />
  <text x="455" y="223" class="tiny muted">new fd for an existing struct file (no new resource)</text>

  <path d="M 350 370 L 433 370" class="line" />
  <path d="M 350 418 L 433 418" class="line" />
  <path d="M 350 486 C 390 486, 400 466, 433 466" class="line" />
  <path d="M 350 494 C 390 494, 400 514, 433 514" class="line" />
  <path d="M 350 562 L 433 562" class="line" />
  <path d="M 350 552 C 385 548, 400 522, 433 520" class="dash" />
  <text x="394" y="553" class="tiny muted">FIFO</text>

  <path d="M 875 520 L 795 520" class="line" />
  <text x="802" y="512" class="tiny muted">f_op</text>

  <path d="M 1160 540 C 1215 520, 1215 385, 1160 365" class="line" />
  <text x="1190" y="428" text-anchor="end" class="tiny muted">install fd</text>

  <path d="M 995 183 L 995 245" class="line" />
  <text x="1010" y="224" class="tiny muted">use fd</text>

  <path d="M 1002 400 L 1002 445" class="line" />
  <text x="1015" y="428" class="tiny muted">fd lookup</text>

  <path d="M 595 580 L 595 652" class="dash" />
  <path d="M 723 580 L 723 652" class="dash" />

  <!-- "file" meaning badges -->
  <circle cx="100" cy="540" r="13" class="badge" />
  <text x="100" y="545" text-anchor="middle" class="badgetext">1</text>
  <circle cx="845" cy="245" r="13" class="badge" />
  <text x="845" y="250" text-anchor="middle" class="badgetext">2</text>
  <circle cx="845" cy="445" r="13" class="badge" />
  <text x="845" y="450" text-anchor="middle" class="badgetext">3</text>
  <circle cx="425" cy="640" r="13" class="badge" />
  <text x="425" y="645" text-anchor="middle" class="badgetext">4</text>

  <!-- Legend: the four meanings -->
  <rect x="845" y="640" width="370" height="132" class="legend" />
  <text x="864" y="666" class="section">"file" names four different things</text>
  <circle cx="873" cy="690" r="9" class="badge" />
  <text x="873" y="694" text-anchor="middle" class="badgetext-sm">1</text>
  <text x="891" y="695" class="small">virtual <tspan class="hl">File</tspan> system pathname</text>
  <circle cx="873" cy="713" r="9" class="badge" />
  <text x="873" y="717" text-anchor="middle" class="badgetext-sm">2</text>
  <text x="891" y="718" class="small"><tspan class="hl">File</tspan> descriptor (fd)</text>
  <circle cx="873" cy="736" r="9" class="badge" />
  <text x="873" y="740" text-anchor="middle" class="badgetext-sm">3</text>
  <text x="891" y="741" class="small">struct <tspan class="hl">file</tspan> kernel object</text>
  <circle cx="873" cy="759" r="9" class="badge" />
  <text x="873" y="763" text-anchor="middle" class="badgetext-sm">4</text>
  <text x="891" y="764" class="small">persistent <tspan class="hl">File</tspan> system on disk</text>

  <text x="80" y="800" class="tiny muted">Every struct file points at an inode, but anon fds share one placeholder inode and keep their state in private_data.</text>
  <text x="80" y="816" class="tiny muted">The uniform part is struct file + file_operations; the state behind it is not necessarily file-like.</text>
</svg>
