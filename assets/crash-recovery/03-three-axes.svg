<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 560" role="img" aria-label="Steal and force, split by where a changed page goes. In place: the four quadrants, with no steal and force unworkable alone. Elsewhere: LMDB and CouchDB need no log, LevelDB and RocksDB need redo only, and steal is unneeded because uncommitted pages can be written without any root pointing at them." font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="19" y="30" font-size="15" font-weight="600" fill="#1f1e1d">The third axis: where a changed page goes</text>
<text x="19" y="50" font-size="11.5" fill="#6b6a66">In place, writing a page and making it count are one act. Elsewhere, a page counts only once a root points to it.</text>

<!-- grid headers -->
<rect x="110" y="70" width="315" height="40" rx="6" fill="#f1f0ec"/>
<text x="267.5" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Write in place</text>
<text x="267.5" y="103" text-anchor="middle" font-size="11" fill="#6b6a66">a page goes back to its own block</text>
<rect x="435" y="70" width="315" height="40" rx="6" fill="#e3eef9"/>
<text x="592.5" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4f86">Write elsewhere</text>
<text x="592.5" y="103" text-anchor="middle" font-size="11" fill="#1d4f86">a root switch makes new pages count</text>

<text x="187.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Force</text>
<text x="347.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">No force</text>
<text x="512.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Force</text>
<text x="672.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">No force</text>

<!-- row labels -->
<text x="19" y="200" font-size="13" font-weight="600" fill="#1f1e1d">No steal</text>
<text x="19" y="216" font-size="11" fill="#6b6a66">uncommitted</text>
<text x="19" y="230" font-size="11" fill="#6b6a66">pages never</text>
<text x="19" y="244" font-size="11" fill="#6b6a66">count</text>
<text x="19" y="380" font-size="13" font-weight="600" fill="#1f1e1d">Steal</text>
<text x="19" y="396" font-size="11" fill="#6b6a66">uncommitted</text>
<text x="19" y="410" font-size="11" fill="#6b6a66">pages may</text>
<text x="19" y="424" font-size="11" fill="#6b6a66">count</text>

<!-- In place, no steal, force -->
<rect x="110" y="142" width="155" height="150" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-dasharray="5 4"/>
<text x="187.5" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b6a66">Not on its own</text>
<text x="187.5" y="182" text-anchor="middle" font-size="10.5" fill="#6b6a66">a crash mid-commit</text>
<text x="187.5" y="196" text-anchor="middle" font-size="10.5" fill="#6b6a66">leaves some pages new</text>
<text x="187.5" y="210" text-anchor="middle" font-size="10.5" fill="#6b6a66">and some old</text>
<text x="187.5" y="246" text-anchor="middle" font-size="11" fill="#1d4f86">so write elsewhere →</text>

<!-- In place, no steal, no force -->
<rect x="270" y="142" width="155" height="150" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="347.5" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Redo only</text>
<text x="347.5" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a66">replay committed work</text>
<rect x="280" y="194" width="135" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="347.5" y="209" text-anchor="middle" font-size="11" fill="#1f1e1d">SQLite WAL mode</text>
<rect x="280" y="222" width="135" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="347.5" y="237" text-anchor="middle" font-size="11" fill="#1f1e1d">Aurora DSQL</text>

<!-- In place, steal, force -->
<rect x="110" y="302" width="155" height="190" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="187.5" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Undo only</text>
<text x="187.5" y="340" text-anchor="middle" font-size="10.5" fill="#6b6a66">roll back unfinished work</text>
<rect x="117" y="354" width="141" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="187.5" y="369" text-anchor="middle" font-size="11" fill="#1f1e1d">SQLite rollback journal</text>

<!-- In place, steal, no force -->
<rect x="270" y="302" width="155" height="190" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="347.5" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Redo + undo</text>
<text x="347.5" y="340" text-anchor="middle" font-size="10.5" fill="#6b6a66">the ARIES quadrant</text>
<rect x="280" y="354" width="135" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="347.5" y="369" text-anchor="middle" font-size="11" fill="#1f1e1d">InnoDB, Oracle</text>
<rect x="280" y="382" width="135" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="347.5" y="397" text-anchor="middle" font-size="11" fill="#1f1e1d">Postgres</text>
<rect x="280" y="410" width="135" height="22" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="347.5" y="425" text-anchor="middle" font-size="11" fill="#1f1e1d">CockroachDB</text>

<!-- Elsewhere, no steal, force -->
<rect x="435" y="142" width="155" height="150" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="512.5" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4f86">No log</text>
<text x="512.5" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a66">commit flips one root</text>
<rect x="445" y="194" width="135" height="22" rx="4" fill="#e3eef9" stroke="#2f6fb3"/>
<text x="512.5" y="209" text-anchor="middle" font-size="11" fill="#1d4f86">LMDB</text>
<rect x="445" y="222" width="135" height="22" rx="4" fill="#e3eef9" stroke="#2f6fb3"/>
<text x="512.5" y="237" text-anchor="middle" font-size="11" fill="#1d4f86">CouchDB</text>
<text x="512.5" y="266" text-anchor="middle" font-size="10.5" fill="#6b6a66">System R's shadow pages</text>

<!-- Elsewhere, no steal, no force -->
<rect x="595" y="142" width="155" height="150" rx="6" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.5"/>
<text x="672.5" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4f86">Redo only</text>
<text x="672.5" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a66">log now, new files later</text>
<rect x="605" y="194" width="135" height="22" rx="4" fill="#e3eef9" stroke="#2f6fb3"/>
<text x="672.5" y="209" text-anchor="middle" font-size="11" fill="#1d4f86">LevelDB, RocksDB</text>
<text x="672.5" y="238" text-anchor="middle" font-size="10.5" fill="#6b6a66">a MANIFEST record</text>
<text x="672.5" y="252" text-anchor="middle" font-size="10.5" fill="#6b6a66">installs each new file</text>

<!-- Elsewhere, steal row merged -->
<rect x="435" y="302" width="315" height="190" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-dasharray="5 4"/>
<text x="592.5" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b6a66">Not needed</text>
<text x="592.5" y="352" text-anchor="middle" font-size="11" fill="#6b6a66">Here "steal" splits in two. Writing an uncommitted</text>
<text x="592.5" y="368" text-anchor="middle" font-size="11" fill="#6b6a66">page is free: no root reaches it. Making it count</text>
<text x="592.5" y="384" text-anchor="middle" font-size="11" fill="#6b6a66">would need undo, and nothing forces that.</text>
<rect x="470" y="406" width="245" height="44" rx="4" fill="#ffffff" stroke="#2f6fb3" stroke-dasharray="4 3"/>
<text x="592.5" y="424" text-anchor="middle" font-size="11" fill="#1d4f86">LMDB spills uncommitted pages to disk</text>
<text x="592.5" y="440" text-anchor="middle" font-size="11" fill="#1d4f86">when a big transaction fills its dirty list</text>

<!-- legend -->
<rect x="19" y="518" width="12" height="12" rx="2" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="37" y="528" font-size="11.5" fill="#6b6a66">writes over the old page; the log covers the gap</text>
<rect x="360" y="518" width="12" height="12" rx="2" fill="#e3eef9" stroke="#2f6fb3"/>
<text x="378" y="528" font-size="11.5" fill="#6b6a66">never overwrites a live page; a root covers the gap</text>
</svg>
