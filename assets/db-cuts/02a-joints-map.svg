<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 440" role="img" aria-label="One engine stack: application, SQL, access methods, buffer pool, disk. Each of the four joints between layers can host either point. On the left, the family that splits the data at that joint: shared nothing above SQL, shared key-value store below SQL, shared buffer pool below the access methods, shared disk below the buffer pool. On the right, what a design ships when it copies data at that joint: a command log, a logical log, an object log, or a physical log or blocks. Each design on the left also appears on the right." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Every joint can host either point</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Each line is a joint between two layers. On the left, the family that splits the data there.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">On the right, what a design ships when it copies data there.</text><text x="240" y="106" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Split point</text><text x="520" y="106" text-anchor="start" font-size="12" font-weight="600" fill="#c25e00">Copy point</text><rect x="255" y="120" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application</text><rect x="255" y="186" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><rect x="255" y="252" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="272" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="255" y="318" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="338" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="255" y="384" width="250" height="32" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="404" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Disk</text><line x1="247" y1="169.0" x2="380.0" y2="169.0" stroke="#2f6fd6" stroke-width="2.5"/><line x1="380.0" y1="169.0" x2="513" y2="169.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="240" y="166.0" text-anchor="end" font-size="12" font-weight="600" fill="#1f1e1d">Shared nothing</text><text x="240" y="181.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#6b6a66">Vitess/Citus, Calvin</text><text x="520" y="166.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Command log</text><text x="520" y="181.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Calvin, NAM-DB</text><line x1="247" y1="235.0" x2="380.0" y2="235.0" stroke="#2f6fd6" stroke-width="2.5"/><line x1="380.0" y1="235.0" x2="513" y2="235.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="240" y="232.0" text-anchor="end" font-size="12" font-weight="600" fill="#1f1e1d">Shared key-value store</text><text x="240" y="247.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#6b6a66">CockroachDB/Spanner, DSQL</text><text x="520" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Logical log</text><text x="520" y="247.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Vitess, CockroachDB/Spanner, DSQL</text><line x1="247" y1="301.0" x2="380.0" y2="301.0" stroke="#2f6fd6" stroke-width="2.5"/><line x1="380.0" y1="301.0" x2="513" y2="301.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="240" y="298.0" text-anchor="end" font-size="12" font-weight="600" fill="#1f1e1d">Shared buffer pool</text><text x="240" y="313.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#6b6a66">FaRM, NAM-DB</text><text x="520" y="298.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Object log</text><text x="520" y="313.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">FaRM</text><line x1="247" y1="367.0" x2="380.0" y2="367.0" stroke="#2f6fd6" stroke-width="2.5"/><line x1="380.0" y1="367.0" x2="513" y2="367.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="240" y="364.0" text-anchor="end" font-size="12" font-weight="600" fill="#1f1e1d">Shared disk</text><text x="240" y="379.0" text-anchor="end" font-size="10.5" font-weight="400" fill="#6b6a66">Oracle RAC, Aurora</text><text x="520" y="364.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Physical log or blocks</text><text x="520" y="379.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Citus, Oracle RAC, Aurora</text></svg>
