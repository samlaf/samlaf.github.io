<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 364" role="img" aria-label="One engine stack: application, SQL, access methods, buffer pool and log, disk. Each of the four joints between layers can host either point. On the left, the family that splits the data at that joint: shared nothing above SQL, shared key-value store below SQL, shared buffer pool below the access methods, shared disk below the buffer pool and log. On the right, what a design ships when it replicates at that joint: a command log, a logical log, an object log, or a physical log or blocks. Each design on the left also appears on the right." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="240" y="30" text-anchor="end" font-size="12" font-weight="600" fill="#2f6fd6">Split point</text><text x="520" y="30" text-anchor="start" font-size="12" font-weight="600" fill="#c25e00">Replication point</text><rect x="255" y="44" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="64" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application</text><rect x="255" y="110" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="130" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><rect x="255" y="176" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="196" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="255" y="242" width="250" height="32" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="262" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Buffer pool + log</text><rect x="255" y="308" width="250" height="32" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="328" tex