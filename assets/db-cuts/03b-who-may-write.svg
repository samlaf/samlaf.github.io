<svg xmlns="http://www.w3.org/2000/svg" width="800" height="536" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 800 536" role="img" aria-label="Two panels. Left: three nodes each run SQL and their own locks above the coupling point, over one home per piece of data; only node 1 writes. Right: three nodes run SQL only; concurrency control sits below the coupling point, in the home of the data, so every node can take writes. A design allows many writers only if concurrency control sits at or below the coupling point." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ww-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Who may write depends on which side of the coupling point concurrency control sits</text><text x="20" y="48" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Above the blue line, every node runs its own instance of each layer and can take any query. Below it, each piece of data has one home:</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">one system that all nodes share, or one owner per shard. Dashed grey: concurrency control.</text><line x1="400" y1="88" x2="400" y2="470" stroke="#e6e4df" stroke-width="1"/><text x="200" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Above the coupling point</text><text x="200" y="121" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">one writer</text><rect x="35" y="140" width="100" height="116" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="85" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 1</text><rect x="47" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="85" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="47" y="198" width="76" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="85" y="214" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">locks</text><text x="85" y="244" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1e1d">writes</text><line x1="85" y1="256" x2="85" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><rect x="155" y="140" width="100" height="116" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="205" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 2</text><rect x="167" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="205" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="167" y="198" width="76" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="205" y="214" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">locks</text><text x="205" y="244" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">reads only</text><line x1="205" y1="256" x2="205" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><rect x="275" y="140" width="100" height="116" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="325" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 3</text><rect x="287" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="325" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="287" y="198" width="76" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="325" y="214" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">locks</text><text x="325" y="244" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">reads only</text><line x1="325" y1="256" x2="325" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><line x1="25" y1="278" x2="375" y2="278" stroke="#2f6fd6" stroke-width="2.5"/><text x="265" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#2f6fd6">coupling point</text><rect x="35" y="306" width="340" height="66" rx="4" fill="#f6f5f2" stroke="#b8b5ae" stroke-width="1.25"/><text x="200" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">One home per piece of data</text><text x="200" y="342" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">one shared system, or one owner per shard</text><text x="200" y="426" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">Each node's locks see only its own transactions,</text><text x="200" y="442" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">and two nodes could lock the same row unaware,</text><text x="200" y="458" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">so only one node may write: Aurora, Neon.</text><text x="600" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">At or below the coupling point</text><text x="600" y="121" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">many writers</text><rect x="435" y="140" width="100" height="84" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="485" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 1</text><rect x="447" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="485" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="485" y="212" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1e1d">writes</text><line x1="485" y1="224" x2="485" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><rect x="555" y="140" width="100" height="84" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="605" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 2</text><rect x="567" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="605" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="605" y="212" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1e1d">writes</text><line x1="605" y1="224" x2="605" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><rect x="675" y="140" width="100" height="84" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="725" y="157" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 3</text><rect x="687" y="166" width="76" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="725" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="725" y="212" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1e1d">writes</text><line x1="725" y1="224" x2="725" y2="304" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#ww-arrow)"/><line x1="425" y1="278" x2="775" y2="278" stroke="#2f6fd6" stroke-width="2.5"/><text x="665" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#2f6fd6">coupling point</text><rect x="435" y="306" width="340" height="98" rx="4" fill="#f6f5f2" stroke="#b8b5ae" stroke-width="1.25"/><text x="600" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">One home per piece of data</text><text x="600" y="342" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">one shared system, or one owner per shard</text><rect x="455" y="354" width="300" height="32" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="600" y="374" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">locks at each owner, or a check at commit</text><text x="600" y="426" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">Every write to a key meets the same check,</text><text x="600" y="442" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">whichever node sent it, so any node can take writes:</text><text x="600" y="458" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">CockroachDB, DSQL.</text><line x1="20" y1="486" x2="780" y2="486" stroke="#e6e4df" stroke-width="1"/><text x="400" y="514" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">A design allows many writers only if concurrency control sits at or below the coupling point.</text></svg>