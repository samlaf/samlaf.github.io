<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 536" role="img" aria-label="A write runs down the primary's stack: SQL, access methods, buffer pool, disk. Orange arrows show where it leaves for the replicas at three heights. A physical log leaves below the buffer pool, so each replica only writes its disk. A logical log leaves below SQL, so each replica runs its access methods, buffer pool, and disk. A command log leaves above SQL, so each replica runs the whole stack." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1e1d"/></marker><marker id="ar-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c25e00"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Where each write leaves for the replicas</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">A write runs down the primary's stack. At the copy point, it leaves as a log and continues down each replica.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Shaded: the layers every replica runs for every write. The higher the copy point, the more of the stack each replica repeats.</text><text x="20" y="81" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Replicas may also run the upper layers, but only to serve reads, so the figure leaves them out.</text><rect x="30" y="120" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="95.0" y="139.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Write request</text><rect x="30" y="200" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="95.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">SQL</text><line x1="95.0" y1="150" x2="95.0" y2="198" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="280" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="95.0" y="299.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="95.0" y1="230" x2="95.0" y2="278" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="360" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="95.0" y="379.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="95.0" y1="310" x2="95.0" y2="358" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="440" width="130" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="95.0" y="459.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="95.0" y1="390" x2="95.0" y2="438" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="210" y="430" width="150" height="50" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="220" y="440" width="130" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="285.0" y="459.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="22" y1="415.0" x2="168" y2="415.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M168 415.0H285.0V438" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="174" y="409.0" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">page changes</text><text x="285.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Physical log</text><text x="285.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Postgres WAL, Aurora redo</text><rect x="400" y="270" width="150" height="210" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="410" y="280" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="475.0" y="299.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="410" y="360" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="475.0" y="379.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="475.0" y1="310" x2="475.0" y2="358" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><rect x="410" y="440" width="130" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="475.0" y="459.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="475.0" y1="390" x2="475.0" y2="438" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><line x1="22" y1="255.0" x2="168" y2="255.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M168 255.0H475.0V278" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="174" y="249.0" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">row and key changes</text><text x="475.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Logical log</text><text x="475.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Vitess, CockroachDB, DSQL</text><rect x="590" y="190" width="150" height="290" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="600" y="200" width="130" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="665.0" 