<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 376" role="img" aria-label="Any query processor can write any key, and the adjudicator picks a winner at commit" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="oc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Any query processor can write any key; the adjudicator picks a winner at commit</text><g><rect x="72" y="56" width="176" height="56" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="160" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1d">Query processor</text><text x="160" y="98" text-anchor="middle" font-size="11.5" fill="#6b6a66">txn 1 writes k</text></g><g><rect x="292" y="56" width="176" height="56" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="380" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1d">Query processor</text><text x="380" y="98" text-anchor="middle" font-size="11.5" fill="#6b6a66">txn 2 writes k</text></g><g><rect x="512" y="56" width="176" height="56" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="600" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1d">Query processor</text><text x="600" y="98" text-anchor="middle" font-size="11.5" fill="#6b6a66">txn 3 writes k</text></g><g fill="none" stroke="#b8b5ae" stroke-width="1.25"><path d="M160 112V140H320V166" marker-end="url(#oc-arrow)"></path><path d="M380 112V166" marker-end="url(#oc-arrow)"></path><path d="M600 112V140H440V166" marker-end="url(#oc-arrow)"></path><path d="M340 224V252H242V278" marker-end="url(#oc-arrow)"></path><path d="M420 224V252H518V278" marker-end="url(#oc-arrow)"></path></g><g><rect x="260" y="168" width="240" height="56" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><text x="380" y="192" text-anchor="middle" font-weight="600" fill="#1f1e1d">Adjudicator for k</text><text x="380" y="210" text-anchor="middle" font-size="11.5" fill="#6b6a66">first to commit wins</text></g><g><rect x="132" y="280" width="220" height="40" rx="8" fill="#2f9e6b" fill-opacity="0.12" stroke="#2f9e6b" stroke-width="1.5"></rect><text x="242" y="304" text-anchor="middle" font-weight="600" fill="#1f1e1d">txn 2 commits</text></g><g><rect x="408" y="280" width="220" height="40" rx="8" fill="#d1453b" fill-opacity="0.12" stroke="#d1453b" stroke-width="1.5"></rect><text x="518" y="304" text-anchor="middle" font-weight="600" fill="#1f1e1d">txn 1 and 3 abort, retry</text></g><text x="380" y="352" text-anchor="middle" font-size="11.5" fill="#6b6a66">Contention becomes aborts and retries, not lock waits</text></svg>