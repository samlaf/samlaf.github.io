<svg xmlns="http://www.w3.org/2000/svg" width="860" height="412" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 860 412" role="img" aria-label="DSQL's steps over time and across layers. A query processor runs the transaction, reading rows from storage as of its start and buffering its writes. At commit, adjudicators check the write set for conflicts and pick a commit time. Appending to the journal is the commit. Each storage replica then applies the write sets." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="tl-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="tl-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">DSQL runs the transaction first, then checks it, then journals it</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Across: the four steps of a transaction, in DSQL's sequence. Down: the layer that runs each step.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Orange: the replication point; the shaded steps run again on every replica. Blue: the split point, and what crosses there.</text><rect x="680" y="322" width="160" height="70" fill="#c25e00" fill-opacity="0.07"/><path d="M200 82H840" stroke="#b8b5ae" stroke-width="1" marker-end="url(#tl-grey)"/><text x="192" y="86" text-anchor="end" font-size="11.5" font-weight="400" fill="#6b6a66">time</text><text x="280.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Execute</text><text x="440.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Check + Number</text><text x="600.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Persist</text><text x="760.0" y="101" text-anchor="middle" font-size="12" font-weight="400" fill="#6b6a66">Apply (after commit)</text><line x1="24" y1="112" x2="840" y2="112" stroke="#e6e4df" stroke-width="1"/><text x="24" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Query processors</text><text x="24" y="161" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">SQL; many, stateless</text><line x1="24" y1="182" x2="840" y2="182" stroke="#e6e4df" stroke-width="1"/><text x="24" y="215" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Adjudicators</text><text x="24" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">concurrency control; per key range</text><line x1="24" y1="252" x2="840" y2="252" stroke="#e6e4df" stroke-width="1"/><text x="24" y="285" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Journal</text><text x="24" y="301" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the log; across zones</text><line x1="24" y1="322" x2="840" y2="322" stroke="#e6e4df" stroke-width="1"/><text x="24" y="355" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Storage</text><text x="24" y="371" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">rows by timestamp; sharded</text><line x1="24" y1="392" x2="840" y2="392" stroke="#e6e4df" stroke-width="1"/><line x1="24" y1="322" x2="840" y2="322" stroke="#c25e00" stroke-width="2" stroke-dasharray="5 3"/><text x="836" y="316" text-anchor="end" font-size="11" font-weight="400" fill="#c25e00">replication point: write sets</text><line x1="24" y1="182" x2="840" y2="182" stroke="#2f6fd6" stroke-width="2"/><text x="836" y="176" text-anchor="end" font-size="11" font-weight="400" fill="#2f6fd6">split point: row reads; write sets at commit</text><path d="M280.0 343.0V161.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#tl-blue)"/><path d="M350.0 147.0H440.0V203.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#tl-blue)"/><path d="M510.0 217.0H600.0V273.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#tl-grey)"/><path d="M600.0 301.0V357.0H690.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#tl-grey)"/><rect x="210.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="151.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">run, buffer writes</text><rect x="210.0" y="343.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="361.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">serve rows as of start</text><rect x="370.0" y="203.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="440.0" y="221.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">check, pick commit time</text><rect x="530.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600.0" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">append: the commit</text><rect x="690.0" y="343.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="361.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">apply write sets</text><text x="288" y="256" text-anchor="start" font-size="10.5" font-weight="400" fill="#2f6fd6">row reads</text></svg>
