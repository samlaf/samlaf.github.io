<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 420" role="img" aria-label="Two panels. Left, split then copy, as in Vitess and most designs: the application and router sit on top; a blue line splits the data into two shards, keys a to m and n to z, each with its own SQL engine; an orange line below copies each shard three times through its binlog. Right, copy then split, as in Calvin: an orange line first copies the input log of transactions to three replicas; a blue line then splits each replica into two partitions, which execute every transaction. Both end with six pieces, but in Calvin each copy repeats far more of the work." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Split, then copy, or copy, then split</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Both designs end with the same six pieces: two key ranges, three copies of each.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">The order decides how much of the work each copy repeats. Shaded: the work every copy repeats.</text><rect x="14" y="300" width="362" height="74" rx="6" fill="#c25e00" fill-opacity="0.07"/><text x="20" y="110" text-anchor="start" font-size="13" font-weight="600" fill="#1f1e1d">Split, then copy</text><text x="20" y="127" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Vitess, and most designs</text><rect x="20" y="150" width="350" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="195.0" y="167" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application + router</text><text x="195.0" y="181" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">every query enters here</text><line x1="20" y1="216" x2="370" y2="216" stroke="#2f6fd6" stroke-width="2.5"/><text x="20" y="209" text-anchor="start" font-size="10.5" font-weight="400" fill="#2f6fd6">split: the router sends each statement to its shard</text><line x1="20" y1="296" x2="370" y2="296" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="20" y="289" text-anchor="start" font-size="10.5" font-weight="400" fill="#c25e00">copy: each shard ships its binlog</text><rect x="20.0" y="228" width="169.0" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="104.5" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><text x="104.5" y="259" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">keys a–m, runs each write once</text><rect x="20.0" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="46.16666666666667" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="46.16666666666667" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="78.33333333333334" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="104.50000000000001" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="104.50000000000001" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="136.66666666666669" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="162.83333333333334" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="162.83333333333334" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><text x="104.5" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">three copies of a–m</text><rect x="201.0" y="228" width="169.0" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="285.5" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><text x="285.5" y="259" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">keys n–z, runs each write once</text><rect x="201.0" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="227.16666666666666" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="227.16666666666666" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="259.3333333333333" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="285.5" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="285.5" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="317.6666666666667" y="308" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="343.83333333333337" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="343.83333333333337" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><text x="285.5" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">three copies of n–z</text><text x="20" y="392" text-anchor="start" font-size="11" font-weight="400" fill="#1f1e1d">Each copy only applies row changes.</text><text x="20" y="408" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">The shard's primary already ran the transaction.</text><rect x="384" y="220" width="362" height="154" rx="6" fill="#c25e00" fill-opacity="0.07"/><text x="390" y="110" text-anchor="start" font-size="13" font-weight="600" fill="#1f1e1d">Copy, then split</text><text x="390" y="127" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Calvin</text><rect x="390" y="150" width="350" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="565.0" y="167" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application</text><text x="565.0" y="181" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">every transaction enters here</text><line x1="390" y1="216" x2="740" y2="216" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="390" y="209" text-anchor="start" font-size="10.5" font-weight="400" fill="#c25e00">copy: the input log of transactions</text><line x1="390" y1="296" x2="740" y2="296" stroke="#2f6fd6" stroke-width="2.5"/><text x="390" y="289" text-anchor="start" font-size="10.5" font-weight="400" fill="#2f6fd6">split: each copy partitions the log by key</text><rect x="390.0" y="228" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="444.3333333333333" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="444.3333333333333" y="259" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="390.0" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="415.6666666666667" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="415.6666666666667" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="447.3333333333333" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="473.0" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="473.0" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="444.3333333333333" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">copy 1</text><rect x="510.6666666666667" y="228" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="565.0" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="565.0" y="259" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="510.6666666666667" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="536.3333333333334" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="536.3333333333334" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="568.0" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="593.6666666666666" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="593.6666666666666" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="565.0" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">copy 2</text><rect x="631.3333333333334" y="228" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="685.6666666666667" y="245" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="685.6666666666667" y="259" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="631.3333333333334" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="657.0" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="657.0" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="688.6666666666667" y="308" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="714.3333333333334" y="325" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="714.3333333333334" y="339" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="685.6666666666667" y="365" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">copy 3</text><text x="390" y="392" text-anchor="start" font-size="11" font-weight="400" fill="#1f1e1d">Each copy runs every transaction.</text><text x="390" y="408" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">That works only because execution is deterministic.</text></svg>
