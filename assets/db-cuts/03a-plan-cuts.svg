<svg xmlns="http://www.w3.org/2000/svg" width="760" height="585" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 585" role="img" aria-label="A query plan for a filtered sum by region, drawn as a tree over two key ranges: a final sum on top, then per range a partial sum, a filter, a scan, the access methods, the buffer pool, and storage. Four blue lines mark where each family splits the data: shared nothing between the final and partial sums, the shared key-value store between the scan and the access methods, the shared buffer pool between the access methods and the buffer pool, and shared disk between the buffer pool and storage. A dashed arrow shows pushdown: for reads, the filter and partial sum can run below the key-value line, as in DSQL, CockroachDB, and TiDB. Shared memory has no line, since one machine runs the whole plan." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="pt-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">One query plan, split at each family's joint</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">A plan is a tree of operators, and rows flow up from the scans at its leaves. Each blue line is where one family splits the data.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Above a line, one node runs both branches. Below it, each branch runs where its keys live.</text><text x="20" y="81" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">The higher the split, the less data crosses it. Shared memory has no line: one machine runs the whole plan.</text><g transform="translate(0 17)"><text x="20" y="86" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SELECT region, sum(amount) FROM orders WHERE status = 'paid' GROUP BY region</text><rect x="70" y="100" width="340" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="240.0" y="119" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Final sum, by region</text><rect x="70" y="500" width="160" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="519" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Storage</text><line x1="150" y1="500" x2="150" y2="462" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="430" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="449" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="150" y1="430" x2="150" y2="392" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="360" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="150" y1="360" x2="150" y2="322" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="290" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="309" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Scan orders</text><line x1="150" y1="290" x2="150" y2="262" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="230" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="249" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Filter: status = 'paid'</text><line x1="150" y1="230" x2="150" y2="202" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="170" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="189" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Partial sum, by region</text><line x1="150" y1="170" x2="150" y2="132" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="500" width="160" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="519" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Storage</text><line x1="330" y1="500" x2="330" y2="462" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="430" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="449" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="330" y1="430" x2="330" y2="392" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="360" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="330" y1="360" x2="330" y2="322" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="290" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="309" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Scan orders</text><line x1="330" y1="290" x2="330" y2="262" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="230" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="249" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Filter: status = 'paid'</text><line x1="330" y1="230" x2="330" y2="202" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="170" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="189" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Partial sum, by region</text><line x1="330" y1="170" x2="330" y2="132" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><text x="150" y="550" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">keys a–m</text><text x="330" y="550" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">keys n–z</text><line x1="52" y1="100" x2="52" y2="320" stroke="#b8b5ae" stroke-width="1.25"/><line x1="52" y1="100" x2="58" y2="100" stroke="#b8b5ae" stroke-width="1.25"/><line x1="52" y1="320" x2="58" y2="320" stroke="#b8b5ae" stroke-width="1.25"/><text x="42" y="210" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66" transform="rotate(-90 42 210)">query plan</text><line x1="60" y1="150" x2="424" y2="150" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="147" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared nothing</text><text x="448" y="162" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">fragments down, partial sums up</text><text x="448" y="177" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Citus, Greenplum</text><line x1="60" y1="340" x2="424" y2="340" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="337" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared key-value store</text><text x="448" y="352" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">key-value reads down, rows up</text><text x="448" y="367" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">CockroachDB, Spanner, DSQL</text><line x1="60" y1="410" x2="424" y2="410" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="407" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared buffer pool</text><text x="448" y="422" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">records and index nodes over RDMA</text><text x="448" y="437" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">FaRM, NAM-DB</text><line x1="60" y1="480" x2="424" y2="480" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="477" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared disk</text><text x="448" y="492" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">pages up, on a cache miss</text><text x="448" y="507" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Oracle RAC, Aurora</text><line x1="418" y1="172" x2="422" y2="172" stroke="#b8b5ae" stroke-width="1.25"/><line x1="422" y1="172" x2="422" y2="258" stroke="#b8b5ae" stroke-width="1.25"/><line x1="418" y1="258" x2="422" y2="258" stroke="#b8b5ae" stroke-width="1.25"/><path d="M422 258 V378" fill="none" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#pt-push)"/><text x="448" y="222" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Pushdown</text><text x="448" y="237" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">for reads, the filter and partial sum</text><text x="448" y="252" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">can run below the key-value line:</text><text x="448" y="267" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">DSQL, CockroachDB, TiDB</text></g></svg>
