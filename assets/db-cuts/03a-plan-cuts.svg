<svg xmlns="http://www.w3.org/2000/svg" width="760" height="557" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 557" role="img" aria-label="A query plan for a filtered sum by region, drawn as a tree over two key ranges: a final sum on top, then per range a partial sum, a filter, a scan, the access methods, the buffer pool, and storage. Three blue lines cut it at different heights: Citus between the final and partial sums, DSQL between the partial sum and the filter, and Aurora between the buffer pool and storage." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">One query plan, cut at three heights</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">A plan is a tree of operators, and rows flow up from the scans at its leaves. Each blue line is where one design couples nodes.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Above the line, one node runs both branches. Below it, each branch runs on the node that holds its keys.</text><text x="20" y="81" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">The higher the cut, the less data crosses it.</text><g transform="translate(0 17)"><text x="20" y="86" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SELECT region, sum(amount) FROM orders WHERE status = 'paid' GROUP BY region</text><rect x="70" y="100" width="340" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="240.0" y="119.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Final sum, by region</text><rect x="70" y="170" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="189.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Partial sum, by region</text><line x1="150.0" y1="170" x2="150.0" y2="132" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="240" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="259.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Filter: status = 'paid'</text><line x1="150.0" y1="240" x2="150.0" y2="202" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="290" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="309.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Scan orders</text><line x1="150.0" y1="290" x2="150.0" y2="272" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="340" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="359.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="150.0" y1="340" x2="150.0" y2="322" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="390" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="409.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="150.0" y1="390" x2="150.0" y2="372" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="70" y="460" width="160" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="150.0" y="479.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Storage</text><line x1="150.0" y1="460" x2="150.0" y2="422" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="170" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="189.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Partial sum, by region</text><line x1="330.0" y1="170" x2="330.0" y2="132" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="240" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="259.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Filter: status = 'paid'</text><line x1="330.0" y1="240" x2="330.0" y2="202" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="290" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="309.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Scan orders</text><line x1="330.0" y1="290" x2="330.0" y2="272" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="340" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="359.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="330.0" y1="340" x2="330.0" y2="322" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="390" width="160" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="409.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="330.0" y1="390" x2="330.0" y2="372" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><rect x="250" y="460" width="160" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="330.0" y="479.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Storage</text><line x1="330.0" y1="460" x2="330.0" y2="422" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#pt-ar)"/><text x="150" y="510" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">keys a–m</text><text x="330" y="510" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">keys n–z</text><line x1="52" y1="100" x2="52" y2="320" stroke="#b8b5ae" stroke-width="1.25"/><line x1="52" y1="100" x2="58" y2="100" stroke="#b8b5ae" stroke-width="1.25"/><line x1="52" y1="320" x2="58" y2="320" stroke="#b8b5ae" stroke-width="1.25"/><text x="42" y="210" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66" transform="rotate(-90 42 210)">query plan</text><line x1="60" y1="150" x2="424" y2="150" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="147" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Query fragments (Citus)</text><text x="448" y="162" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">fragments down, partial sums up</text><line x1="60" y1="220" x2="424" y2="220" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="217" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Pushdown (DSQL)</text><text x="448" y="232" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">requests down, filtered rows up</text><line x1="60" y1="440" x2="424" y2="440" stroke="#2f6fd6" stroke-width="2.5"/><text x="448" y="437" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Log-based storage (Aurora)</text><text x="448" y="452" text-anchor="start" font-size="11" font-weight="400" fill="#2f6fd6">pages up, on a cache miss</text></g></svg>