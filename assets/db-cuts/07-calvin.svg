<svg xmlns="http://www.w3.org/2000/svg" width="860" height="412" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 860 412" role="img" aria-label="Calvin&#x27;s steps over time and across layers. The sequencer orders and persists transaction inputs above execution. Every replica then takes locks in log order, executes, and reads and writes its own storage. Partitions send each other the rows a transaction reads." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="ts-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Calvin orders and persists a transaction before it runs</text><text x="24" y="50" font-size="11.5" fill="#6b6a66">Across: the four steps of a transaction, in Calvin's sequence. Down: the layer that runs each step.</text><text x="24" y="66" font-size="11.5" fill="#6b6a66">Orange: the replication point; the shaded steps run again on every replica. Blue: the split point, and what crosses there.</text><rect x="520.0" y="182" width="320.0" height="210" fill="#c25e00" fill-opacity="0.07"/><path d="M200 82H840" stroke="#b8b5ae" stroke-width="1" marker-end="url(#ts-arrow)"/><text x="192" y="86" text-anchor="end" font-size="11.5" fill="#6b6a66">time</text><text x="280.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Order</text><text x="440.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Persist</text><text x="600.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Validate</text><text x="760.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Execute</text><line x1="24" y1="112" x2="840" y2="112" stroke="#e6e4df" stroke-width="1"/><text x="24" y="145.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Sequencer</text><text x="24" y="161.0" font-size="10.5" fill="#6b6a66">above execution: the input log</text><line x1="24" y1="182" x2="840" y2="182" stroke="#e6e4df" stroke-width="1"/><text x="24" y="215.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Scheduler</text><text x="24" y="231.0" font-size="10.5" fill="#6b6a66">concurrency control</text><line x1="24" y1="252" x2="840" y2="252" stroke="#e6e4df" stroke-width="1"/><text x="24" y="285.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Executor</text><text x="24" y="301.0" font-size="10.5" fill="#6b6a66">execution, one per partition</text><line x1="24" y1="322" x2="840" y2="322" stroke="#e6e4df" stroke-width="1"/><text x="24" y="355.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Storage</text><text x="24" y="371.0" font-size="10.5" fill="#6b6a66">access methods and disk</text><line x1="24" y1="392" x2="840" y2="392" stroke="#e6e4df" stroke-width="1"/><line x1="24" y1="182" x2="840" y2="182" stroke="#c25e00" stroke-width="2" stroke-dasharray="5 3"/><text x="836" y="176" text-anchor="end" font-size="11" fill="#c25e00">replication point: transaction inputs</text><path d="M350.0 147.0H370.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M510.0 147.0H600.0V203.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M670.0 217.0H760.0V273.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M760.0 301.0V343.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><rect x="210.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="151.0" text-anchor="middle" font-size="11" fill="#1f1e1d">batch into an epoch</text><rect x="370.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="440.0" y="151.0" text-anchor="middle" font-size="11" fill="#1f1e1d">replicate the batch</text><rect x="530.0" y="203.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600.0" y="221.0" text-anchor="middle" font-size="11" fill="#1f1e1d">lock in log order</text><rect x="690.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="291.0" text-anchor="middle" font-size="11" fill="#1f1e1d">run the transaction</text><rect x="690.0" y="343.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="361.0" text-anchor="middle" font-size="11" fill="#1f1e1d">read and write rows</text><text x="682.0" y="291.0" text-anchor="end" font-size="10.5" fill="#2f6fd6">reads cross partitions</text></svg>