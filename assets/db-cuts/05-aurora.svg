<svg xmlns="http://www.w3.org/2000/svg" width="860" height="342" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 860 342" role="img" aria-label="Aurora&#x27;s steps over time and across layers. The one writer runs the transaction, taking locks and changing pages in its buffer pool, which fetches pages from storage on a miss. It assigns the commit LSN. Storage persists the redo once 4 of 6 copies acknowledge, and each copy builds pages from it. The writer also streams redo to read replicas, which apply it to their cached pages: a cache, not a copy." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="ts-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Aurora runs the transaction on one writer, then persists its redo in storage</text><text x="24" y="50" font-size="11.5" fill="#6b6a66">Across: the four steps of a transaction, in Aurora's sequence. Down: the layer that runs each step.</text><text x="24" y="66" font-size="11.5" fill="#6b6a66">Orange: the replication point; the shaded steps run again on every replica. Blue: the split point, and what crosses there.</text><rect x="680.0" y="252" width="160.0" height="70" fill="#c25e00" fill-opacity="0.07"/><path d="M200 82H840" stroke="#b8b5ae" stroke-width="1" marker-end="url(#ts-arrow)"/><text x="192" y="86" text-anchor="end" font-size="11.5" fill="#6b6a66">time</text><text x="280.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Execute + Validate</text><text x="440.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Order</text><text x="600.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Persist</text><text x="760.0" y="101" text-anchor="middle" font-size="12" font-weight="400" fill="#6b6a66">Apply (after commit)</text><line x1="24" y1="112" x2="840" y2="112" stroke="#e6e4df" stroke-width="1"/><text x="24" y="145.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Writer</text><text x="24" y="161.0" font-size="10.5" fill="#6b6a66">SQL, locks, LSNs; exactly one</text><line x1="24" y1="182" x2="840" y2="182" stroke="#e6e4df" stroke-width="1"/><text x="24" y="215.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Buffer pools</text><text x="24" y="231.0" font-size="10.5" fill="#6b6a66">the writer&#x27;s and each replica&#x27;s</text><line x1="24" y1="252" x2="840" y2="252" stroke="#e6e4df" stroke-width="1"/><text x="24" y="285.0" font-size="12.5" font-weight="600" fill="#1f1e1d">Storage service</text><text x="24" y="301.0" font-size="10.5" fill="#6b6a66">log and pages; 6 copies, 3 AZs</text><line x1="24" y1="322" x2="840" y2="322" stroke="#e6e4df" stroke-width="1"/><line x1="24" y1="249" x2="840" y2="249" stroke="#2f6fd6" stroke-width="2"/><text x="836" y="263" text-anchor="end" font-size="11" fill="#2f6fd6">split point: redo down, pages up</text><line x1="24" y1="252" x2="840" y2="252" stroke="#c25e00" stroke-width="2" stroke-dasharray="5 3"/><text x="836" y="246" text-anchor="end" font-size="11" fill="#c25e00">replication point: redo records</text><path d="M280.0 161.0V203.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M280.0 273.0V231.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#ts-arrow-blue)"/><text x="288.0" y="245.0" text-anchor="start" font-size="10.5" fill="#2f6fd6">page on a miss</text><path d="M350.0 147.0H370.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M440.0 161.0V287.0H530.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#ts-arrow-blue)"/><path d="M670.0 287.0H690.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ts-arrow)"/><path d="M510.0 147.0H760.0V203.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ts-arrow-blue)"/><text x="600.0" y="141.0" text-anchor="middle" font-size="10.5" fill="#2f6fd6">redo stream</text><rect x="210.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="151.0" text-anchor="middle" font-size="11" fill="#1f1e1d">run, take locks</text><rect x="210.0" y="203.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="221.0" text-anchor="middle" font-size="11" fill="#1f1e1d">read and change pages</text><rect x="210.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="291.0" text-anchor="middle" font-size="11" fill="#1f1e1d">serve a page</text><rect x="370.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="440.0" y="151.0" text-anchor="middle" font-size="11" fill="#1f1e1d">assign the commit LSN</text><rect x="530.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600.0" y="291.0" text-anchor="middle" font-size="11" fill="#1f1e1d">4 of 6 copies acknowledge</text><rect x="690.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="291.0" text-anchor="middle" font-size="11" fill="#1f1e1d">build pages from redo</text><rect x="690.0" y="203.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="221.0" text-anchor="middle" font-size="11" fill="#1f1e1d">replicas apply redo</text><text x="682.0" y="221.0" text-anchor="end" font-size="10.5" fill="#6b6a66">a cache, not a copy</text></svg>