<svg xmlns="http://www.w3.org/2000/svg" width="760" height="732" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 732" role="img" aria-label="A two by two grid. Rows: Postgres, which replicates by shipping its WAL, a physical log of page changes, and MySQL, which ships its binlog, a logical log of row changes. Columns: one node with read replicas, and a sharded design where each shard is replicated: Citus for Postgres, Vitess for MySQL. Sharding adds a router above SQL. The engine sets where replication copies: below the buffer pool for Postgres, below SQL for MySQL, whether or not the data is sharded." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Sharding and replication are separate choices</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Across a row, sharding adds a router above SQL and splits the data by key. Down a column, the engine decides which log</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">replication ships, and so how much of the stack every replica repeats. Orange outlines: one copy per replica.</text><text x="317.5" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">One node + read replicas</text><line x1="182" y1="116" x2="453.0" y2="116" stroke="#b8b5ae" stroke-width="1"/><text x="612.5" y="108" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Sharded, each shard replicated</text><line x1="477.0" y1="116" x2="748.0" y2="116" stroke="#b8b5ae" stroke-width="1"/><line x1="465.0" y1="96" x2="465.0" y2="722" stroke="#e6e4df" stroke-width="1"/><line x1="20" y1="430" x2="740" y2="430" stroke="#e6e4df" stroke-width="1"/><text x="20" y="160" text-anchor="start" font-size="13" font-weight="600" fill="#1f1e1d">Postgres</text><text x="20" y="178" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">ships its WAL:</text><text x="20" y="193" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">a physical log</text><text x="20" y="208" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">of page changes</text><text x="317.5" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Postgres + replicas</text><rect x="194" y="156" width="247.0" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="317.5" y="171.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Application</text><text x="317.5" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">one writer holds all the data</text><rect x="242.5" y="214" width="150" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="317.5" y="229.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">SQL</text><rect x="242.5" y="266" width="150" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="317.5" y="281.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="242.5" y="318" width="150" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="317.5" y="333.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="248.5" y="376" width="150" height="24" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.25"/><rect x="245.5" y="373" width="150" height="24" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.5"/><rect x="242.5" y="370" width="150" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="317.5" y="385.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Disk</text><line x1="186" y1="352.0" x2="449.0" y2="352.0" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="612.5" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Citus</text><rect x="489.0" y="156" width="247.0" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="612.5" y="171.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Coordinator</text><line x1="481.0" y1="193" x2="744.0" y2="193" stroke="#2f6fd6" stroke-width="2.5"/><text x="612.5" y="207" text-anchor="middle" font-size="10" font-weight="400" fill="#2f6fd6">split by shard key</text><rect x="500.5" y="214" width="104" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="552.5" y="229.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">SQL</text><rect x="500.5" y="266" width="104" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="552.5" y="281.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="500.5" y="318" width="104" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="552.5" y="333.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="506.5" y="376" width="104" height="24" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.25"/><rect x="503.5" y="373" width="104" height="24" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.5"/><rect x="500.5" y="370" width="104" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="552.5" y="385.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Disk</text><rect x="620.5" y="214" width="104" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="672.5" y="229.5" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">SQL</text><rect x="620.5" y="266" width="104" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="672.5" y="281.5" text-anchor="mi