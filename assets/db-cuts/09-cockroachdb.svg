<svg xmlns="http://www.w3.org/2000/svg" width="860" height="342" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 860 342" role="img" aria-label="CockroachDB's steps over time and across layers. The gateway node runs the SQL and sends key-value reads and writes to each range's leaseholder, which checks locks and writes intents. Raft replicates each intent as it is written. At commit, the gateway fixes the commit timestamp, which a leaseholder may have pushed past a later read, and the commit is done once a majority of the range's replicas acknowledge it. Afterwards, every replica applies the commit and its intents become ordinary values." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="tl-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="tl-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">CockroachDB checks and replicates each write at its range while the transaction runs</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Across: the four steps of a transaction, in CockroachDB's sequence. Down: the layer that runs each step.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Orange: the replication point; the shaded steps run again on every replica. Blue: the split point, and what crosses there.</text><rect x="680" y="252" width="160" height="70" fill="#c25e00" fill-opacity="0.07"/><path d="M200 82H840" stroke="#b8b5ae" stroke-width="1" marker-end="url(#tl-grey)"/><text x="192" y="86" text-anchor="end" font-size="11.5" font-weight="400" fill="#6b6a66">time</text><text x="280.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Execute + Check</text><text x="440.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Number</text><text x="600.0" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Persist</text><text x="760.0" y="101" text-anchor="middle" font-size="12" font-weight="400" fill="#6b6a66">Apply (after commit)</text><line x1="24" y1="112" x2="840" y2="112" stroke="#e6e4df" stroke-width="1"/><text x="24" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Gateway</text><text x="24" y="161" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">SQL on any node; the coordinator</text><line x1="24" y1="182" x2="840" y2="182" stroke="#e6e4df" stroke-width="1"/><text x="24" y="215" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Leaseholders</text><text x="24" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one per range: locks, timestamp cache</text><line x1="24" y1="252" x2="840" y2="252" stroke="#e6e4df" stroke-width="1"/><text x="24" y="285" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Followers</text><text x="24" y="301" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">each range's other replicas</text><line x1="24" y1="322" x2="840" y2="322" stroke="#e6e4df" stroke-width="1"/><line x1="24" y1="252" x2="840" y2="252" stroke="#c25e00" stroke-width="2" stroke-dasharray="5 3"/><text x="836" y="246" text-anchor="end" font-size="11" font-weight="400" fill="#c25e00">replication point: Raft log</text><line x1="24" y1="182" x2="840" y2="182" stroke="#2f6fd6" stroke-width="2"/><text x="836" y="176" text-anchor="end" font-size="11" font-weight="400" fill="#2f6fd6">split point: key-value reads and writes, by range</text><path d="M280.0 161.0V203.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#tl-blue)"/><path d="M280.0 231.0V273.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#tl-grey)"/><path d="M350.0 217.0H440.0V161.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#tl-grey)"/><path d="M510.0 147.0H600.0V273.0" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#tl-blue)"/><path d="M670.0 287.0H690.0" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#tl-grey)"/><rect x="210.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="151.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">run the SQL</text><rect x="210.0" y="203.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="221.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">check locks, write intents</text><rect x="210.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="280.0" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">replicate each intent</text><rect x="370.0" y="133.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="440.0" y="151.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">fix the commit timestamp</text><rect x="530.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600.0" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">a majority acknowledges</text><rect x="690.0" y="273.0" width="140" height="28" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="760.0" y="291.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">resolve intents</text><text x="448" y="168" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">pushed past later reads</text></svg>
