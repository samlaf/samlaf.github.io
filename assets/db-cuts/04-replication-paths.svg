<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 536" role="img" aria-label="A write runs down the primary's stack: SQL, access methods, buffer pool and log, disk. Orange arrows show where it leaves for the replicas at four heights. A physical log leaves below the buffer pool and log, so each replica only writes its disk. An object log leaves below the access methods, so each replica updates its memory and disk. A logical log leaves below SQL, so each replica runs its access methods, buffer pool and log, and disk. A command log leaves above SQL, so each replica runs the whole stack." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1e1d"/></marker><marker id="ar-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c25e00"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Where each write leaves for the replicas</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">A write runs down the primary's stack. At the replication point, it leaves as a log and continues down each replica.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Shaded: the layers every replica runs for every write. The higher the replication point, the more of the stack each replica repeats.</text><text x="20" y="81" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Replicas may also run the upper layers, but only to serve reads, so the figure leaves them out.</text><rect x="30" y="120" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="90.0" y="139" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Write request</text><rect x="30" y="200" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="90.0" y="219" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">SQL</text><line x1="90.0" y1="150" x2="90.0" y2="198" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="280" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="90.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="90.0" y1="230" x2="90.0" y2="278" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="360" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="90.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool + log</text><line x1="90.0" y1="310" x2="90.0" y2="358" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><rect x="30" y="440" width="120" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="90.0" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="90.0" y1="390" x2="90.0" y2="438" stroke="#1f1e1d" stroke-width="1.25" marker-end="url(#ar-ink)"/><text x="90.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Primary</text><text x="90.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">where the write enters</text><rect x="165" y="430" width="140" height="50" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="175" y="440" width="120" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="235.0" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="22" y1="415" x2="158" y2="415" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M158 415H235.0V438" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="164" y="409" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">page changes</text><text x="235.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Physical log</text><text x="235.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Postgres WAL, Aurora redo</text><rect x="310" y="350" width="140" height="130" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="320" y="360" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool + log</text><rect x="320" y="440" width="120" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="380.0" y1="390" x2="380.0" y2="438" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><line x1="22" y1="335" x2="158" y2="335" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M158 335H380.0V358" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="164" y="329" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">new object values</text><text x="380.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Object log</text><text x="380.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">FaRM</text><rect x="455" y="270" width="140" height="210" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="465" y="280" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="525.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="465" y="360" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="525.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool + log</text><line x1="525.0" y1="310" x2="525.0" y2="358" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><rect x="465" y="440" width="120" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="525.0" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="525.0" y1="390" x2="525.0" y2="438" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><line x1="22" y1="255" x2="158" y2="255" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M158 255H525.0V278" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="164" y="249" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">row and key changes</text><text x="525.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Logical log</text><text x="525.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Vitess, CockroachDB, DSQL</text><rect x="600" y="190" width="140" height="290" rx="6" fill="#c25e00" fill-opacity="0.07"/><rect x="610" y="200" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="670.0" y="219" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">SQL</text><rect x="610" y="280" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="670.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><line x1="670.0" y1="230" x2="670.0" y2="278" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><rect x="610" y="360" width="120" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="670.0" y="379" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool + log</text><line x1="670.0" y1="310" x2="670.0" y2="358" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><rect x="610" y="440" width="120" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="670.0" y="459" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="670.0" y1="390" x2="670.0" y2="438" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ar)"/><line x1="22" y1="175" x2="158" y2="175" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M158 175H670.0V198" fill="none" stroke="#c25e00" stroke-width="1.5" marker-end="url(#ar-or)"/><text x="164" y="169" text-anchor="start" font-size="11" font-weight="400" fill="#c25e00">transactions and their inputs</text><text x="670.0" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Command log</text><text x="670.0" y="516" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Calvin, VoltDB</text></svg>
