<svg xmlns="http://www.w3.org/2000/svg" width="852" height="614" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 852 614" role="img" aria-label="Designs placed by where their nodes couple and by who may write a row; Aurora and DSQL highlighted" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Any-node writes need coordination below SQL: a coherent cache or a commit check</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Rows: who may write a row (Ziegler et al.). Columns: where nodes couple, top of the stack down. Italic: what crosses.</text><text x="204.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Nowhere</text><text x="204.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">log shipping</text><text x="204.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">nothing</text><text x="204.0" y="125" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">between writers</text><text x="318.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Above SQL</text><text x="318.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">routers</text><text x="318.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">statements,</text><text x="318.0" y="125" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">fragments</text><text x="432.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Below SQL</text><text x="432.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">key-value</text><text x="432.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">rows and keys</text><text x="546.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Pages</text><text x="546.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">remote memory</text><text x="546.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">pages, objects</text><text x="546.0" y="125" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">over the network</text><text x="660.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Below the buffer pool</text><text x="660.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">log-based storage</text><text x="660.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">redo down,</text><text x="660.0" y="125" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">pages up</text><text x="774.0" y="78" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Blocks</text><text x="774.0" y="94" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">shared volumes</text><text x="774.0" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#6b6a66">blocks</text><text x="20" y="198.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Single-Writer</text><text x="20" y="214.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one writer total</text><rect x="150" y="150" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="204.0" y="188.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Postgres</text><text x="204.0" y="203.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">MySQL</text><text x="204.0" y="218.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">RDS, all modes</text><rect x="264" y="150" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="378" y="150" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="492" y="150" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="606" y="150" width="108" height="98" rx="4" fill="#eaf1fb" stroke="#2f6fd6" stroke-width="1.75"/><text x="660.0" y="180.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Aurora</text><text x="660.0" y="195.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Neon</text><text x="660.0" y="210.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">SQL Hyperscale</text><text x="660.0" y="225.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">AlloyDB</text><rect x="720" y="150" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="774.0" y="203.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">PolarDB</text><text x="20" y="302.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Partitioned-Writer</text><text x="20" y="318.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one per partition</text><rect x="150" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="264" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="318.0" y="277.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">App shards</text><text x="318.0" y="292.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Citus</text><text x="318.0" y="307.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Vitess</text><text x="318.0" y="322.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Greenplum</text><text x="318.0" y="337.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Limitless</text><rect x="378" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="432.0" y="277.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Spanner</text><text x="432.0" y="292.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">CockroachDB</text><text x="432.0" y="307.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">TiDB</text><text x="432.0" y="322.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">YugabyteDB</text><text x="432.0" y="337.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">DynamoDB</text><rect x="492" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="546.0" y="307.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">FaRM</text><rect x="606" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="720" y="254" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="20" y="406.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="20" y="422.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">coherent caches</text><rect x="150" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="264" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="378" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="492" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="546.0" y="396.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Oracle RAC</text><text x="546.0" y="411.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Db2 pureScale</text><text x="546.0" y="426.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">ScaleStore</text><rect x="606" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="660.0" y="411.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Aurora MM</text><rect x="720" y="358" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="20" y="510.0" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="20" y="526.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">no coherent cache</text><rect x="150" y="462" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="264" y="462" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="378" y="462" width="108" height="98" rx="4" fill="#eaf1fb" stroke="#2f6fd6" stroke-width="1.75"/><text x="432.0" y="507.5" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Aurora DSQL</text><text x="432.0" y="522.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">FoundationDB</text><rect x="492" y="462" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="546.0" y="507.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">NAM-DB</text><text x="546.0" y="522.5" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Sherman</text><rect x="606" y="462" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><rect x="720" y="462" width="108" height="98" rx="4" fill="#ffffff" stroke="#dddbd6" stroke-width="1.0"/><text x="20" y="584" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Coherent caches pay with invalidation traffic and lock coordination.</text><text x="20" y="600" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">No-cache shared writers pay a storage round trip per read; DSQL and FoundationDB add commit-time aborts.</text></svg>
