<svg xmlns="http://www.w3.org/2000/svg" width="760" height="411" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 411" role="img" aria-label="Which nodes decide, in each family. Rows are the four families that span machines, each named by where it splits; columns are owner-decider, separate-decider, and single-decider. Shared nothing: routed shards, such as Vitess and Citus, let each shard lock its rows, with 2PC between shards; Calvin's input log fixes the order before any partition runs. Shared key-value store: CockroachDB and Spanner let each leaseholder lock its range; DSQL's adjudicators check write sets at commit. Shared buffer pool: FaRM's primaries lock their objects at commit; NAM-DB's writer locks records by compare-and-swap. Shared disk: in Aurora Multi-Master, now retired, storage takes the first write to each page and the loser aborts; Oracle RAC orders with global locks, one joint above its split; and only this family has a single-decider design: Aurora and Neon have one writer, which orders every write, above the split." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Which nodes decide, in each family</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Every family that spans machines has an owner-decider and a separate-decider design.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Only shared disk adds a third: one writer, over storage that spans machines.</text><text x="20" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#2f6fd6">Family</text><text x="20" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">named by where it splits</text><text x="182" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#6b6a66">Owner-decider</text><text x="182" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the nodes that hold the data decide</text><text x="368" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#6b6a66">Separate-decider</text><text x="368" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">nodes that don't hold the data decide</text><text x="554" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#6b6a66">Single-decider</text><text x="554" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the one writer decides</text><line x1="20" y1="132" x2="740" y2="132" stroke="#ecebe7" stroke-width="1.5"/><text x="20" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared nothing</text><text x="20" y="167" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">splits above SQL</text><text x="182" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Routed shards</text><text x="182" y="167" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Vitess, Citus: each shard locks</text><text x="182" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">its rows; 2PC joins shards</text><text x="368" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Deterministic</text><text x="368" y="167" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Calvin: the input log fixes the</text><text x="368" y="180" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">order before any partition runs</text><line x1="20" y1="196" x2="740" y2="196" stroke="#ecebe7" stroke-width="1.5"/><text x="20" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared key-value store</text><text x="20" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">splits below SQL</text><text x="182" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Range owners</text><text x="182" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">CockroachDB, Spanner: each</text><text x="182" y="244" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">leaseholder locks its range</text><text x="368" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Unbundled</text><text x="368" y="231" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">DSQL: adjudicators check</text><text x="368" y="244" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">write sets at commit</text><line x1="20" y1="260" x2="740" y2="260" stroke="#ecebe7" stroke-width="1.5"/><text x="20" y="280" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared buffer pool</text><text x="20" y="295" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">splits below access methods</text><text x="182" y="280" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Object owners</text><text x="182" y="295" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">FaRM: each primary locks its</text><text x="182" y="308" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">objects at commit</text><text x="368" y="280" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Disaggregated memory</text><text x="368" y="295" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">NAM-DB: the writer locks</text><text x="368" y="308" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">records by compare-and-swap</text><line x1="20" y1="324" x2="740" y2="324" stroke="#ecebe7" stroke-width="1.5"/><text x="20" y="344" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared disk</text><text x="20" y="359" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">splits below the buffer pool</text><text x="182" y="344" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Page owners</text><text x="182" y="359" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora Multi-Master (retired):</text><text x="182" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">storage takes the first write</text><text x="182" y="385" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">to a page; the loser aborts</text><text x="368" y="344" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Coherent caches</text><text x="368" y="359" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Oracle RAC: global locks, one</text><text x="368" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">joint above the split</text><text x="554" y="344" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Log-based storage</text><text x="554" y="359" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora, Neon: the one writer</text><text x="554" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">orders, above the split</text></svg>
