<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 620" role="img" aria-label="Who decides, at each joint. Each row is a joint and the family that splits the data there. Shared nothing: routed shards, such as Vitess and Citus, let each shard lock its rows, with 2PC between shards; Calvin's input log fixes the order before any partition runs. Shared key-value store: CockroachDB and Spanner let each leaseholder lock its range; DSQL's adjudicators check write sets at commit. Shared buffer pool: FaRM's primaries lock their objects at commit; NAM-DB's writer locks records by compare-and-swap. Oracle RAC also orders at this joint, with global locks and coherent caches, though it splits one joint lower. Shared disk: storage never decides, and Aurora has one writer, which orders every write one joint up." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Who decides, at each joint</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Each row is a joint, and the family that splits there. Within a family, the two designs differ in</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">who runs the ordering point. Storage never decides, and Oracle RAC orders one joint above its split.</text><text x="156" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#2f6fd6">Split point</text><text x="156" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the family</text><text x="346" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#6b6a66">Orders on the data owners</text><text x="346" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the nodes that hold the data decide</text><text x="561" y="102" text-anchor="start" font-size="12" font-weight="600" fill="#6b6a66">Orders elsewhere</text><text x="561" y="118" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">something else decides</text><rect x="20" y="132" width="110" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="75.0" y="151" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Application</text><rect x="20" y="230" width="110" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="75.0" y="249" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">SQL</text><rect x="20" y="328" width="110" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="75.0" y="347" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Access methods</text><rect x="20" y="472" width="110" height="30" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="75.0" y="491" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="20" y="570" width="110" height="30" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="75.0" y="589" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Disk</text><line x1="75.0" y1="188" x2="150" y2="188" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><line x1="152" y1="188" x2="326" y2="188" stroke="#2f6fd6" stroke-width="2.5"/><text x="156" y="181" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared nothing</text><line x1="342" y1="188" x2="541" y2="188" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="346" y="181" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Routed shards</text><text x="346" y="202" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Vitess, Citus: each shard locks its</text><text x="346" y="215" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">rows, and 2PC joins shards</text><line x1="557" y1="188" x2="746" y2="188" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="561" y="181" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Deterministic</text><text x="561" y="202" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Calvin: the input log fixes the</text><text x="561" y="215" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">order before any partition runs</text><line x1="75.0" y1="286" x2="150" y2="286" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><line x1="152" y1="286" x2="326" y2="286" stroke="#2f6fd6" stroke-width="2.5"/><text x="156" y="279" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared key-value store</text><line x1="342" y1="286" x2="541" y2="286" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="346" y="279" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Range owners</text><text x="346" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">CockroachDB, Spanner: each</text><text x="346" y="313" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">leaseholder locks its range</text><line x1="557" y1="286" x2="746" y2="286" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="561" y="279" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Unbundled</text><text x="561" y="300" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">DSQL: adjudicators check</text><text x="561" y="313" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">write sets at commit</text><line x1="75.0" y1="384" x2="150" y2="384" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><line x1="152" y1="384" x2="326" y2="384" stroke="#2f6fd6" stroke-width="2.5"/><text x="156" y="377" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared buffer pool</text><line x1="342" y1="384" x2="541" y2="384" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="346" y="377" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Object owners</text><text x="346" y="398" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">FaRM: each primary locks its</text><text x="346" y="411" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">objects at commit</text><line x1="557" y1="384" x2="746" y2="384" stroke="#6b6a66" stroke-width="2.5" stroke-dasharray="5 3"/><text x="561" y="377" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Disaggregated memory</text><text x="561" y="398" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">NAM-DB: the writer locks records</text><text x="561" y="411" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">by compare-and-swap</text><text x="561" y="428" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Coherent caches</text><text x="561" y="442" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Oracle RAC: global locks; its split</text><text x="561" y="455" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">point sits one joint lower</text><line x1="75.0" y1="528" x2="150" y2="528" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><line x1="152" y1="528" x2="326" y2="528" stroke="#2f6fd6" stroke-width="2.5"/><text x="156" y="521" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Shared disk</text><line x1="342" y1="528" x2="541" y2="528" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><text x="346" y="521" text-anchor="start" font-size="12" font-weight="400" fill="#6b6a66">None: storage never decides</text><text x="346" y="542" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">it only holds pages and logs</text><line x1="557" y1="528" x2="746" y2="528" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="2 3"/><text x="561" y="521" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Log-based storage</text><text x="561" y="542" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora: the one writer orders</text><text x="561" y="555" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">every write, one joint up</text></svg>
