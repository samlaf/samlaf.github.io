<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 568" role="img" aria-label="A decision tree with three questions and four answers. First: must anyone decide? If not, no node decides (no-decider): replicas merge writes in any order, which is safe only if merging breaks no rule the data must keep, as in Cassandra, Riak, and CRDTs. If so: how many nodes may write? With one writer, the writer decides, inside itself, at no joint (single-decider); its locks, cache, and log stay private, and shards, if any, stay hidden, as in Aurora and read replicas. With many writers, the locks, cache, and log must be split or kept coherent. Then: which nodes decide? If the data owners decide (owner-decider), they validate at the split, in each slice; the locks split with the data, and shards show to whoever coordinates commits, the application or the engine, as in Vitess, CockroachDB, and FaRM. If something else decides (separate-decider), it decides at the split on other nodes, or above it; the locks still split, and the data shards stay hidden, as in Calvin, DSQL, and Oracle RAC." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Who decides what commits?</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Three questions sort every design into one of four answers. Most of the design follows from</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">the answer.</text><rect x="176.25" y="92" width="180" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="266.25" y="112.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Must anyone decide?</text><path d="M266.25 124V142H107.0V376" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M266.25 142H425.5V166" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="113.0" y="158" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">no: writes merge</text><text x="431.5" y="158" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">yes</text><rect x="320.5" y="166" width="210" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="425.5" y="186.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">How many nodes may write?</text><path d="M425.5 198V216H289.0V376" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M425.5 216H562.0V240" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="295.0" y="236" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one</text><text x="568.0" y="232" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">many</text><rect x="437.0" y="240" width="250" height="38" rx="4" fill="#ecebe7"/><text x="562.0" y="255" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">Split the locks, cache, and log,</text><text x="562.0" y="269" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">or keep them coherent across nodes</text><path d="M562.0 278V292" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><rect x="472.0" y="292" width="180" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="562.0" y="312.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Which nodes decide?</text><path d="M562.0 324V340H471.0V376" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M562.0 340H653.0V376" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="477.0" y="358" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the data owners</text><text x="659.0" y="358" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">something else</text><rect x="20" y="376" width="174" height="168" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="32" y="398" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">No-decider</text><text x="32" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">No validation joint:</text><text x="32" y="432" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">replicas merge writes</text><text x="32" y="446" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">in any order.</text><text x="32" y="460" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Safe only if merging</text><text x="32" y="474" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">breaks no rule the data</text><text x="32" y="488" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">must keep.</text><line x1="32" y1="508" x2="182" y2="508" stroke="#ecebe7" stroke-width="1.5"/><text x="32" y="529" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Cassandra, Riak, CRDTs</text><rect x="202" y="376" width="174" height="168" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="214" y="398" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Single-decider</text><text x="214" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Validates in the writer,</text><text x="214" y="432" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">at no joint.</text><text x="214" y="446" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Locks, cache, and log</text><text x="214" y="460" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">stay private.</text><text x="214" y="474" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Shards, if any, stay</text><text x="214" y="488" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">hidden.</text><line x1="214" y1="508" x2="364" y2="508" stroke="#ecebe7" stroke-width="1.5"/><text x="214" y="529" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Aurora, read replicas</text><rect x="384" y="376" width="174" height="168" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="396" y="398" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Owner-decider</text><text x="396" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Validates at the split,</text><text x="396" y="432" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">in each slice.</text><text x="396" y="446" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">The locks split with</text><text x="396" y="460" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the data. Shards show to</text><text x="396" y="474" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">whoever coordinates</text><text x="396" y="488" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">commits: app or engine.</text><line x1="396" y1="508" x2="546" y2="508" stroke="#ecebe7" stroke-width="1.5"/><text x="396" y="529" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Vitess, CockroachDB, FaRM</text><rect x="566" y="376" width="174" height="168" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="578" y="398" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Separate-decider</text><text x="578" y="418" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Decides at the split on</text><text x="578" y="432" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">other nodes, or above it.</text><text x="578" y="446" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">The locks still split.</text><text x="578" y="460" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Data shards stay hidden.</text><line x1="578" y1="508" x2="728" y2="508" stroke="#ecebe7" stroke-width="1.5"/><text x="578" y="529" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Calvin, DSQL, Oracle RAC</text></svg>
