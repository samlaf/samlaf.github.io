<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 466" role="img" aria-label="A decision tree with two questions and three answers. First: how many nodes may write? With one writer, the writer decides, inside itself, at no joint (single-decider); its locks, cache, and log stay private, and shards, if any, stay hidden, as in Aurora, Neon, and read replicas. With many writers, the locks, cache, and log must be split or kept coherent. Then: which nodes decide? If the data owners decide (owner-decider), they order at the split, in each slice; the locks split with the data, and shards show to whoever coordinates commits, the application or the engine, as in Vitess, CockroachDB, and FaRM. If something else decides (separate-decider), it orders at the split on other nodes, or above it; the locks still split, and the data shards stay hidden, as in Calvin, DSQL, NAM-DB, and Oracle RAC." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Who checks conflicts?</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Two questions sort every design into one of three answers. Most of the design follows from</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">the answer.</text><rect x="209.0" y="92" width="220" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="319.0" y="112.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">How many nodes may write?</text><path d="M319.0 124V142H136.0V302" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M319.0 142H502.0V166" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="142.0" y="162" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one</text><text x="508.0" y="158" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">many</text><rect x="372.0" y="166" width="260" height="38" rx="4" fill="#ecebe7"/><text x="502.0" y="181" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">Split the locks, cache, and log,</text><text x="502.0" y="195" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">or keep them coherent across nodes</text><path d="M502.0 204V218" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><rect x="392.0" y="218" width="220" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="502.0" y="238.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Which nodes decide?</text><path d="M502.0 250V266H380.0V302" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M502.0 266H624.0V302" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="386.0" y="284" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the data owners</text><text x="630.0" y="284" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">something else</text><rect x="20" y="302" width="232" height="140" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="32" y="324" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Single-decider</text><text x="32" y="344" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders inside the writer, at no joint.</text><text x="32" y="358" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Locks, cache, and log stay private.</text><text x="32" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Shards, if any, stay hidden.</text><line x1="32" y1="406" x2="240" y2="406" stroke="#ecebe7" stroke-width="1.5"/><text x="32" y="427" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Aurora, Neon, read replicas</text><rect x="264" y="302" width="232" height="140" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="276" y="324" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Owner-decider</text><text x="276" y="344" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders at the split, in each slice.</text><text x="276" y="358" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">The locks split with the data.</text><text x="276" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Shards show to whoever coordinates</text><text x="276" y="386" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">commits: the app, or the engine.</text><line x1="276" y1="406" x2="484" y2="406" stroke="#ecebe7" stroke-width="1.5"/><text x="276" y="427" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Vitess, CockroachDB, FaRM</text><rect x="508" y="302" width="232" height="140" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="520" y="324" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Separate-decider</text><text x="520" y="344" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders at the split on other nodes,</text><text x="520" y="358" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">or above it.</text><text x="520" y="372" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">The locks still split.</text><text x="520" y="386" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Data shards stay hidden.</text><line x1="520" y1="406" x2="728" y2="406" stroke="#ecebe7" stroke-width="1.5"/><text x="520" y="427" text-anchor="start" font-size="11" font-weight="600" fill="#1f1e1d">Calvin, DSQL, NAM-DB, Oracle RAC</text></svg>
