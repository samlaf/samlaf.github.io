<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 370" role="img" aria-label="Two panels. Left, split, order, replicate, as in Vitess and most designs: the application and router sit on top; a blue line splits the data into two shards, keys a to m and n to z; each shard then orders its own writes in its own SQL engine; an orange line below replicates each shard three times through its binlog. Right, order, replicate, split, as in Calvin: a sequencer first fixes one order for every key; an orange line then replicates the input log of transactions to three replicas; a blue line then splits each replica into two partitions, and each transaction runs on the partitions that hold its keys. Both end with six pieces, but Vitess has one order per shard and Calvin one order for all, and in Calvin each replica repeats far more of the work." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><rect x="14" y="250" width="362" height="74" rx="6" fill="#c25e00" fill-opacity="0.07"/><text x="20" y="28" text-anchor="start" font-size="13" font-weight="600" fill="#1f1e1d">Split, order, replicate</text><text x="20" y="45" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Vitess, and most designs</text><rect x="20" y="68" width="350" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="195.0" y="85" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application + router</text><text x="195.0" y="99" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">every query enters here</text><line x1="20" y1="132" x2="370" y2="132" stroke="#2f6fd6" stroke-width="2.5"/><text x="20" y="125" text-anchor="start" font-size="10.5" font-weight="400" fill="#2f6fd6">split: the router sends each statement to its shard</text><line x1="20" y1="246" x2="370" y2="246" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="20" y="239" text-anchor="start" font-size="10.5" font-weight="400" fill="#c25e00">replicate: each shard ships its binlog</text><rect x="20.0" y="142" width="169.0" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="104.5" y="158" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">order: the shard locks keys a–m</text><rect x="20.0" y="180" width="169.0" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="104.5" y="197" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><text x="104.5" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">keys a–m, runs each write once</text><rect x="20.0" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="46.16666666666667" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="46.16666666666667" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="78.33333333333334" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="104.50000000000001" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="104.50000000000001" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="136.66666666666669" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="162.83333333333334" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="162.83333333333334" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><text x="104.5" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">three replicas of a–m</text><rect x="201.0" y="142" width="169.0" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="285.5" y="158" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">order: the shard locks keys n–z</text><rect x="201.0" y="180" width="169.0" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="285.5" y="197" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL</text><text x="285.5" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">keys n–z, runs each write once</text><rect x="201.0" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="227.16666666666666" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="227.16666666666666" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="259.3333333333333" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="285.5" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="285.5" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><rect x="317.6666666666667" y="258" width="52.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="343.83333333333337" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="343.83333333333337" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">storage</text><text x="285.5" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">three replicas of n–z</text><text x="20" y="342" text-anchor="start" font-size="11" font-weight="400" fill="#1f1e1d">Each shard orders its own writes.</text><text x="20" y="358" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Each replica only applies the row changes.</text><rect x="384" y="170" width="362" height="154" rx="6" fill="#c25e00" fill-opacity="0.07"/><text x="390" y="28" text-anchor="start" font-size="13" font-weight="600" fill="#1f1e1d">Order, replicate, split</text><text x="390" y="45" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">Calvin</text><rect x="390" y="68" width="350" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="565.0" y="85" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Application</text><text x="565.0" y="99" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">every transaction enters here</text><rect x="390" y="118" width="350" height="24" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="565.0" y="134" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">order: the sequencer fixes one order for every key</text><line x1="390" y1="166" x2="740" y2="166" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><text x="390" y="159" text-anchor="start" font-size="10.5" font-weight="400" fill="#c25e00">replicate: the input log of transactions</text><line x1="390" y1="246" x2="740" y2="246" stroke="#2f6fd6" stroke-width="2.5"/><text x="390" y="239" text-anchor="start" font-size="10.5" font-weight="400" fill="#2f6fd6">split: each replica partitions the log by key</text><rect x="390.0" y="180" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="444.3333333333333" y="197" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="444.3333333333333" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="390.0" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="415.6666666666667" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="415.6666666666667" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="447.3333333333333" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="473.0" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="473.0" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="444.3333333333333" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">replica 1</text><rect x="510.6666666666667" y="180" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="565.0" y="197" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="565.0" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="510.6666666666667" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="536.3333333333334" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="536.3333333333334" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="568.0" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="593.6666666666666" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="593.6666666666666" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="565.0" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">replica 2</text><rect x="631.3333333333334" y="180" width="108.66666666666667" height="40" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="685.6666666666667" y="197" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Input log</text><text x="685.6666666666667" y="211" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">all keys</text><rect x="631.3333333333334" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="657.0" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">a–m</text><text x="657.0" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><rect x="688.6666666666667" y="258" width="51.333333333333336" height="40" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="714.3333333333334" y="275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">n–z</text><text x="714.3333333333334" y="289" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">execute</text><text x="685.6666666666667" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">replica 3</text><text x="390" y="342" text-anchor="start" font-size="11" font-weight="400" fill="#1f1e1d">Each replica runs every transaction.</text><text x="390" y="358" text-anchor="start" font-size="11" font-weight="400" fill="#6b6a66">That works only because execution is deterministic.</text></svg>
