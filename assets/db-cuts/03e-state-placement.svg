<svg xmlns="http://www.w3.org/2000/svg" width="760" height="703" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 703" role="img" aria-label="Where each design keeps the state that orders writes: locks, cache, and log, grouped by who checks conflicts. In single-decider designs, read replicas and Aurora, all three stay in one node. In owner-decider designs, routed shards, range owners, and FaRM's object owners, the locks split with the data, per shard, range, or object, and so do the caches and logs, except that FaRM keeps no cache. In separate-decider designs, the locks still split, per partition, key range, record, or resource, but caches and logs vary most: Calvin and DSQL share one log stream, and NAM-DB and Oracle RAC keep one log per node and merge them; RAC also keeps one coherent cache per node." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Where each design keeps the state that orders writes</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">With one writer, all three stay in one node. With many, the locks always split, so each slice has</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">one owner. With separate deciders, caches and logs have the most options.</text><text x="280.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Locks</text><text x="280.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">who checks conflicts</text><text x="464.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Cache</text><text x="464.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">hot pages or rows</text><text x="648.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Log</text><text x="648.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">the order, made durable</text><text x="20" y="148" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Single-decider</text><text x="128" y="148" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the one writer decides</text><line x1="20" y1="155" x2="736" y2="155" stroke="#b8b5ae" stroke-width="1"/><text x="30" y="179" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Read replicas</text><text x="30" y="193" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Postgres, MySQL</text><rect x="192" y="162" width="176" height="40" rx="4" fill="#ecebe7"/><text x="280.0" y="186.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary</text><rect x="376" y="162" width="176" height="40" rx="4" fill="#ecebe7"/><text x="464.0" y="186.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary</text><rect x="560" y="162" width="176" height="40" rx="4" fill="#ecebe7"/><text x="648.0" y="186.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary's WAL</text><text x="30" y="224" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Log-based storage</text><text x="30" y="238" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Aurora</text><rect x="192" y="207" width="176" height="40" rx="4" fill="#ecebe7"/><text x="280.0" y="231.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the one writer</text><rect x="376" y="207" width="176" height="40" rx="4" fill="#ecebe7"/><text x="464.0" y="224.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the writer's;</text><text x="464.0" y="237.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">replicas follow redo</text><rect x="560" y="207" width="176" height="40" rx="4" fill="#ecebe7"/><text x="648.0" y="224.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">written by the writer,</text><text x="648.0" y="237.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">kept by storage</text><text x="20" y="276" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Owner-decider</text><text x="121" y="276" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the nodes that hold the data decide</text><line x1="20" y1="283" x2="736" y2="283" stroke="#b8b5ae" stroke-width="1"/><text x="30" y="307" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Routed shards</text><text x="30" y="321" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Vitess, Citus</text><rect x="192" y="290" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="314.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><rect x="376" y="290" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="464.0" y="314.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><rect x="560" y="290" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="648.0" y="314.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><text x="30" y="352" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Range owners</text><text x="30" y="366" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">CockroachDB, Spanner</text><rect x="192" y="335" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="352.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per range, at</text><text x="280.0" y="365.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its leaseholder</text><rect x="376" y="335" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="464.0" y="352.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per node, for</text><text x="464.0" y="365.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its own ranges</text><rect x="560" y="335" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="648.0" y="352.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Raft log</text><text x="648.0" y="365.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per range</text><text x="30" y="397" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Object owners</text><text x="30" y="411" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">FaRM</text><rect x="192" y="380" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="397.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per object,</text><text x="280.0" y="410.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">at its primary</text><text x="464.0" y="397.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">none: reads go</text><text x="464.0" y="410.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">to the primary</text><rect x="560" y="380" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="648.0" y="397.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per primary, copied</text><text x="648.0" y="410.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">to its backups</text><text x="20" y="449" text-anchor="start" font-size="12" font-weight="600" fill="#1f1e1d">Separate-decider</text><text x="142" y="449" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">nodes that don't hold the data decide</text><line x1="20" y1="456" x2="736" y2="456" stroke="#b8b5ae" stroke-width="1"/><text x="30" y="480" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Deterministic</text><text x="30" y="494" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Calvin</text><rect x="192" y="463" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="480.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per partition,</text><text x="280.0" y="493.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in log order</text><rect x="376" y="463" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="464.0" y="487.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per partition</text><rect x="560.75" y="463.75" width="174.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="648.0" y="480.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one input log,</text><text x="648.0" y="493.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged by epoch</text><text x="30" y="525" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Unbundled</text><text x="30" y="539" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">DSQL</text><rect x="192" y="508" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="525.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">adjudicators,</text><text x="280.0" y="538.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per key range</text><rect x="376" y="508" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="464.0" y="525.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in storage,</text><text x="464.0" y="538.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per key range</text><rect x="560.75" y="508.75" width="174.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="648.0" y="525.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the journal, one</text><text x="648.0" y="538.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">shared service</text><text x="30" y="570" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Disaggregated memory</text><text x="30" y="584" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">NAM-DB</text><rect x="192" y="553" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="570.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per record, by CAS</text><text x="280.0" y="583.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in memory servers</text><text x="464.0" y="577.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">none</text><rect x="560.75" y="553.75" width="174.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="648.0" y="570.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per compute thread,</text><text x="648.0" y="583.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged at recovery</text><text x="30" y="615" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Coherent caches</text><text x="30" y="629" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Oracle RAC</text><rect x="192" y="598" width="176" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="280.0" y="615.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per resource, at</text><text x="280.0" y="628.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its master node</text><rect x="376.75" y="598.75" width="174.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="464.0" y="615.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one per node, coherent;</text><text x="464.0" y="628.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">a master per block</text><rect x="560.75" y="598.75" width="174.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="648.0" y="615.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one per node,</text><text x="648.0" y="628.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged by SCN</text><g transform="translate(20 663) scale(0.5)"><rect x="0" y="0" width="40" height="40" rx="4" fill="#ecebe7"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="46" y="677" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">in one node</text><g transform="translate(137.2 663) scale(0.5)"><rect x="0" y="0" width="40" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="163.2" y="677" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">split: each slice has one owner</text><g transform="translate(358.4 663) scale(0.5)"><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="384.4" y="677" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one per node, kept coherent or merged</text><g transform="translate(610.8 663) scale(0.5)"><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="636.8" y="677" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one shared stream</text></svg>
