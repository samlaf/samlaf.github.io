<svg xmlns="http://www.w3.org/2000/svg" width="760" height="591" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 591" role="img" aria-label="Where each design keeps the state that orders writes: locks, cache, and log. Read replicas and Aurora keep locks, cache, and log in one node, and have one writer. Every design with many writers splits its locks, so that each slice has one owner: per shard, partition, range, key range, object, record, or resource. Caches are split, absent, or kept coherent. Logs vary most: split per shard or range, one per node and merged, or one shared stream, as in Calvin and DSQL." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Where each design keeps the state that orders writes</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Every design with many writers splits its locks, so each slice has one owner. Caches and logs have</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">more options: a log can stay one per node and be merged, or be one stream that every writer shares.</text><text x="260.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Locks</text><text x="260.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">who checks conflicts</text><text x="428.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Cache</text><text x="428.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">hot pages or rows</text><text x="596.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Log</text><text x="596.0" y="114" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">the order, made durable</text><text x="710" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Writers</text><text x="20" y="141" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Read replicas</text><text x="20" y="155" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Postgres, MySQL</text><rect x="180" y="124" width="160" height="40" rx="4" fill="#ecebe7"/><text x="260.0" y="148.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary</text><rect x="348" y="124" width="160" height="40" rx="4" fill="#ecebe7"/><text x="428.0" y="148.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary</text><rect x="516" y="124" width="160" height="40" rx="4" fill="#ecebe7"/><text x="596.0" y="148.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the primary's WAL</text><text x="710" y="148.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">one</text><text x="20" y="186" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Routed shards</text><text x="20" y="200" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Vitess, Citus</text><rect x="180" y="169" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><rect x="348" y="169" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="428.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><rect x="516" y="169" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="596.0" y="193.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per shard</text><text x="710" y="193.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="231" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Deterministic</text><text x="20" y="245" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Calvin</text><rect x="180" y="214" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="231.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per partition,</text><text x="260.0" y="244.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in log order</text><rect x="348" y="214" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="428.0" y="238.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per partition</text><rect x="516.75" y="214.75" width="158.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="596.0" y="231.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one input log,</text><text x="596.0" y="244.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged by epoch</text><text x="710" y="238.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="276" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Range owners</text><text x="20" y="290" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">CockroachDB, Spanner</text><rect x="180" y="259" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="276.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per range, at</text><text x="260.0" y="289.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its leaseholder</text><rect x="348" y="259" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="428.0" y="276.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per node, for</text><text x="428.0" y="289.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its own ranges</text><rect x="516" y="259" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="596.0" y="276.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Raft log</text><text x="596.0" y="289.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per range</text><text x="710" y="283.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="321" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Unbundled</text><text x="20" y="335" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">DSQL</text><rect x="180" y="304" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="321.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">adjudicators,</text><text x="260.0" y="334.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per key range</text><rect x="348" y="304" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="428.0" y="321.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in storage,</text><text x="428.0" y="334.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per key range</text><rect x="516.75" y="304.75" width="158.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="596.0" y="321.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the journal, one</text><text x="596.0" y="334.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">shared service</text><text x="710" y="328.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="366" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Object owners</text><text x="20" y="380" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">FaRM</text><rect x="180" y="349" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="366.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per object,</text><text x="260.0" y="379.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">at its primary</text><text x="428.0" y="366.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">none: reads go</text><text x="428.0" y="379.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">to the primary</text><rect x="516" y="349" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="596.0" y="366.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per primary, copied</text><text x="596.0" y="379.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">to its backups</text><text x="710" y="373.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="411" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Disaggregated memory</text><text x="20" y="425" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">NAM-DB</text><rect x="180" y="394" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="411.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per record, by CAS</text><text x="260.0" y="424.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">in memory servers</text><text x="428.0" y="418.0" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">none</text><rect x="516.75" y="394.75" width="158.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="596.0" y="411.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per compute thread,</text><text x="596.0" y="424.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged at recovery</text><text x="710" y="418.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="456" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Coherent caches</text><text x="20" y="470" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Oracle RAC</text><rect x="180" y="439" width="160" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="260.0" y="456.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">per resource, at</text><text x="260.0" y="469.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">its master node</text><rect x="348.75" y="439.75" width="158.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="428.0" y="456.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one per node, coherent;</text><text x="428.0" y="469.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">a master per block</text><rect x="516.75" y="439.75" width="158.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="596.0" y="456.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">one per node,</text><text x="596.0" y="469.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">merged by SCN</text><text x="710" y="463.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">many</text><text x="20" y="501" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Log-based storage</text><text x="20" y="515" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">Aurora</text><rect x="180" y="484" width="160" height="40" rx="4" fill="#ecebe7"/><text x="260.0" y="508.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the one writer</text><rect x="348" y="484" width="160" height="40" rx="4" fill="#ecebe7"/><text x="428.0" y="501.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">the writer's;</text><text x="428.0" y="514.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">replicas follow redo</text><rect x="516" y="484" width="160" height="40" rx="4" fill="#ecebe7"/><text x="596.0" y="501.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">written by the writer,</text><text x="596.0" y="514.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">kept by storage</text><text x="710" y="508.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">one</text><g transform="translate(20 551) scale(0.5)"><rect x="0" y="0" width="40" height="40" rx="4" fill="#ecebe7"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="46" y="565" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">in one node</text><g transform="translate(137.2 551) scale(0.5)"><rect x="0" y="0" width="40" height="40" rx="4" fill="#2f6fd6" fill-opacity="0.12"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="163.2" y="565" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">split: each slice has one owner</text><g transform="translate(358.4 551) scale(0.5)"><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="4" fill="#ffffff" stroke="#2f6fd6" stroke-width="1.5"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="384.4" y="565" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one per node, kept coherent or merged</text><g transform="translate(610.8 551) scale(0.5)"><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="4" fill="#ecebe7" stroke="#6b6a66" stroke-width="1.25" stroke-dasharray="4 3"/><text x="20.0" y="24.0" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d"></text></g><text x="636.8" y="565" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one shared stream</text></svg>
