<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 310" role="img" aria-label="Two nodes run SQL over the whole database and send key-value reads and writes across the cut to the owner of each key range; each range is copied to three machines" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="an-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Anatomy of a cut: range owners</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Two nodes, two key ranges. Every node can serve any query; every row has one owner.</text><rect x="40" y="76" width="200" height="52" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="140.0" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Node 1</text><text x="140.0" y="116" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">SQL over the whole database</text><rect x="280" y="76" width="200" height="52" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Node 2</text><text x="380.0" y="116" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">SQL over the whole database</text><line x1="24" y1="162" x2="496" y2="162" stroke="#2f6fd6" stroke-width="2.5"/><line x1="24" y1="170" x2="496" y2="170" stroke="#c25e00" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M140.0 128L140.0 206" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#an-ar)"/><path d="M140.0 128L380.0 206" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#an-ar)"/><path d="M380.0 128L140.0 206" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#an-ar)"/><path d="M380.0 128L380.0 206" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#an-ar)"/><rect x="50" y="218" width="200" height="72" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.25"/><rect x="45" y="213" width="200" height="72" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.5"/><rect x="40" y="208" width="200" height="72" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="140.0" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Owner of keys a–m</text><text x="140.0" y="249" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">locks for its range,</text><text x="140.0" y="264" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">access methods down to disk</text><rect x="290" y="218" width="200" height="72" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.25"/><rect x="285" y="213" width="200" height="72" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="1.25" stroke-opacity="0.5"/><rect x="280" y="208" width="200" height="72" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="380.0" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Owner of keys n–z</text><text x="380.0" y="249" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">locks for its range,</text><text x="380.0" y="264" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">access methods down to disk</text><text x="528" y="92" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Above the cut</text><text x="528" y="108" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Each node runs its own copy</text><text x="528" y="122" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">and sees every row.</text><text x="528" y="166" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">At the cut</text><text x="528" y="182" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Key-value reads and writes</text><text x="528" y="196" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">cross here, nothing else.</text><text x="528" y="238" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Below the cut</text><text x="528" y="254" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Each range has one owner, and</text><text x="528" y="268" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Raft copies its writes to two</text><text x="528" y="282" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">more machines.</text></svg>
