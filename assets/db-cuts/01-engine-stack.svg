<svg xmlns="http://www.w3.org/2000/svg" width="830" height="476" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 830 476" role="img" aria-label="A database engine: SQL over access methods, which feed two side-by-side paths to disk: the buffer pool reads and writes data files, and the log, holding redo and/or undo records, is flushed to log files at commit. Concurrency control runs beside the stack, and the joints cut it into the same rows: commit and snapshots at SQL, row and key locks and MVCC versions at the access methods, page latches and the log latch at the buffer pool and log, and, rarely, conditional page writes at the disk. Dashed lines mark the joints and what crosses each." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">One engine and its joints</text><text x="20" y="48" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Reads go through the buffer pool. Writes also append to the log. Each dashed line is a joint, labeled with what crosses it.</text><text x="20" y="65" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Concurrency control works at every layer: locks guard data for a whole transaction, latches guard memory for a moment.</text><rect x="20" y="84" width="130" height="372" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="85" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Concurrency control</text><text x="85" y="155" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">commit,</text><text x="85" y="169" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">snapshots</text><text x="85" y="231" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">row and key locks,</text><text x="85" y="245" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">MVCC versions</text><text x="85" y="323" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">page latches,</text><text x="85" y="337" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1f1e1d">log latch</text><text x="85" y="429" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">rare: conditional</text><text x="85" y="443" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">page writes</text><rect x="190" y="136" width="280" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">SQL</text><text x="330" y="171" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">parse, plan, execute</text><rect x="190" y="212" width="280" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="330" y="231" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Access methods</text><text x="330" y="247" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">heaps, B-trees, LSM trees</text><rect x="190" y="304" width="130" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="255" y="323" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Buffer pool</text><text x="255" y="339" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">hot pages in RAM</text><rect x="370" y="304" width="100" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="420" y="323" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Log</text><text x="420" y="339" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">redo and/or undo</text><rect x="190" y="408" width="280" height="48" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="330" y="427" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Disk</text><text x="255" y="445" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">data files</text><text x="420" y="445" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">log files</text><line x1="255" y1="256" x2="255" y2="302" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><line x1="420" y1="256" x2="420" y2="302" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><line x1="320" y1="326" x2="368" y2="326" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)" stroke-dasharray="3 2"/><text x="345" y="342" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">flush first</text><line x1="225" y1="406" x2="225" y2="350" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="219" y="368" text-anchor="end" font-size="10" font-weight="400" fill="#6b6a66">read on miss</text><line x1="290" y1="348" x2="290" y2="406" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="296" y="368" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">write back</text><line x1="420" y1="348" x2="420" y2="406" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="426" y="368" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">at commit</text><line x1="20" y1="120" x2="478" y2="120" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="118" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">SQL statements, or query fragments</text><text x="500" y="133" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Routed shards (Vitess, Citus); deterministic (Calvin)</text><line x1="20" y1="196" x2="478" y2="196" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="194" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Rows and keys</text><text x="500" y="209" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Range owners, unbundled (DSQL); binlog or Raft logs</text><line x1="20" y1="280" x2="478" y2="280" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="278" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Log records and pages</text><text x="500" y="293" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Rare: remote memory over RDMA, as in FaRM and NAM-DB</text><line x1="20" y1="382" x2="478" y2="382" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="380" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Blocks of both files</text><text x="500" y="395" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">RDS Multi-AZ; Oracle RAC, whose buffer pools also trade pages</text><text x="500" y="416" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Or: redo records down, pages up</text><text x="500" y="431" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora, Neon, Hyperscale: storage builds pages from the log</text></svg>
