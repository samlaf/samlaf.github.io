<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 480" role="img" aria-label="A database engine as a stack: SQL, access methods, buffer pool, log, disk, with concurrency control beside them and what crosses each interface" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">One engine, ordered by the data path</text><text x="20" y="48" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Every interface is a place to cut. What crosses it is what each remote call carries.</text><rect x="150" y="112" width="190" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="245.0" y="131" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">SQL</text><text x="245.0" y="147" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">parse, plan, execute</text><rect x="150" y="188" width="190" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="245.0" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Access methods</text><text x="245.0" y="223" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">heaps, B-trees, LSM trees</text><rect x="150" y="264" width="190" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="245.0" y="283" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Buffer pool</text><text x="245.0" y="299" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">hot pages in RAM</text><rect x="150" y="340" width="190" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="245.0" y="359" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Log</text><text x="245.0" y="375" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">redo records; a commit flushes it</text><rect x="150" y="416" width="190" height="44" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="245.0" y="435" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Disk</text><text x="245.0" y="451" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">blocks of log and data files</text><rect x="20" y="112" width="106" height="196" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="73" y="196.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Concurrency</text><text x="73" y="211.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">control</text><text x="73" y="230.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">locks, MVCC,</text><text x="73" y="244.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">commit</text><line x1="126" y1="134.0" x2="150" y2="134.0" stroke="#b8b5ae" stroke-width="1.25"/><line x1="126" y1="210.0" x2="150" y2="210.0" stroke="#b8b5ae" stroke-width="1.25"/><line x1="126" y1="286.0" x2="150" y2="286.0" stroke="#b8b5ae" stroke-width="1.25"/><line x1="142" y1="96" x2="358" y2="96" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="368" y="94" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">SQL statements, or query fragments</text><text x="368" y="109" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Sharding, routers, shared nothing</text><line x1="142" y1="172.0" x2="358" y2="172.0" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="368" y="170.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Rows and keys</text><text x="368" y="185.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Range owners, DSQL; logical logs such as the binlog or Raft</text><line x1="142" y1="248.0" x2="358" y2="248.0" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="368" y="246.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Pages</text><text x="368" y="261.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Rare: remote memory over RDMA. Shared disk keeps buffer pools coherent</text><line x1="142" y1="324.0" x2="358" y2="324.0" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="368" y="322.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Redo records down, pages up</text><text x="368" y="337.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora, Neon, Hyperscale; physical log shipping such as WAL</text><line x1="142" y1="400.0" x2="358" y2="400.0" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="368" y="398.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Blocks</text><text x="368" y="413.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">RDS Multi-AZ, shared-disk volumes</text></svg>
