<svg xmlns="http://www.w3.org/2000/svg" width="790" height="452" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 790 452" role="img" aria-label="A database engine: SQL over access methods, which feed two side-by-side paths to disk: the log, holding redo and/or undo records, is flushed to log files at commit, and the buffer pool reads and writes data files. Concurrency control sits beside them and touches SQL, the access methods, and the log. Dashed lines mark the joints and what crosses each." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">One engine and its joints</text><text x="20" y="48" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Reads go through the buffer pool. Writes also append to the log. Each dashed line is a joint, labeled with what crosses it.</text><rect x="150" y="112" width="280" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="290.0" y="131" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">SQL</text><text x="290.0" y="147" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">parse, plan, execute</text><rect x="150" y="188" width="280" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="290.0" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Access methods</text><text x="290.0" y="223" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">heaps, B-trees, LSM trees</text><rect x="150" y="280" width="100" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="200.0" y="299" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Log</text><text x="200.0" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">redo and/or undo</text><rect x="300" y="280" width="130" height="44" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="365.0" y="299" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Buffer pool</text><text x="365.0" y="315" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">hot pages in RAM</text><rect x="150" y="384" width="280" height="48" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="290" y="403" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Disk</text><text x="200" y="421" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">log files</text><text x="365" y="421" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">data files</text><line x1="200" y1="232" x2="200" y2="278" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><line x1="365" y1="232" x2="365" y2="278" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><line x1="300" y1="302" x2="252" y2="302" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)" stroke-dasharray="3 2"/><text x="275" y="318" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">flush first</text><line x1="200" y1="324" x2="200" y2="382" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="194" y="344" text-anchor="end" font-size="10" font-weight="400" fill="#6b6a66">at commit</text><line x1="330" y1="382" x2="330" y2="326" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="324" y="344" text-anchor="end" font-size="10" font-weight="400" fill="#6b6a66">read on miss</text><line x1="375" y1="324" x2="375" y2="382" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#es-arrow)"/><text x="381" y="344" text-anchor="start" font-size="10" font-weight="400" fill="#6b6a66">write back</text><rect x="20" y="112" width="106" height="212" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 3"/><text x="73" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Concurrency</text><text x="73" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">control</text><text x="73" y="238" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">locks, MVCC,</text><text x="73" y="252" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">commit</text><line x1="126" y1="134" x2="150" y2="134" stroke="#b8b5ae" stroke-width="1.25"/><line x1="126" y1="210" x2="150" y2="210" stroke="#b8b5ae" stroke-width="1.25"/><line x1="126" y1="302" x2="150" y2="302" stroke="#b8b5ae" stroke-width="1.25"/><line x1="142" y1="96" x2="438" y2="96" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="460" y="94" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">SQL statements, or query fragments</text><text x="460" y="109" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Routed shards (Vitess, Citus); deterministic (Calvin)</text><line x1="142" y1="172" x2="438" y2="172" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="460" y="170" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Rows and keys</text><text x="460" y="185" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Range owners, unbundled (DSQL); binlog or Raft logs</text><line x1="142" y1="256" x2="438" y2="256" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="460" y="254" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Log records and pages</text><text x="460" y="269" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Rare: remote memory over RDMA, as in NAM-DB and Sherman</text><line x1="142" y1="358" x2="438" y2="358" stroke="#2f6fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="460" y="356" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Blocks of both files</text><text x="460" y="371" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">RDS Multi-AZ; Oracle RAC, whose buffer pools also trade pages</text><text x="460" y="392" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f1e1d">Or: redo records down, pages up</text><text x="460" y="407" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora, Neon, Hyperscale: storage builds pages from the log</text></svg>
