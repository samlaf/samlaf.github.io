<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 800 480" role="img" aria-label="Two panels. Left, a shared disk: three nodes each run SQL and a buffer pool, and send page requests by address to one shared storage, which splits the data into segments that no node sees. Right, a shared key-value store: three nodes run SQL and keep a map of which node owns each key range, so node 1 sends its write for key m to the range i to q, and node 3 sends its read for key c to the range a to h." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="hs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">The interface may hide the shards below it, or show them</text><text x="20" y="48" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Every design below the blue line is sharded under the hood. What differs is whether nodes see the shards.</text><line x1="400" y1="80" x2="400" y2="460" stroke="#e6e4df" stroke-width="1"/><text x="200" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Hidden: shared disk</text><text x="200" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Oracle RAC, Aurora</text><rect x="35" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="80" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 1</text><rect x="45" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="80" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="45" y="194" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="80" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="155" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="200" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 2</text><rect x="165" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="200" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="165" y="194" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="200" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Buffer pool</text><rect x="275" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="320" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 3</text><rect x="285" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="320" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><rect x="285" y="194" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="320" y="210" text-anchor="middle" font-size="10" font-weight="400" fill="#1f1e1d">Buffer pool</text><line x1="20" y1="264" x2="380" y2="264" stroke="#2f6fd6" stroke-width="2.5"/><text x="140" y="280" text-anchor="middle" font-size="10" font-weight="400" fill="#2f6fd6">pages, by address</text><text x="200" y="428" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Storage splits the data into segments on its own.</text><text x="200" y="444" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">No node knows which segment holds a page.</text><text x="600" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f1e1d">Shown: shared key-value store</text><text x="600" y="117" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">CockroachDB, Spanner</text><rect x="435" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="480" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 1</text><rect x="445" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="480" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="480" y="212" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">range map</text><rect x="555" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 2</text><rect x="565" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="600" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="600" y="212" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">range map</text><rect x="675" y="136" width="90" height="96" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="720" y="153" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 3</text><rect x="685" y="162" width="70" height="24" rx="4" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="720" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">SQL</text><text x="720" y="212" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">range map</text><line x1="420" y1="264" x2="780" y2="264" stroke="#2f6fd6" stroke-width="2.5"/><text x="710" y="280" text-anchor="middle" font-size="10" font-weight="400" fill="#2f6fd6">KV reads and writes, by key</text><text x="600" y="428" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">Each node knows which range owns a key,</text><text x="600" y="444" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">and sends the request to that range.</text><rect x="35" y="318" width="330" height="82" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="200" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Shared storage</text><text x="200" y="350" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">one address space</text><rect x="55" y="360" width="90" height="28" rx="3" fill="#ffffff" fill-opacity="0.6" stroke="#b8b5ae" stroke-width="1"/><text x="100" y="378" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">segment 1</text><rect x="155" y="360" width="90" height="28" rx="3" fill="#ffffff" fill-opacity="0.6" stroke="#b8b5ae" stroke-width="1"/><text x="200" y="378" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">segment 2</text><rect x="255" y="360" width="90" height="28" rx="3" fill="#ffffff" fill-opacity="0.6" stroke="#b8b5ae" stroke-width="1"/><text x="300" y="378" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b6a66">segment 3</text><line x1="80" y1="232" x2="80" y2="314" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#hs-arrow)"/><line x1="200" y1="232" x2="200" y2="314" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#hs-arrow)"/><line x1="320" y1="232" x2="320" y2="314" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#hs-arrow)"/><rect x="435" y="318" width="90" height="52" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="480" y="339" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Range a–h</text><text x="480" y="355" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">on node 1</text><rect x="555" y="318" width="90" height="52" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="600" y="339" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Range i–q</text><text x="600" y="355" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">on node 2</text><rect x="675" y="318" width="90" height="52" rx="4" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"/><text x="720" y="339" text-anchor="middle" font-size="11" font-weight="600" fill="#1f1e1d">Range r–z</text><text x="720" y="355" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">on node 3</text><line x1="445" y1="232" x2="560" y2="314" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#hs-arrow)"/><line x1="685" y1="232" x2="450" y2="314" stroke="#2f6fd6" stroke-width="1.5" marker-end="url(#hs-arrow)"/><text x="600" y="392" text-anchor="middle" font-size="10" font-weight="400" fill="#6b6a66">node 1 writes key m; node 3 reads key c</text></svg>