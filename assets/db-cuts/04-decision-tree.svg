<svg xmlns="http://www.w3.org/2000/svg" width="760" height="592" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 592" role="img" aria-label="A decision tree. The split point picks the family. First: is each write ordered before it is replicated? If not, replicas settle writes later, as in Dynamo, Cassandra, and CRDTs; they replicate before they order, and this post leaves them aside. If so: how many nodes may write? With one writer, the writer decides, inside itself, at no joint; shards, if any, stay hidden, and replication may come before or after the split. Aurora and Neon run order, split, replicate; read replicas run order, replicate. With many writers, the locks, cache, and log must be split or kept coherent. Then: which nodes decide? If the data owners decide, they order at the split, in each slice, and each slice replicates itself; shards show to whoever coordinates commits, the application or the engine. Vitess, CockroachDB, and FaRM run split, order, replicate. If something else decides, it orders at the split on other nodes, or above it; the data shards stay hidden, the deciders coordinate, and replication may come before the split. Calvin and DSQL run order, replicate, split; Oracle RAC runs order, split, replicate." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">Three questions fix the sequence</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">The split point picks the family. Three questions then fix the sequence of split, order, and</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">replicate.</text><rect x="169.0" y="96" width="300" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="319.0" y="116.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Is each write ordered before it is replicated?</text><path d="M319.0 128V160" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="325.0" y="146" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">yes</text><path d="M469.0 112H509.0" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="475.0" y="106" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">no</text><rect x="509.0" y="82" width="231.0" height="60" rx="6" fill="#ecebe7"/><text x="521.0" y="99" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Replicas settle writes later.</text><text x="521.0" y="116" text-anchor="start" font-size="11.5" font-weight="600" opacity="0.6"><tspan fill="#c25e00">replicate</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#1f1e1d" dx="5">order</tspan></text><text x="521.0" y="133" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Dynamo, Cassandra, CRDTs: out of scope</text><rect x="209.0" y="160" width="220" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="319.0" y="180.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">How many nodes may write?</text><path d="M319.0 192V210H136.0V364" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M319.0 210H502.0V234" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="142.0" y="230" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">one</text><text x="508.0" y="226" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">many</text><rect x="372.0" y="234" width="260" height="38" rx="4" fill="#ecebe7"/><text x="502.0" y="249" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">Split the locks, cache, and log,</text><text x="502.0" y="263" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66">or keep them coherent across nodes</text><path d="M502.0 272V286" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><rect x="392.0" y="286" width="220" height="32" rx="4" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="502.0" y="306.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Which nodes decide?</text><path d="M502.0 318V334H380.0V364" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><path d="M502.0 334H624.0V364" fill="none" stroke="#b8b5ae" stroke-width="1.5"/><text x="386.0" y="352" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the data owners</text><text x="630.0" y="352" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">something else</text><rect x="20" y="364" width="232" height="204" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="32" y="386" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">The one writer decides</text><text x="32" y="406" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders inside the writer, at no joint.</text><text x="32" y="420" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Shards, if any, stay hidden.</text><text x="32" y="434" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Replication may come before</text><text x="32" y="448" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">or after the split.</text><line x1="32" y1="482" x2="240" y2="482" stroke="#ecebe7" stroke-width="1.5"/><text x="32" y="502" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Aurora, Neon</text><text x="32" y="518" text-anchor="start" font-size="11.5" font-weight="600" opacity="1"><tspan fill="#1f1e1d">order</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#2f6fd6" dx="5">split</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#c25e00" dx="5">replicate</tspan></text><text x="32" y="538" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Read replicas</text><text x="32" y="554" text-anchor="start" font-size="11.5" font-weight="600" opacity="1"><tspan fill="#1f1e1d">order</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#c25e00" dx="5">replicate</tspan></text><rect x="264" y="364" width="232" height="204" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="276" y="386" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">The data owners decide</text><text x="276" y="406" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders at the split, in each slice.</text><text x="276" y="420" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Each slice replicates itself.</text><text x="276" y="434" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Shards show to whoever coordinates</text><text x="276" y="448" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">commits: the app, or the engine.</text><line x1="276" y1="482" x2="484" y2="482" stroke="#ecebe7" stroke-width="1.5"/><text x="276" y="502" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Vitess, CockroachDB, FaRM</text><text x="276" y="518" text-anchor="start" font-size="11.5" font-weight="600" opacity="1"><tspan fill="#2f6fd6">split</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#1f1e1d" dx="5">order</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#c25e00" dx="5">replicate</tspan></text><rect x="508" y="364" width="232" height="204" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25"/><text x="520" y="386" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f1e1d">Something else decides</text><text x="520" y="406" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Orders at the split on other nodes,</text><text x="520" y="420" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">or above it.</text><text x="520" y="434" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Data shards stay hidden;</text><text x="520" y="448" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">the deciders coordinate.</text><text x="520" y="462" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Replication may come before the split.</text><line x1="520" y1="482" x2="728" y2="482" stroke="#ecebe7" stroke-width="1.5"/><text x="520" y="502" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Calvin, DSQL</text><text x="520" y="518" text-anchor="start" font-size="11.5" font-weight="600" opacity="1"><tspan fill="#1f1e1d">order</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#c25e00" dx="5">replicate</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#2f6fd6" dx="5">split</tspan></text><text x="520" y="538" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">Oracle RAC</text><text x="520" y="554" text-anchor="start" font-size="11.5" font-weight="600" opacity="1"><tspan fill="#1f1e1d">order</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#2f6fd6" dx="5">split</tspan><tspan fill="#6b6a66" font-weight="400" dx="5">→</tspan><tspan fill="#c25e00" dx="5">replicate</tspan></text></svg>
