<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 462" role="img" aria-label="Two columns. Replicate copies the data. It buys durability, availability, and read scaling, and it puts consistency at risk, because a copy can be stale. Consistency is kept by read routes: ask the node that decides writes, or wait for the copy to catch up. Read routes sit at no joint, so they are outside this post. Split shards the data. It buys write scaling and data size, and a failure stays in one slice. It puts isolation at risk, because a transaction can span slices. Isolation is kept by validation, which checks each item's conflicts in one place. Where that place sits decides whether splitting still scales writes." font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-size="15" font-weight="600" fill="#1f1e1d">What each choice buys, and what it puts at risk</text><text x="20" y="47" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Replication and splitting each buy something, and each puts a promise to the application at risk.</text><text x="20" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b6a66">Validation keeps one of those promises. Read routes keep the other, at no joint.</text><defs><marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs><rect x="60.0" y="134" width="280" height="52" rx="6" fill="#ecebe7"/><rect x="60.0" y="92" width="280" height="48" rx="6" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="200.0" y="113" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1d">Replicate</text><text x="200.0" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">copies the data</text><text x="200.0" y="158" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buys durability, availability,</text><text x="200.0" y="173" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">and read scaling</text><rect x="420.0" y="134" width="280" height="52" rx="6" fill="#ecebe7"/><rect x="420.0" y="92" width="280" height="48" rx="6" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="560.0" y="113" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1d">Split</text><text x="560.0" y="130" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">shards the data</text><text x="560.0" y="158" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">Buys write scaling and data size;</text><text x="560.0" y="173" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">a failure stays in one slice</text><path d="M200 186V244" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#ar-dim)"/><text x="208" y="220.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">puts at risk</text><rect x="60.0" y="246" width="280" height="52" rx="6" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="200.0" y="267" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1d">Consistency</text><text x="200.0" y="285" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">a copy can be stale</text><path d="M200 354V300" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#ar-dim)"/><text x="208" y="330.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">kept by</text><path d="M560 186V244" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#ar-dim)"/><text x="568" y="220.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">puts at risk</text><rect x="420.0" y="246" width="280" height="52" rx="6" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="560.0" y="267" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1d">Isolation</text><text x="560.0" y="285" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">a transaction can span slices</text><path d="M560 354V300" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#ar-dim)"/><text x="568" y="330.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#6b6a66">kept by</text><rect x="60.0" y="354" width="280" height="82" rx="6" fill="#ffffff" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="5 3"/><text x="200.0" y="375" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6b6a66">Read routes</text><text x="200.0" y="393" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">ask the node that decides writes,</text><text x="200.0" y="408" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">or wait for the copy to catch up</text><text x="200.0" y="423" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">no joint: outside this post</text><rect x="420.0" y="354" width="280" height="82" rx="6" fill="#ffffff" stroke="#1f1e1d" stroke-width="1.25"/><text x="560.0" y="375" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1d">Validate</text><text x="560.0" y="393" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">checks each item's conflicts</text><text x="560.0" y="408" text-anchor="middle" font-size="11" font-weight="400" fill="#1f1e1d">in one place</text><text x="560.0" y="423" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6a66">at the validation joint</text><path d="M700.0 395H728.0V160H702.0" fill="none" stroke="#6b6a66" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-dim)"/><text x="742.0" y="277.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b6a66" transform="rotate(90 742.0 277.5)">sets whether splitting scales writes</text></svg>
