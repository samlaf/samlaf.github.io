<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="798" viewBox="0 0 1140 798" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Implication diagram of consistency models in four bands. Linearizable implies strict serializable's single-operation case; sequential pairs with strong session serializable. Serializable and repeatable read sit in the total-order-only band. Causal, PRAM, session guarantees, snapshot isolation, monotonic atomic view, cursor stability, read committed and read uncommitted sit in the band with no single agreed total order.">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6a66"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="600" fill="#1f1e1d" text-anchor="start">Consistency models as implications</text>
<text x="20" y="54" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">An arrow points to the stronger model. Bands give the ordering constraint on a total order. Colors show availability under partition.</text>
<text x="210" y="84" font-size="14" font-weight="600" fill="#1f1e1d" text-anchor="middle">Single operation</text>
<text x="800" y="84" font-size="14" font-weight="600" fill="#1f1e1d" text-anchor="middle">Transactions</text>
<rect x="20" y="96" width="1100" height="100" rx="8" fill="none" stroke="#b8b5ae" stroke-dasharray="4 4"/>
<text x="32" y="114" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">Total order + real time</text>
<rect x="20" y="206" width="1100" height="100" rx="8" fill="none" stroke="#b8b5ae" stroke-dasharray="4 4"/>
<text x="32" y="224" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">Total order + session order</text>
<rect x="20" y="316" width="1100" height="100" rx="8" fill="none" stroke="#b8b5ae" stroke-dasharray="4 4"/>
<text x="32" y="334" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">Total order only</text>
<rect x="20" y="426" width="1100" height="316" rx="8" fill="none" stroke="#b8b5ae" stroke-dasharray="4 4"/>
<text x="32" y="444" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="start">No single agreed total order</text>
<text x="270" y="372" font-size="12" font-weight="400" fill="#6b6a66" text-anchor="middle">(rarely named)</text>
