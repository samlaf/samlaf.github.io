<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 528" width="1120" height="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1120" height="528" fill="#fdfdfc"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a">Two bindings, four corners</text>
<text x="40" y="64" font-size="12.5" fill="#64748b">Binding the name to a route joins designate and reach. Binding it to a permission joins designate and decide. The two are independent.</text>

<!-- column headers -->
<rect x="240" y="88" width="410" height="84" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="256" y="114" font-size="15" font-weight="700" fill="#0f172a">Global name: reach is separate</text>
<text x="256" y="136" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">path, URL, IP address</text>
<text x="256" y="158" font-size="12" fill="#64748b" font-style="italic">Can be guessed, listed or leaked, so it can arrive from anywhere.</text>
<rect x="670" y="88" width="410" height="84" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="686" y="114" font-size="15" font-weight="700" fill="#0f172a">Local name: the name is the route</text>
<text x="686" y="136" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FD index, C-list slot, heap pointer</text>
<text x="686" y="158" font-size="12" fill="#64748b" font-style="italic">Arrives only over a channel already held.</text>

<!-- row headers -->
<rect x="40" y="188" width="184" height="150" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="56" y="216" font-size="15" font-weight="700" fill="#0f172a">Authority</text>
<text x="56" y="236" font-size="15" font-weight="700" fill="#0f172a">checked separately</text>
<text x="56" y="260" font-size="12" fill="#64748b" font-style="italic">designate and decide</text>
<text x="56" y="278" font-size="12" fill="#64748b" font-style="italic">stay apart</text>
<rect x="40" y="354" width="184" height="150" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="56" y="382" font-size="15" font-weight="700" fill="#0f172a">Name bound</text>
<text x="56" y="402" font-size="15" font-weight="700" fill="#0f172a">to authority</text>
<text x="56" y="426" font-size="12" fill="#64748b" font-style="italic">designate and decide</text>
<text x="56" y="444" font-size="12" fill="#64748b" font-style="italic">are one</text>

<!-- top left -->
<rect x="240" y="188" width="410" height="150" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="256" y="216" font-size="15" font-weight="700" fill="#0f172a">ACLs and keys</text>
<text x="256" y="238" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pathname + ACL · OAuth (URL + token) · SPKI</text>
<text x="256" y="268" font-size="12.5" fill="#334155">The name travels apart from the authority.</text>
<text x="256" y="290" font-size="12.5" fill="#334155">Property D splits them: an ACL's authority is ambient,</text>
<text x="256" y="310" font-size="12.5" fill="#334155">and a key must be selected.</text>

<!-- top right -->
<rect x="670" y="188" width="410" height="150" rx="8" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="686" y="216" font-size="15" font-weight="700" fill="#0f172a">Unforgeable references, ambient decision</text>
<text x="686" y="238" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Java reference + SecurityManager</text>
<text x="686" y="268" font-size="12.5" fill="#334155">References cannot be forged, but stack inspection</text>
<text x="686" y="290" font-size="12.5" fill="#334155">decides by the caller's principal.</text>
<text x="686" y="312" font-size="12.5" fill="#a55f22">Joe-E removes that, and the mutable statics.</text>

<!-- bottom left -->
<rect x="240" y="354" width="410" height="150" rx="8" fill="#f9eee2" stroke="#c2793a" stroke-width="1.2"/>
<text x="256" y="382" font-size="15" font-weight="700" fill="#0f172a">Bound name, open channel</text>
<text x="256" y="404" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">share link · presigned S3 URL · Waterken</text>
<text x="256" y="434" font-size="12.5" fill="#334155">The authority is bound in the string, so Property A</text>
<text x="256" y="456" font-size="12.5" fill="#334155">holds. But the string can travel to anyone:</text>
<text x="256" y="478" font-size="12.5" fill="#a55f22">Property F fails.</text>

<!-- bottom right -->
<rect x="670" y="354" width="410" height="150" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.6"/>
<text x="686" y="382" font-size="15" font-weight="700" fill="#0f172a">Object capabilities</text>
<text x="686" y="404" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FD under Capsicum · WASI handle · CHERI</text>
<text x="686" y="434" font-size="12.5" fill="#334155">The authority is bound in the table entry the name</text>
<text x="686" y="456" font-size="12.5" fill="#334155">indexes. Designate, reach and decide are one act.</text>
<text x="686" y="478" font-size="12.5" fill="#0f5f6b">A, D and F hold, if no channel is global.</text>
</svg>
