<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 866" width="1560" height="866" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1560" height="866" fill="#fdfdfc"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Series roadmap</text>
<text x="36" y="64" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Where each article sits on the grid. Grey cells belong to the series on identity and applied cryptography. Designate and reach repeat at every layer of a name.</text>
<rect x="60" y="91" width="90" height="34" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="105" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">subject</text>
<line x1="150" y1="108" x2="1458" y2="108" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="1462" y="91" width="84" height="34" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="1504" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">object</text>
<circle cx="360" cy="108" r="5" fill="#334155"/>
<text x="360" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Designate</text>
<text x="360" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Which object does the name denote?</text>
<text x="360" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolve(namespace, name) → object | ⊥</text>
<circle cx="672" cy="108" r="5" fill="#334155"/>
<text x="672" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Reach</text>
<text x="672" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Can the request get there?</text>
<text x="672" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">route(source, address) → path | ⊥</text>
<circle cx="984" cy="108" r="5" fill="#334155"/>
<text x="984" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Authenticate</text>
<text x="984" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Who is asking?</text>
<text x="984" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify(claim, proof) → subject | ⊥</text>
<circle cx="1296" cy="108" r="5" fill="#334155"/>
<text x="1296" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Decide</text>
<text x="1296" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">May it do this?</text>
<text x="1296" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">f(s, a, r, ctx) → allow | deny</text>
<line x1="18" y1="220" x2="18" y2="726" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#aT)"/>
<text x="14" y="473" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 14 473)">time</text>
<text x="36" y="246" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Written</text>
<text x="36" y="266" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">the write path</text>
<rect x="210" y="216" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="246" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Where names come from</text>
<rect x="226" y="290" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="259" y="305" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 4</text>
<text x="496" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">also identity</text>
<rect x="522" y="216" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538" y="246" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Routes</text>
<text x="808" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="834" y="216" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="246" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Name → key bindings</text>
<text x="1120" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="1146" y="216" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="246" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Facts and rules</text>
<text x="1162" y="268" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the database: what is stored</text>
<rect x="1162" y="290" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="305" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 1</text>
<text x="36" y="366" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Carried</text>
<text x="36" y="386" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">a copy the holder brings</text>
<rect x="834" y="338" width="300" height="76" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="366" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Materialized identity</text>
<text x="850" y="388" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">certificate, session cookie, uid</text>
<text x="1120" y="402" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="1146" y="338" width="300" height="76" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="366" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Materialized decision</text>
<text x="1162" y="388" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">scoped token, logon token</text>
<rect x="1356" y="365" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="380" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 3</text>
<rect x="210" y="426" width="1236" height="60" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="462" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Several stages at once: a capability designates, reaches and decides</text>
<rect x="1356" y="445" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="460" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 4</text>
<text x="36" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Reference monitors</text>
<text x="36" y="548" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">absence (⊥) or judgment (no)</text>
<rect x="210" y="498" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="528" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Who controls the namespace</text>
<text x="226" y="550" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">what can resolve, and for whom</text>
<rect x="226" y="572" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="259" y="587" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<rect x="522" y="498" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="538" y="528" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">No way around</text>
<text x="538" y="550" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">every path passes an enforcer</text>
<rect x="538" y="572" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="571" y="587" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<text x="808" y="588" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">also crypto</text>
<rect x="834" y="498" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="528" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Custody</text>
<text x="1120" y="588" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">crypto series</text>
<rect x="1146" y="498" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="528" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">The PEP</text>
<text x="1162" y="550" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">accepts the carrier, or asks</text>
<rect x="1162" y="572" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="587" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<text x="36" y="650" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Looked up</text>
<text x="36" y="670" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">the read path, when needed</text>
<rect x="210" y="620" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="226" y="650" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Resolution</text>
<text x="496" y="710" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="522" y="620" width="300" height="110" rx="8" fill="#fdfdfc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="538" y="650" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Routing</text>
<rect x="834" y="620" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="650" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Proof of possession</text>
<text x="1120" y="710" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">crypto series</text>
<rect x="1146" y="620" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="650" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Access decision</text>
<text x="1162" y="672" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the PDP: a query against the view</text>
<rect x="1162" y="694" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="709" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 1</text>
<line x1="36" y1="750" x2="1446" y2="750" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="36" y="792" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Every cell</text>
<rect x="210" y="764" width="1236" height="60" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="800" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">The adversary: which attacker each cell has to hold against</text>
<rect x="1356" y="783" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="798" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Prologue</text>
</svg>
