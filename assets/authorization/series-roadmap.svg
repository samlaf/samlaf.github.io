<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 882" width="1560" height="882" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="1560" height="882" fill="#fdfdfc"/>
<text x="36" y="40" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Series roadmap</text>
<text x="36" y="64" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Where each article sits on the grid. Grey cells belong to the series on identity and applied cryptography. Designate and reach repeat at every layer of a name.</text>
<rect x="60" y="91" width="90" height="34" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="105" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">subject</text>
<line x1="150" y1="108" x2="1458" y2="108" stroke="#334155" stroke-width="1.6" marker-end="url(#aS)"/>
<rect x="1462" y="91" width="84" height="34" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="1504" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">object</text>
<circle cx="360" cy="108" r="5" fill="#334155"/>
<text x="360" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Designate</text>
<text x="360" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Which object does the name denote?</text>
<text x="360" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolve(namespace, name) → object | ⊥</text>
<circle cx="672" cy="108" r="5" fill="#334155"/>
<text x="672" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Reach</text>
<text x="672" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Can the request get there?</text>
<text x="672" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">route(source, address) → path | ⊥</text>
<circle cx="984" cy="108" r="5" fill="#334155"/>
<text x="984" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Authenticate</text>
<text x="984" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Who is asking?</text>
<text x="984" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify(claim, proof) → subject | ⊥</text>
<circle cx="1296" cy="108" r="5" fill="#334155"/>
<text x="1296" y="152" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Decide</text>
<text x="1296" y="173" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">May it do this?</text>
<text x="1296" y="194" font-size="12" font-weight="500" fill="#0f7d8c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">f(s, a, r, ctx) → allow | deny</text>
<text x="36" y="246" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Written</text>
<text x="36" y="266" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">the write path</text>
<text x="36" y="368" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Request</text>
<text x="36" y="388" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">the read path</text>
<text x="36" y="490" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Reference monitors</text>
<text x="36" y="510" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">absence (⊥) or judgment (no)</text>
<rect x="210" y="216" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="246" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Where names come from</text>
<rect x="226" y="290" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="259" y="305" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 4</text>
<text x="496" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">also identity</text>
<rect x="522" y="216" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538" y="246" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Routes</text>
<text x="808" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="834" y="216" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="246" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Name → key bindings</text>
<text x="1120" y="306" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="1146" y="216" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="246" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Facts and rules</text>
<text x="1162" y="268" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the database: what is stored</text>
<rect x="1162" y="290" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="305" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 1</text>
<rect x="210" y="338" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="226" y="368" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Resolution</text>
<text x="496" y="428" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="522" y="338" width="300" height="110" rx="8" fill="#fdfdfc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="538" y="368" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Delivery</text>
<rect x="834" y="338" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="368" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Proof of possession</text>
<text x="1120" y="428" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">crypto series</text>
<rect x="1146" y="338" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="368" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Access decision</text>
<text x="1162" y="390" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the PDP: a query against the view</text>
<rect x="1162" y="412" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="427" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 1</text>
<rect x="210" y="460" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="490" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Who controls the namespace</text>
<text x="226" y="512" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">what can resolve, and for whom</text>
<rect x="226" y="534" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="259" y="549" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<rect x="522" y="460" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="538" y="490" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">No way around</text>
<text x="538" y="512" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">every path passes an enforcer</text>
<rect x="538" y="534" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="571" y="549" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<text x="808" y="550" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">also crypto</text>
<rect x="834" y="460" width="300" height="110" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="490" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Custody</text>
<text x="1120" y="550" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">crypto series</text>
<rect x="1146" y="460" width="300" height="110" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="490" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">The PEP</text>
<text x="1162" y="512" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">applies the view's answer</text>
<rect x="1162" y="534" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1195" y="549" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 2</text>
<line x1="36" y1="590" x2="1446" y2="590" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="36" y="632" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Carriers</text>
<text x="36" y="652" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">one stage, or several</text>
<rect x="834" y="604" width="300" height="76" rx="8" fill="#f1f3f5" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="850" y="632" font-size="14.5" font-weight="700" fill="#64748b" text-anchor="start">Materialized identity</text>
<text x="850" y="654" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">session cookie, id_token, process uid</text>
<text x="1120" y="668" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end" font-style="italic">identity series</text>
<rect x="1146" y="604" width="300" height="76" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="1162" y="632" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Materialized decision</text>
<text x="1162" y="654" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">scoped token, logon token</text>
<rect x="1356" y="631" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="646" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 3</text>
<rect x="210" y="692" width="1236" height="60" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="728" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Several stages at once: a capability designates, reaches and decides</text>
<rect x="1356" y="711" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="726" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Part 4</text>
<line x1="36" y1="772" x2="1446" y2="772" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="36" y="814" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Every cell</text>
<rect x="210" y="786" width="1236" height="60" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="226" y="822" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">The adversary: which attacker each cell has to hold against</text>
<rect x="1356" y="805" width="66" height="22" rx="11" fill="#0f7d8c"/>
<text x="1389" y="820" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Prologue</text>
</svg>
