<text x="120" y="230" font-size="12.5" font-weight="700" fill="#0f7d8c" text-anchor="start" font-family="Menlo, ui-monospace, SFMono-Regular, Consolas, monospace">f</text>
<text x="120" y="246" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">the policy for this task</text>
<text x="40" y="286" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">request</text>
<text x="120" y="286" font-size="12.5" font-weight="700" fill="#0f7d8c" text-anchor="start" font-family="Menlo, ui-monospace, SFMono-Regular, Consolas, monospace">subject, action,</text>
