<text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">The lifetimes nest, and one check reads them all</text>
<text x="40" y="64" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">A request sits inside a task, and a task inside a session. The enforcer&#x27;s clock runs under all of them.</text>
<text x="40" y="174" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">session</text>
<text x="120" y="174" font-size="12.5" font-weight="700" fill="#0f7d8c" text-anchor="start" font-family="Menlo, ui-monospace, SFMono-Regular, Consolas, monospace">facts</text>
<text x="120" y="190" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">the history so far</text>
