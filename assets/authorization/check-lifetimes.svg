<text x="40" y="342" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">clock</text>
<text x="120" y="342" font-size="12.5" font-weight="700" fill="#0f7d8c" text-anchor="start" font-family="Menlo, ui-monospace, SFMono-Regular, Consolas, monospace">time</text>
<text x="120" y="358" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">the enforcer&#x27;s own</text>
