<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1120" height="540" fill="#fdfdfc"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a">Service chaining</text>
<text x="40" y="64" font-size="12.5" fill="#64748b">Alice asks Bob's backup service to back up a source. Bob calls Carol's copy service, which needs an input and an output.</text>

<text x="40" y="102" font-size="14" font-weight="700" fill="#0f172a">NBAC: whose credentials does Bob present to Carol?</text>

<!-- row 1 -->
<rect x="40" y="118" width="110" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="95" y="151" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text>
<line x1="150" y1="146" x2="246" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="198" y="138" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">names a source</text>
<rect x="250" y="118" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="325" y="151" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Bob's backup</text>
<line x1="400" y1="146" x2="596" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="498" y="138" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Bob's credentials</text>
<rect x="600" y="118" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="675" y="151" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Carol's copy</text>
<rect x="790" y="118" width="290" height="56" rx="8" fill="#fbecec" stroke="#b54848" stroke-width="1.2"/>
<text x="806" y="141" font-size="12.5" font-weight="700" fill="#8f2f2f">Confused deputy</text>
<text x="806" y="161" font-size="12" fill="#334155">Alice gets back data she may not read.</text>

<!-- row 2 -->
<rect x="40" y="194" width="110" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="95" y="227" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text>
<line x1="150" y1="222" x2="246" y2="222" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="198" y="214" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">names a source</text>
<rect x="250" y="194" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="325" y="227" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Bob's backup</text>
<line x1="400" y1="222" x2="596" y2="222" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="498" y="214" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Alice's credentials</text>
<rect x="600" y="194" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="675" y="227" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Carol's copy</text>
<rect x="790" y="194" width="290" height="56" rx="8" fill="#fbecec" stroke="#b54848" stroke-width="1.2"/>
<text x="806" y="217" font-size="12.5" font-weight="700" fill="#8f2f2f">Too much authority</text>
<text x="806" y="237" font-size="12" fill="#334155">Bob may do anything at Carol's that Alice may.</text>

<!-- row 3 -->
<rect x="40" y="270" width="110" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="95" y="303" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text>
<line x1="150" y1="298" x2="246" y2="298" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="198" y="290" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">names a source</text>
<rect x="250" y="270" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="325" y="303" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Bob's backup</text>
<line x1="400" y1="298" x2="596" y2="298" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="498" y="290" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">both sets</text>
<rect x="600" y="270" width="150" height="56" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="675" y="303" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Carol's copy</text>
<rect x="790" y="270" width="290" height="56" rx="8" fill="#fbecec" stroke="#b54848" stroke-width="1.2"/>
<text x="806" y="293" font-size="12.5" font-weight="700" fill="#8f2f2f">Provider chaining</text>
<text x="806" y="313" font-size="12" fill="#334155">Grants the union: worse than either.</text>

<line x1="40" y1="354" x2="1080" y2="354" stroke="#cbd5e1" stroke-width="1"/>

<text x="40" y="388" font-size="14" font-weight="700" fill="#0f172a">ZBAC: Bob passes on what he was handed</text>

<!-- row 4 -->
<rect x="40" y="404" width="110" height="76" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="95" y="447" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text>
<line x1="150" y1="442" x2="246" y2="442" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aS)"/>
<rect x="156" y="414" width="84" height="20" rx="10" fill="#e3f1f3" stroke="#0f7d8c"/>
<text x="198" y="428" font-size="11" fill="#0f5f6b" text-anchor="middle">read source</text>
<rect x="250" y="404" width="150" height="76" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="325" y="447" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Bob's backup</text>
<line x1="400" y1="442" x2="596" y2="442" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aS)"/>
<rect x="436" y="410" width="124" height="20" rx="10" fill="#e3f1f3" stroke="#0f7d8c"/>
<text x="498" y="424" font-size="11" fill="#0f5f6b" text-anchor="middle">in: read source</text>
<rect x="436" y="454" width="124" height="20" rx="10" fill="#e3f1f3" stroke="#0f7d8c"/>
<text x="498" y="468" font-size="11" fill="#0f5f6b" text-anchor="middle">out: write backup</text>
<rect x="600" y="404" width="150" height="76" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="675" y="447" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Carol's copy</text>
<rect x="790" y="404" width="290" height="76" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="806" y="430" font-size="12.5" font-weight="700" fill="#0f5f6b">Exactly what the job needs</text>
<text x="806" y="450" font-size="12" fill="#334155">No credentials change hands. Each handle</text>
<text x="806" y="468" font-size="12" fill="#334155">can be revoked when the job completes.</text>

<text x="40" y="516" font-size="12" fill="#64748b" font-style="italic">The output handle is Bob's own: it designates his backup store, and Alice never holds it.</text>
</svg>
