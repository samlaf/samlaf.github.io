<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7d8c"/></marker>
</defs>
<rect width="1120" height="560" fill="#fdfdfc"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a">Where the authority lives</text>
<text x="40" y="64" font-size="12.5" fill="#64748b">A key carries the authority with it. An object capability is an index into a table that only the enforcer can write.</text>

<!-- left panel: keys -->
<rect x="40" y="84" width="500" height="400" rx="10" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="60" y="114" font-size="15" font-weight="700" fill="#0f172a">Keys: the authority travels in the artifact</text>
<text x="60" y="134" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">presigned URL, share link, macaroon, SPKI certificate</text>

<rect x="64" y="200" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="80" y="222" font-size="14" font-weight="700" fill="#0f172a">Alice</text>
<rect x="80" y="231" width="118" height="20" rx="10" fill="#f9eee2" stroke="#c2793a"/>
<text x="139" y="245" font-size="11" fill="#a55f22" text-anchor="middle">token: read X</text>

<rect x="366" y="156" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="382" y="178" font-size="14" font-weight="700" fill="#0f172a">Bob</text>
<rect x="382" y="187" width="118" height="20" rx="10" fill="#f9eee2" stroke="#c2793a"/>
<text x="441" y="201" font-size="11" fill="#a55f22" text-anchor="middle">token: read X</text>

<rect x="366" y="244" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="382" y="266" font-size="14" font-weight="700" fill="#0f172a">Bob's contractor</text>
<rect x="382" y="275" width="118" height="20" rx="10" fill="#f9eee2" stroke="#c2793a"/>
<text x="441" y="289" font-size="11" fill="#a55f22" text-anchor="middle">token: read X</text>

<rect x="366" y="332" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="382" y="354" font-size="14" font-weight="700" fill="#0f172a">a paste site</text>
<rect x="382" y="363" width="118" height="20" rx="10" fill="#f9eee2" stroke="#c2793a"/>
<text x="441" y="377" font-size="11" fill="#a55f22" text-anchor="middle">token: read X</text>

<line x1="214" y1="222" x2="362" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<line x1="441" y1="216" x2="441" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<line x1="441" y1="304" x2="441" y2="328" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)" stroke-dasharray="4 3"/>
<text x="232" y="190" font-size="11.5" fill="#64748b" font-style="italic">copies the bytes</text>
<text x="432" y="320" font-size="11.5" fill="#64748b" font-style="italic" text-anchor="end">over any channel</text>

<text x="60" y="420" font-size="12.5" fill="#334155"><tspan font-weight="700">Pass:</tspan> copy the bytes, over any channel.</text>
<text x="60" y="442" font-size="12.5" fill="#334155"><tspan font-weight="700">Revoke:</tspan> reach every copy, or add a registry.</text>
<text x="60" y="464" font-size="12.5" fill="#8f2f2f"><tspan font-weight="700">Property F fails:</tspan> nothing limits where a copy goes.</text>

<!-- right panel: object capabilities -->
<rect x="580" y="84" width="500" height="400" rx="10" fill="#f4fafb" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="600" y="114" font-size="15" font-weight="700" fill="#0f172a">Object capabilities: the authority stays in a table</text>
<text x="600" y="134" font-size="11" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file descriptor, seL4 capability, heap reference</text>

<rect x="604" y="156" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="620" y="178" font-size="14" font-weight="700" fill="#0f172a">Alice</text>
<rect x="620" y="187" width="60" height="20" rx="10" fill="#eef2f6" stroke="#94a3b8"/>
<text x="650" y="201" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fd 3</text>

<rect x="906" y="156" width="150" height="60" rx="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
<text x="922" y="178" font-size="14" font-weight="700" fill="#0f172a">Bob</text>
<rect x="922" y="187" width="60" height="20" rx="10" fill="#eef2f6" stroke="#94a3b8"/>
<text x="952" y="201" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fd 7</text>

<text x="770" y="196" font-size="11.5" fill="#64748b" font-style="italic">each holds only an index</text>

<rect x="604" y="248" width="452" height="146" rx="8" fill="#e3f1f3" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="620" y="382" font-size="13" font-weight="700" fill="#0f172a">Enforcer: kernel, runtime or vat</text>
<rect x="620" y="262" width="180" height="74" rx="6" fill="#fff" stroke="#0f7d8c"/>
<text x="634" y="282" font-size="11.5" font-weight="700" fill="#334155">Alice's table</text>
<text x="634" y="308" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 → X, read</text>
<rect x="860" y="262" width="180" height="74" rx="6" fill="#fff" stroke="#0f7d8c"/>
<text x="874" y="282" font-size="11.5" font-weight="700" fill="#334155">Bob's table</text>
<text x="874" y="308" font-size="12" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">7 → X, read</text>
<line x1="802" y1="300" x2="856" y2="300" stroke="#0f7d8c" stroke-width="1.6" marker-end="url(#aT)"/>
<text x="829" y="292" font-size="11" fill="#0f7d8c" text-anchor="middle">writes</text>

<line x1="650" y1="208" x2="680" y2="260" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="952" y1="208" x2="930" y2="260" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="720" y1="216" x2="740" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#aS)"/>
<text x="748" y="240" font-size="11.5" fill="#64748b" font-style="italic">"pass fd 3 to Bob"</text>

<text x="600" y="420" font-size="12.5" fill="#334155"><tspan font-weight="700">Pass:</tspan> the enforcer writes a new entry, and can refuse.</text>
<text x="600" y="442" font-size="12.5" fill="#334155"><tspan font-weight="700">Revoke:</tspan> the enforcer deletes the entry.</text>
<text x="600" y="464" font-size="12.5" fill="#0f5f6b"><tspan font-weight="700">Property F holds:</tspan> Alice passes only over a channel she holds.</text>

<rect x="40" y="504" width="1040" height="36" rx="6" fill="#eef6f7" stroke="#0f7d8c" stroke-width="1.2"/>
<text x="560" y="527" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">A carried token is what a capability becomes when it has to leave the enforcer's table.</text>
</svg>
