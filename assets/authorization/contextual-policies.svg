<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" width="1560" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7d8c"/></marker></defs>
<rect width="1560" height="640" fill="#fdfdfc"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a">What moves when a check becomes contextual</text>
<text x="40" y="64" font-size="13" fill="#64748b">The same check. A stateful one also appends a row to a log that later checks read. Each arrow names the systems that make one part move.</text>
<text y="330" font-size="40" font-family="Menlo, ui-monospace, SFMono-Regular, Consolas, monospace" xml:space="preserve"><tspan x="81.7" fill="#0f7d8c" font-weight="700">f</tspan><tspan x="105.8" fill="#64748b" font-weight="400">(</tspan><tspan x="129.8" fill="#0f172a" font-weight="400">subject, action, resource</tspan><tspan x="731.8" fill="#64748b" font-weight="400">, </tspan><tspan x="780.0" fill="#0f7d8c" font-weight="700">context</tspan><tspan x="948.6" fill="#64748b" font-weight="400">) &#x2192; (</tspan><tspan x="1069.0" fill="#0f172a" font-weight="400">decision</tspan><tspan x="1261.6" fill="#64748b" font-weight="400">, </tspan><tspan x="1309.8" fill="#0f7d8c" font-weight="700">update</tspan><tspan x="1454.2" fill="#64748b" font-weight="400">)</tspan></text>
<path d="M129.8,296 q0,-10 10,-10 H420.8 q10,0 10,-10 q0,10 10,10 H721.8 q10,0 10,10" fill="none" stroke="#0f7d8c" stroke-width="1.5"/>
<rect x="36" y="118" width="320" height="104" rx="8" fill="#fff" stroke="#0f7d8c" stroke-width="1.3"/>
<text x="52" y="145" font-size="15" font-weight="700" fill="#0f7d8c">Per-task policy</text>
<text x="52" y="168" font-size="12.5" fill="#0f172a">the rules are written when a task starts,</text>
<text x="52" y="187" font-size="12.5" fill="#0f172a">from trusted input only</text>
<text x="52" y="206" font-size="12" font-weight="600" fill="#64748b">Conseca · org policy ∧ task policy</text>
<line x1="93.7" y1="290" x2="93.7" y2="226" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aT)"/>
<rect x="386" y="118" width="320" height="104" rx="8" fill="#fff" stroke="#0f7d8c" stroke-width="1.3"/>
<text x="402" y="145" font-size="15" font-weight="700" fill="#0f7d8c">Information flow control</text>
<text x="402" y="168" font-size="12.5" fill="#0f172a">each value carries where it came from,</text>
<text x="402" y="187" font-size="12.5" fill="#0f172a">so policy can judge an argument&#x27;s origin</text>
<text x="402" y="206" font-size="12" font-weight="600" fill="#64748b">CaMeL · the prompt-injection case, Part 4</text>
<line x1="430.8" y1="276" x2="430.8" y2="226" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aT)"/>
<rect x="736" y="118" width="320" height="104" rx="8" fill="#fff" stroke="#0f7d8c" stroke-width="1.3"/>
<text x="752" y="145" font-size="15" font-weight="700" fill="#0f7d8c">Temporal access control</text>
<text x="752" y="168" font-size="12.5" fill="#0f172a">the enforcer&#x27;s clock, as context:</text>
<text x="752" y="187" font-size="12.5" fill="#0f172a">expiry and windows move the answer</text>
<text x="752" y="206" font-size="12" font-weight="600" fill="#64748b">TRBAC · token expiry · Dogwood windows</text>
<line x1="864.3" y1="290" x2="864.3" y2="226" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aT)"/>
<rect x="736" y="432" width="320" height="104" rx="8" fill="#fff" stroke="#0f7d8c" stroke-width="1.3"/>
<text x="752" y="459" font-size="15" font-weight="700" fill="#0f7d8c">Attribute-based access control</text>
<text x="752" y="482" font-size="12.5" fill="#0f172a">more travels with each request:</text>
<text x="752" y="501" font-size="12.5" fill="#0f172a">device, network, risk score</text>
<text x="752" y="520" font-size="12" font-weight="600" fill="#64748b">ABAC · AuthZEN context · risk-adaptive</text>
<line x1="864.3" y1="344" x2="864.3" y2="428" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aT)"/>
<rect x="1222" y="432" width="320" height="104" rx="8" fill="#fff" stroke="#0f7d8c" stroke-width="1.3"/>
<text x="1238" y="459" font-size="15" font-weight="700" fill="#0f7d8c">History-based access control</text>
<text x="1238" y="482" font-size="12.5" fill="#0f172a">the check appends a row to the log;</text>
<text x="1238" y="501" font-size="12.5" fill="#0f172a">later checks query it</text>
<text x="1238" y="520" font-size="12" font-weight="600" fill="#64748b">Chinese Wall · Dogwood · Omnigent</text>
<line x1="1382.0" y1="344" x2="1382.0" y2="428" stroke="#0f7d8c" stroke-width="1.5" marker-end="url(#aT)"/>
<text x="780" y="612" font-size="12.5" fill="#64748b" text-anchor="middle">Agent systems move several of these at once, and one check reads them all.</text>
</svg>
