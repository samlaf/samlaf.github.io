<svg xmlns="http://www.w3.org/2000/svg" width="760" height="644" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 644" role="img" aria-label="Archetype map" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Any-node writes need coordination below SQL: a coherent cache or a commit check</text><text x="24" y="50" font-size="11.5" fill="#6b6a66">Rows: Ziegler et al.&#x27;s data-access archetypes. Columns: where nodes couple, top of the stack down.</text><g><text x="195" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Nowhere</text><text x="195" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">log shipping</text></g><g><text x="293" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Application</text><text x="293" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">sharding</text></g><g><text x="391" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">SQL or router</text><text x="391" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">shared nothing</text></g><g><text x="489" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">KV ranges</text><text x="489" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">range owners</text></g><g><text x="587" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Storage</text><text x="587" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">shared storage</text></g><g><text x="685" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Commit, log</text><text x="685" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">disaggregated</text></g><g><rect x="148" y="112" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="112" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="112" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="112" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="112" width="94" height="112" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><rect x="638" y="112" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="164" font-size="12" font-weight="600" fill="#1f1e1d">Single-Writer</text><text x="24" y="182" font-size="11.5" fill="#6b6a66">one writer total</text><text x="195" y="155" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Postgres</text><text x="195" y="172" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">MySQL</text><text x="195" y="189" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">RDS, all modes</text><text x="587" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Aurora</text><text x="587" y="155" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Neon</text><text x="587" y="172" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL Hyperscale</text><text x="587" y="189" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">AlloyDB</text><text x="587" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">PolarDB</text></g><g><rect x="148" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="232" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="284" font-size="12" font-weight="600" fill="#1f1e1d">Partitioned-Writer</text><text x="24" y="302" font-size="11.5" fill="#6b6a66">one per partition</text><text x="293" y="292" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">App shards</text><text x="391" y="267" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Citus</text><text x="391" y="284" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Vitess</text><text x="391" y="301" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Greenplum</text><text x="391" y="318" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Limitless</text><text x="489" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Spanner</text><text x="489" y="267" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">CockroachDB</text><text x="489" y="284" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">TiDB</text><text x="489" y="301" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">YugabyteDB</text><text x="489" y="318" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">DynamoDB</text><text x="489" y="335" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">FaRM</text></g><g><rect x="148" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="352" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="404" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="24" y="422" font-size="11.5" fill="#6b6a66">coherent caches</text><text x="587" y="387" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Oracle RAC</text><text x="587" y="404" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Db2 pureScale</text><text x="587" y="421" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Aurora MM</text><text x="587" y="438" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">ScaleStore</text></g><g><rect x="148" y="472" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="472" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="472" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="472" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="472" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="472" width="94" height="112" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><text x="24" y="524" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="24" y="542" font-size="11.5" fill="#6b6a66">no coherent cache</text><text x="587" y="524" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">NAM-DB</text><text x="587" y="541" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Sherman</text><text x="685" y="524" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Aurora DSQL</text><text x="685" y="541" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">FoundationDB</text></g><text x="24" y="614" font-size="11.5" fill="#6b6a66">Coherent caches pay with invalidation traffic and lock coordination.</text><text x="24" y="631" font-size="11.5" fill="#6b6a66">No-cache shared writers pay a storage round trip per read; DSQL and FoundationDB add commit-time aborts.</text></svg>