<svg xmlns="http://www.w3.org/2000/svg" width="760" height="674" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 674" role="img" aria-label="Archetype map" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Any-node writes need coordination below SQL: a coherent cache or a commit check</text><text x="24" y="50" font-size="11.5" fill="#6b6a66">Rows: Ziegler et al.&#x27;s data-access archetypes. Columns: where nodes couple, top of the stack down. Italic: what crosses between nodes.</text><g><text x="195" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Nowhere</text><text x="195" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">log shipping</text></g><g><text x="293" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Application</text><text x="293" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">sharding</text></g><g><text x="391" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">SQL or router</text><text x="391" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">shared nothing</text></g><g><text x="489" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">KV ranges</text><text x="489" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">range owners</text></g><g><text x="587" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Storage</text><text x="587" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">shared storage</text></g><g><text x="685" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1f1e1d">Commit</text><text x="685" y="96" text-anchor="middle" font-size="11.5" fill="#6b6a66">disaggregated</text></g><g><text x="195" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">nothing</text><text x="195" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">between writers</text><text x="293" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">queries to</text><text x="293" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">one shard</text><text x="391" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">fragments, rows,</text><text x="391" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">commit votes</text><text x="489" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">KV ops,</text><text x="489" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">write intents</text><text x="587" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">log records,</text><text x="587" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">pages, locks</text><text x="685" y="113" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">write sets,</text><text x="685" y="127" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a8984">commits</text></g><g><rect x="148" y="142" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="142" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="142" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="142" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="142" width="94" height="112" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><rect x="638" y="142" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="194" font-size="12" font-weight="600" fill="#1f1e1d">Single-Writer</text><text x="24" y="212" font-size="11.5" fill="#6b6a66">one writer total</text><text x="195" y="185" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Postgres</text><text x="195" y="202" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">MySQL</text><text x="195" y="219" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">RDS, all modes</text><text x="587" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Aurora</text><text x="587" y="185" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Neon</text><text x="587" y="202" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">SQL Hyperscale</text><text x="587" y="219" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">AlloyDB</text><text x="587" y="236" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">PolarDB</text></g><g><rect x="148" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="262" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="314" font-size="12" font-weight="600" fill="#1f1e1d">Partitioned-Writer</text><text x="24" y="332" font-size="11.5" fill="#6b6a66">one per partition</text><text x="293" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">App shards</text><text x="391" y="297" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Citus</text><text x="391" y="314" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Vitess</text><text x="391" y="331" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Greenplum</text><text x="391" y="348" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Limitless</text><text x="489" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Spanner</text><text x="489" y="297" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">CockroachDB</text><text x="489" y="314" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">TiDB</text><text x="489" y="331" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">YugabyteDB</text><text x="489" y="348" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">DynamoDB</text><text x="489" y="365" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">FaRM</text></g><g><rect x="148" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="382" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><text x="24" y="434" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="24" y="452" font-size="11.5" fill="#6b6a66">coherent caches</text><text x="587" y="417" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Oracle RAC</text><text x="587" y="434" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Db2 pureScale</text><text x="587" y="451" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Aurora MM</text><text x="587" y="468" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">ScaleStore</text></g><g><rect x="148" y="502" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="246" y="502" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="344" y="502" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="442" y="502" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="540" y="502" width="94" height="112" rx="6" fill="none" fill-opacity="1" stroke="#e2e0da" stroke-width="1"></rect><rect x="638" y="502" width="94" height="112" rx="6" fill="#2f6fd6" fill-opacity="0.1" stroke="#2f6fd6" stroke-width="2"></rect><text x="24" y="554" font-size="12" font-weight="600" fill="#1f1e1d">Shared-Writer</text><text x="24" y="572" font-size="11.5" fill="#6b6a66">no coherent cache</text><text x="587" y="554" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">NAM-DB</text><text x="587" y="571" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">Sherman</text><text x="685" y="554" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">Aurora DSQL</text><text x="685" y="571" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f1e1d">FoundationDB</text></g><text x="24" y="644" font-size="11.5" fill="#6b6a66">Coherent caches pay with invalidation traffic and lock coordination.</text><text x="24" y="661" font-size="11.5" fill="#6b6a66">No-cache shared writers pay a storage round trip per read; DSQL and FoundationDB add commit-time aborts.</text></svg>