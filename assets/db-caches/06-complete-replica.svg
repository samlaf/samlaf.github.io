<svg xmlns="http://www.w3.org/2000/svg" width="760" height="160" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 160" role="img" aria-label="A complete replica's two states: caught up and lagging, with flat database load in both" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="cr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">A complete replica serves older data instead</text><rect x="40" y="56" width="200" height="72" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="140" y="82" text-anchor="middle" font-weight="600" fill="#1f1e1d">Caught up</text><text x="140" y="101" text-anchor="middle" font-size="11.5" fill="#6b6a66">fresh views</text><text x="140" y="117" text-anchor="middle" font-size="11.5" fill="#6b6a66">flat database load</text><rect x="520" y="56" width="200" height="72" rx="8" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="620" y="82" text-anchor="middle" font-weight="600" fill="#1f1e1d">Lagging</text><text x="620" y="101" text-anchor="middle" font-size="11.5" fill="#6b6a66">stale views</text><text x="620" y="117" text-anchor="middle" font-size="11.5" fill="#6b6a66">flat database load</text><path d="M240 78H518" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#cr-arrow)"></path><text x="380" y="70" text-anchor="middle" font-size="11.5" fill="#6b6a66">feed slow or down</text><path d="M520 108H242" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#cr-arrow)"></path><text x="380" y="126" text-anchor="middle" font-size="11.5" fill="#6b6a66">feed catches up</text></svg>
