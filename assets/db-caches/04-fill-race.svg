<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="The fill race: a reader's stale fill lands after a writer's delete" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="fr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker><marker id="fr-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0703b"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">The fill race: a stale fill lands after the delete</text><g><rect x="60" y="48" width="120" height="32" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="120" y="69" text-anchor="middle" font-weight="600" fill="#1f1e1d">Reader A</text><rect x="240" y="48" width="120" height="32" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="300" y="69" text-anchor="middle" font-weight="600" fill="#1f1e1d">Cache</text><rect x="400" y="48" width="120" height="32" rx="8" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="460" y="69" text-anchor="middle" font-weight="600" fill="#1f1e1d">Database</text><rect x="580" y="48" width="120" height="32" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="640" y="69" text-anchor="middle" font-weight="600" fill="#1f1e1d">Writer B</text></g><g stroke="#b8b5ae" stroke-width="1" stroke-dasharray="3 3"><line x1="120" y1="80" x2="120" y2="340"></line><line x1="300" y1="80" x2="300" y2="300"></line><line x1="460" y1="80" x2="460" y2="340"></line><line x1="640" y1="80" x2="640" y2="340"></line></g><g fill="none" stroke="#b8b5ae" stroke-width="1.25"><path d="M120 116H298" marker-end="url(#fr-arrow)"></path><path d="M120 152H458" marker-end="url(#fr-arrow)"></path><path d="M460 178H122" marker-end="url(#fr-arrow)"></path><path d="M640 216H462" marker-end="url(#fr-arrow)"></path><path d="M640 254H302" marker-end="url(#fr-arrow)"></path></g><g font-size="11.5" fill="#6b6a66"><text x="210" y="109" text-anchor="middle">1 GET k: miss</text><text x="380" y="145" text-anchor="middle">2 SELECT k</text><text x="380" y="172" text-anchor="middle">v1</text><text x="550" y="209" text-anchor="middle">3 UPDATE k = v2</text><text x="550" y="247" text-anchor="middle">4 DELETE k</text><text x="310" y="270">key gone</text></g><path d="M120 292H298" fill="none" stroke="#e0703b" stroke-width="1.5" marker-end="url(#fr-arrow-accent)"></path><text x="210" y="285" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e0703b">5 SET k = v1</text><rect x="294" y="300" width="12" height="40" rx="2" fill="#e0703b" fill-opacity="0.15" stroke="#e0703b" stroke-width="1.5"></rect><text x="316" y="324" font-size="11.5" fill="#e0703b">stale v1 until the TTL expires</text><text x="380" y="372" text-anchor="middle" font-size="11.5" fill="#6b6a66">Fix: step 4 voids the lease from step 1, or leaves a v2 tombstone, so step 5 is rejected</text></svg>
