<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 376" role="img" aria-label="Cache-aside leaves misses and invalidation to the application" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Cache-aside leaves misses and invalidation to the application</text><g><rect x="280" y="48" width="200" height="56" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="380" y="72" text-anchor="middle" font-weight="600" fill="#1f1e1d">App</text><text x="380" y="90" text-anchor="middle" font-size="11.5" fill="#6b6a66">owns keys and invalidation</text></g><g fill="none" stroke="#b8b5ae" stroke-width="1.25"><path d="M480 76H600V174" marker-start="url(#ca-arrow)" marker-end="url(#ca-arrow)"></path><path d="M280 76H160V174" marker-start="url(#ca-arrow)" marker-end="url(#ca-arrow)"></path></g><text x="608" y="130" font-size="11.5" fill="#6b6a66">1 GET, 3 SET+TTL</text><text x="152" y="130" text-anchor="end" font-size="11.5" fill="#6b6a66">2 SELECT on miss</text><g><rect x="40" y="176" width="240" height="144" rx="8" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="160" y="244" text-anchor="middle" font-weight="600" fill="#1f1e1d">Postgres</text><text x="160" y="262" text-anchor="middle" font-size="11.5" fill="#6b6a66">complete, unaware of the cache</text></g><g><rect x="480" y="176" width="240" height="144" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="600" y="200" text-anchor="middle" font-weight="600" fill="#1f1e1d">ElastiCache</text><text x="600" y="218" text-anchor="middle" font-size="11.5" fill="#6b6a66">LRU eviction, TTLs</text><rect x="504" y="232" width="192"