<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="A page-cache replica can evict anything because storage is complete" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">A page-cache replica can evict anything because storage is complete</text><g><rect x="40" y="72" width="200" height="56" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="140" y="96" text-anchor="middle" font-weight="600" fill="#1f1e1d">Writer</text><text x="140" y="114" text-anchor="middle" font-size="11.5" fill="#6b6a66">generates redo</text></g><g><rect x="380" y="56" width="340" height="128" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="550" y="82" text-anchor="middle" font-weight="600" fill="#1f1e1d">Read replica</text><rect x="424" y="96" width="32" height="32" rx="4" fill="#2f6fd6" fill-opacity="0.18" stroke="#2f6fd6" stroke-width="1.5"></rect><rect x="468" y="96" width="32" height="32" rx="4" fill="#2f6fd6" fill-opacity="0.18" stroke="#2f6fd6" stroke-width="1.5"></rect><rect x="512" y="96" width="32" height="32" rx="4" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="3 3"></rect><rect x="556" y="96" width="32" height="32" rx="4" fill="#2f6fd6" fill-opacity="0.18" stroke="#2f6fd6" stroke-width="1.5"></rect><rect x="600" y="96" width="32" height="32" rx="4" fill="#2f6fd6" fill-opacity="0.18" stroke="#2f6fd6" stroke-width="1.5"></rect><rect x="644" y="96" width="32" height="32" rx="4" fill="none" stroke="#b8b5ae" stroke-width="1" stroke-dasharray="3 3"></rect><text x="550" y="160" text-anchor="middle" font-size="11.5" fill="#6b6a66">LRU page cache: solid cached, dashed evicted</text></g><g fill="none" stroke="#b8b5ae" stroke-width="1.25"><path d="M240 100H378" marker-end="url(#pc-arrow)"></path><path d="M140 128V238" marker-end="url(#pc-arrow)"></path><path d="M500 184V238" marker-end="url(#pc-arrow)"></path><path d="M600 240V186" marker-end="url(#pc-arrow)"></path></g><text x="309" y="90" text-anchor="middle" font-size="11.5" fill="#6b6a66">redo stream</text><text x="148" y="188" font-size="11.5" fill="#6b6a66">redo</text><text x="492" y="214" text-anchor="end" font-size="11.5" fill="#6b6a66">miss: GetPage@LSN</text><text x="608" y="214" font-size="11.5" fill="#6b6a66">page</text><g><rect x="40" y="240" width="680" height="56" rx="8" fill="#ecebe7" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="380" y="264" text-anchor="middle" font-weight="600" fill="#1f1e1d">Shared storage (complete)</text><text x="380" y="282" text-anchor="middle" font-size="11.5" fill="#6b6a66">serves any page at any LSN</text></g><text x="380" y="330" text-anchor="middle" font-size="11.5" fill="#6b6a66">Any SQL works: the executor never sees a miss, only a slower read</text></svg>