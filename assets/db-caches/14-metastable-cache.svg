<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 220" role="img" aria-label="A cache's two stable states: warm, and a cold state that holds itself in place" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ms-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5ae"></path></marker><marker id="ms-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0703b"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">A cache can get stuck cold</text><rect x="40" y="110" width="200" height="72" rx="8" fill="none" stroke="#b8b5ae" stroke-width="1.25"></rect><text x="140" y="136" text-anchor="middle" font-weight="600" fill="#1f1e1d">Warm</text><text x="140" y="155" text-anchor="middle" font-size="11.5" fill="#6b6a66">high hit rate</text><text x="140" y="171" text-anchor="middle" font-size="11.5" fill="#6b6a66">low database load</text><rect x="520" y="110" width="200" height="72" rx="8" fill="#e0703b" fill-opacity="0.12" stroke="#e0703b" stroke-width="1.5"></rect><text x="620" y="136" text-anchor="middle" font-weight="600" fill="#1f1e1d">Cold</text><text x="620" y="155" text-anchor="middle" font-size="11.5" fill="#6b6a66">misses flood the database</text><text x="620" y="171" text-anchor="middle" font-size="11.5" fill="#6b6a66">slow database, cache can't refill</text><path d="M240 132H518" fill="none" stroke="#b8b5ae" stroke-width="1.25" marker-end="url(#ms-arrow)"></path><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#6b6a66">restart, flush, new hot keys</text><path d="M520 162H242" fill="none" stroke="#b8b5ae" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ms-arrow)"></path><text x="380" y="180" text-anchor="middle" font-size="11.5" fill="#6b6a66">only by shedding load or warming by hand</text><path d="M590 110C590 60 650 60 650 108" fill="none" stroke="#e0703b" stroke-width="1.5" marker-end="url(#ms-arrow-accent)"></path><text x="620" y="62" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e0703b">slow database keeps the cache cold</text></svg>
