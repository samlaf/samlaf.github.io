<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 520" role="img" aria-label="Steal and force: which recovery work each choice needs, and where each system sits" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="19" y="30" font-size="15" font-weight="600" fill="#1f1e1d">Steal and force: what the log must hold</text>
<text x="19" y="50" font-size="11.5" fill="#6b6a66">Steal: uncommitted changes may reach disk, so recovery needs undo.</text>
<text x="19" y="66" font-size="11.5" fill="#6b6a66">No force: commit flushes only the log, so recovery needs redo.</text>

<text x="302.5" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Force</text>
<text x="302.5" y="116" text-anchor="middle" font-size="11" fill="#6b6a66">flush data pages at commit</text>
<text x="602.5" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">No force</text>
<text x="602.5" y="116" text-anchor="middle" font-size="11" fill="#6b6a66">flush only the log at commit</text>

<text x="19" y="190" font-size="13" font-weight="600" fill="#1f1e1d">No steal</text>
<text x="19" y="206" font-size="11" fill="#6b6a66">uncommitted pages</text>
<text x="19" y="220" font-size="11" fill="#6b6a66">stay in RAM</text>

<rect x="160" y="130" width="285" height="130" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="302.5" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">No log needed</text>
<text x="302.5" y="170" text-anchor="middle" font-size="11" fill="#6b6a66">commit swaps a root pointer</text>
<rect x="174" y="184" width="257" height="24" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="302.5" y="200" text-anchor="middle" font-size="11.5" fill="#1f1e1d">LMDB, CouchDB</text>

<rect x="460" y="130" width="285" height="130" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="602.5" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Redo only</text>
<text x="602.5" y="170" text-anchor="middle" font-size="11" fill="#6b6a66">replay committed work</text>
<rect x="474" y="184" width="257" height="24" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="602.5" y="200" text-anchor="middle" font-size="11.5" fill="#1f1e1d">SQLite WAL mode</text>
<rect x="474" y="214" width="257" height="24" rx="4" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="602.5" y="230" text-anchor="middle" font-size="11.5" fill="#1f1e1d">Aurora DSQL</text>

<text x="19" y="360" font-size="13" font-weight="600" fill="#1f1e1d">Steal</text>
<text x="19" y="376" font-size="11" fill="#6b6a66">uncommitted pages</text>
<text x="19" y="390" font-size="11" fill="#6b6a66">may reach disk</text>

<rect x="160" y="275" width="285" height="190" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="302.5" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Undo only</text>
<text x="302.5" y="315" text-anchor="middle" font-size="11" fill="#6b6a66">roll back unfinished work</text>
<rect x="174" y="329" width="257" height="24" rx="4" fill="#ece9f8" stroke="#6a5acd"/>
<text x="302.5" y="345" text-anchor="middle" font-size="11.5" fill="#3d2f99">SQLite rollback journal</text>

<rect x="460" y="275" width="285" height="190" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
<text x="602.5" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1e1d">Redo + undo</text>
<text x="602.5" y="315" text-anchor="middle" font-size="11" fill="#6b6a66">the ARIES quadrant</text>
<rect x="474" y="329" width="257" height="24" rx="4" fill="#ece9f8" stroke="#6a5acd"/>
<text x="602.5" y="345" text-anchor="middle" font-size="11.5" fill="#3d2f99">MySQL InnoDB, Vitess</text>
<rect x="474" y="359" width="257" height="24" rx="4" fill="#ece9f8" stroke="#6a5acd"/>
<text x="602.5" y="375" text-anchor="middle" font-size="11.5" fill="#3d2f99">Oracle, Oracle RAC</text>
<rect x="474" y="389" width="257" height="24" rx="4" fill="#e2f1ec" stroke="#2a8a72"/>
<text x="602.5" y="405" text-anchor="middle" font-size="11.5" fill="#1b5e4d">Postgres, Citus, Figma</text>
<rect x="474" y="419" width="257" height="24" rx="4" fill="#e2f1ec" stroke="#2a8a72"/>
<text x="602.5" y="435" text-anchor="middle" font-size="11.5" fill="#1b5e4d">CockroachDB</text>

<rect x="19" y="488" width="12" height="12" rx="2" fill="#ece9f8" stroke="#6a5acd"/>
<text x="37" y="498" font-size="11.5" fill="#6b6a66">undo log: old values copied aside</text>
<rect x="250" y="488" width="12" height="12" rx="2" fill="#e2f1ec" stroke="#2a8a72"/>
<text x="268" y="498" font-size="11.5" fill="#6b6a66">old versions kept in place</text>
<rect x="450" y="488" width="12" height="12" rx="2" fill="#f1f0ec" stroke="#b8b5ae"/>
<text x="468" y="498" font-size="11.5" fill="#6b6a66">nothing to undo</text>
</svg>
